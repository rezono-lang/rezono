[project]
name = "rede-admission"
version = "0.1.0"
description = "Rede admission: the rows of a fact document judged against a pack's schema bundle, with every refusal as a code (LS0)."
requires-python = ">=3.11"
dependencies = ["rede-canon"]  # never the compiler: a fact never needs it

[project.optional-dependencies]
test = ["pytest>=8", "pyyaml>=6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rede_admission"]

[tool.pytest.ini_options]
testpaths = ["tests"]
