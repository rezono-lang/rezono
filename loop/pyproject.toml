[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rezono-cluster"
version = "0.1.0"
description = "Pytest marker and opt-in for Rezono cluster fixtures"
requires-python = ">=3.11"
dependencies = ["pytest>=8"]

[project.entry-points.pytest11]
rezono_cluster = "rezono_cluster"

[tool.setuptools]
py-modules = ["rezono_cluster"]
