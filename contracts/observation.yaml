id: https://rezono.org/contracts/observation
name: rezono_observation
title: Observations and drift
description: >-
  A fact in the layer Observation: a measurement or the status that a reconciler reports, with its
  source and its event time, linked to the expectation it is compared with. Drift ("expected is not
  observed") is an ordinary derived relation with witnesses, so Why shows which observation, from
  which source, disagrees with which expectation. The event time comes from the source, never from
  the clock of the ingester.
prefixes:
  linkml: https://w3id.org/linkml/
  rezono: https://rezono.org/contracts/
default_prefix: rezono
default_range: string
imports:
  - linkml:types
  - value
  - proof
  - source
  - manifest

types:
  DecimalText:
    typeof: string
    pattern: "^(0|[1-9][0-9]*)$"

classes:
  CompletenessReceipt:
    description: >-
      Checked evidence that one read covered a whole population at one cut (decisions/scoped-completeness.md).
      Candidate bytes only: admission supplies the authority. The id is the SHA-256 of the canonical array
      ["rezono.completeness-receipt/1", body], with body holding the other six fields.
    attributes:
      id: {identifier: true, required: true, pattern: "^[0-9a-f]{64}$", description: Lowercase hexadecimal SHA-256 of the versioned canonical receipt body.}
      source: {range: Source, required: true, inlined: true, description: The locator and position of the read that is attested.}
      issuer: {range: ReceiptIssuer, required: true, inlined: true}
      scope: {range: ReceiptScope, required: true, inlined: true}
      cut: {range: ReceiptCut, required: true, inlined: true}
      inventory: {range: ArchivedFile, required: true, inlined: true, description: Pinned expected member keys in canonical order.}
      content: {range: ArchivedFile, required: true, inlined: true, description: Pinned canonical contents keyed by those members.}

  ReceiptIssuer:
    description: The identity that performed the read and the pinned declaration that authorizes it to enumerate the population.
    attributes:
      id: {required: true}
      authorization: {range: ArchivedFile, required: true, inlined: true}

  ReceiptScope:
    description: The query and its pinned definition, with typed bindings. A changed filter or binding changes the scope.
    attributes:
      definition: {range: ArchivedFile, required: true, inlined: true}
      query: {required: true}
      bindings: {range: ReceiptBinding, required: true, multivalued: true, inlined_as_list: true}

  ReceiptBinding:
    attributes:
      name: {required: true}
      type: {required: true}
      value: {required: true, description: "The canonical value, in its exact scalar spelling."}

  ReceiptCut:
    description: The immutable source revision, snapshot or log frontier at which the read is complete.
    attributes:
      frontier: {range: SourcePosition, required: true, inlined: true}

  Observation:
    tree_root: true
    attributes:
      id: {identifier: true, required: true, description: "Stable id, derived from source name and position."}
      subject: {required: true, description: The element id that is observed.}
      attribute: {required: true, description: The attribute or status that is observed (an element id of the schema).}
      value: {range: Value, required: true, inlined: true}
      event_time: {range: datetime, required: true, description: When it was true at the source. Never the ingest time.}
      source: {range: Source, required: true, inlined: true}
      expectation: {range: RowRef, required: true, inlined: true, description: "The expected row (desired state, plan, norm) this observation is compared with."}

  DriftRow:
    description: >-
      One row of a drift view, as the viewer reads it. The rule that derives it has a witness relation
      (contracts/rules.yaml) whose substitution names the observation and the expectation.
    attributes:
      expectation: {range: RowRef, required: true, inlined: true}
      expected: {range: Value, required: true, inlined: true}
      observed: {range: Value, required: true, inlined: true}
      observation: {required: true, description: The id of the observation.}
      event_time: {range: datetime, required: true}
