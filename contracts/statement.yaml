id: https://rezono.org/contracts/statement
name: rezono_statement
title: Epoch statement per role
description: >-
  The one document per published epoch and filtered role that a signature covers (docs/ring2/signing.md,
  "What is signed"): an in-toto Statement (v1) whose subjects are the objects of the
  role's publication form by their sha256, and whose predicate binds the role's manifest as its form carries it,
  the role's own snapshots, the schema id, the dataset and annotation hashes (publication L0 section 6.2), and the
  row tree: per table the RFC 9162 Merkle root over its hash rows, and the inclusion hash over those roots. Every
  value is text, so Rezono's canonical bytes are RFC 8785's. Nothing in it depends on a row the role may not read,
  and it never names `pack_sha256`. The publisher writes it beside the form's objects as `statement.json` and
  names it in the form's index; `rezono_publication.statement.verify` reads it back from the bytes alone.
prefixes:
  linkml: https://w3id.org/linkml/
  rezono: https://rezono.org/contracts/
default_prefix: rezono
default_range: string
imports:
  - linkml:types

types:
  Sha256:
    typeof: string
    pattern: "^[0-9a-f]{64}$"
  DecimalText:
    typeof: string
    pattern: "^(0|[1-9][0-9]*)$"
  SchemaId:
    typeof: string
    pattern: "^s-[0-9a-f]{64}$"
  DatasetHash:
    typeof: string
    pattern: "^d-[0-9a-f]{64}$"
  ManifestId:
    typeof: string
    pattern: "^m-(0|[1-9][0-9]*)$"
  KnowledgeTime:
    typeof: string
    description: >-
      The manifest's knowledge time as its form carries it: RFC 3339, in UTC with `Z` or with the offset it was
      written with (the publish path passes `git log --format=%cI`, which writes an offset such as `+01:00`).
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]*[1-9])?(Z|[+-][0-9]{2}:[0-9]{2})$"
  Name:
    typeof: string
    pattern: "^[a-z][a-z0-9]*([_-][a-z0-9]+)*$"
  RelationName:
    typeof: string
    description: A relation as a snapshot names it, a kind's table or a slot's (`kind__slot`), as in rules.yaml.
    pattern: "^[a-z][a-z0-9]*((_|__)[a-z0-9]+)*$"

classes:
  EpochStatement:
    tree_root: true
    description: An in-toto Statement v1 over one role's published form, with Rezono's epoch predicate.
    attributes:
      _type: {required: true, equals_string: "https://in-toto.io/Statement/v1"}
      subject:
        range: Subject
        multivalued: true
        inlined_as_list: true
        required: true
        description: Every object the role's form index names except the statement itself, sorted by name.
      predicateType: {required: true, equals_string: "https://rezono.org/epoch-statement/v1"}
      predicate: {required: true, range: EpochPredicate, inlined: true}

  Subject:
    description: One object of the role's form, under its file name in the role's prefix.
    attributes:
      name: {required: true, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$", description: "The object's file name, as the index names it."}
      digest: {required: true, range: Digest, inlined: true}

  Digest:
    attributes:
      sha256: {required: true, range: Sha256, description: The SHA-256 of the object's published bytes.}

  EpochPredicate:
    description: >-
      What one role's publication is, from what that role reads and nothing more. Version 1 of the predicate
      (the version is in `predicateType`): `previous`, `compiler`, `source` and `checks` are not in it, not even
      empty; a later version adds what a question needs.
    attributes:
      format: {required: true, equals_string: rezono.epoch-statement/1}
      pack: {required: true, range: Name}
      role: {required: true, range: Name, description: "A filtered role; the complete role's statement is never made."}
      manifest: {required: true, range: ManifestId}
      epoch: {required: true, range: DecimalText, description: "The manifest's epoch, as text."}
      knowledge_time: {required: true, range: KnowledgeTime, description: "The manifest's knowledge time, as its form carries it."}
      definition: {required: true, range: Sha256, description: "The manifest's `definition_sha256`, the schema pin of the definition."}
      role_manifest:
        required: true
        range: Sha256
        description: >-
          The canonical hash of the manifest as the role's form index carries it (`role_manifest`: id, epoch,
          knowledge time, definition hash and compiled files, and the role); never the stored manifest, which names
          `pack_sha256` and the other roles' files.
      snapshots:
        range: SnapshotPin
        multivalued: true
        inlined_as_list: true
        required: true
        description: The role's own snapshots the form was made from, sorted by relation, as the index's `sources`.
      schema: {required: true, range: SchemaId, description: "The schema id of the role's form (L0 section 2.2)."}
      dataset: {required: true, range: DatasetHash, description: "The role's dataset hash (L0 section 6.2, step 5); unchanged by the statement."}
      annotation: {required: true, range: Sha256, description: "The annotation hash over `$why` and `$src` (L0 section 6.2)."}
      roots:
        required: true
        range: TableRoots
        inlined: true
        description: >-
          Per table of L0 section 6.2, the kind and relation tables and `$why` and `$src`, the RFC 9162 Merkle tree
          hash over its hash rows in hash order: a leaf is SHA-256(0x00 ‖ CJ(row)), a node SHA-256(0x01 ‖ left ‖
          right), an empty table SHA-256().
      inclusion: {required: true, range: Sha256, description: "`H({\"dataset\", \"roots\"})`, the canonical hash over the dataset hash and the roots."}
      allowed:
        required: false
        range: Sha256
        description: >-
          Optional at the base schema level for version 1 compatibility; always present in version 3 (`EpochPredicateV3`),
          holding the SHA-256 of the role's canonical `allowed.json` bytes.

  SnapshotPin:
    attributes:
      relation: {required: true, range: RelationName}
      sha256: {required: true, range: Sha256}

  TableRoots:
    class_uri: linkml:Any
    description: >-
      Table name to root (64 hex): a kind, a kind and its many-valued slot (`Kind__slot`), `$why` and `$src`. Its
      keys are the schema's tables, so the contract holds the map's shape only; `rezono_publication.statement.verify`
      recomputes every root from the rows.

  EpochStatementV2:
    description: >-
      Version 2 of the in-toto Statement v1 over one role's published form (decisions/publication-role-diffs.md):
      keeps every field of version 1 and adds optional per-role epoch-chain links (`previous` and `diff`) in its
      predicate.
    attributes:
      _type: {required: true, equals_string: "https://in-toto.io/Statement/v1"}
      subject:
        range: Subject
        multivalued: true
        inlined_as_list: true
        required: true
        description: Every object the role's form index names except the statement itself, sorted by name (including `diff.json` on chained epochs).
      predicateType: {required: true, equals_string: "https://rezono.org/epoch-statement/v2"}
      predicate: {required: true, range: EpochPredicateV2, inlined: true}

  EpochPredicateV2:
    description: >-
      Version 2 of the epoch predicate (`rezono.epoch-statement/2`): preserves every field of version 1 and adds
      optional `previous` and `diff` for chained epochs. Both fields are present together on chained epochs and
      both are omitted on a role's initial epoch (never empty placeholders).
    attributes:
      format: {required: true, equals_string: rezono.epoch-statement/2}
      pack: {required: true, range: Name}
      role: {required: true, range: Name, description: "A filtered role; the complete role's statement is never made."}
      manifest: {required: true, range: ManifestId}
      epoch: {required: true, range: DecimalText, description: "The manifest's epoch, as text."}
      knowledge_time: {required: true, range: KnowledgeTime, description: "The manifest's knowledge time, as its form carries it."}
      definition: {required: true, range: Sha256, description: "The manifest's `definition_sha256`, the schema pin of the definition."}
      role_manifest:
        required: true
        range: Sha256
        description: >-
          The canonical hash of the manifest as the role's form index carries it (`role_manifest`: id, epoch,
          knowledge time, definition hash and compiled files, and the role); never the stored manifest, which names
          `pack_sha256` and the other roles' files.
      snapshots:
        range: SnapshotPin
        multivalued: true
        inlined_as_list: true
        required: true
        description: The role's own snapshots the form was made from, sorted by relation, as the index's `sources`.
      schema: {required: true, range: SchemaId, description: "The schema id of the role's form (L0 section 2.2)."}
      dataset: {required: true, range: DatasetHash, description: "The role's dataset hash (L0 section 6.2, step 5); unchanged by the statement."}
      annotation: {required: true, range: Sha256, description: "The annotation hash over `$why` and `$src` (L0 section 6.2)."}
      roots:
        required: true
        range: TableRoots
        inlined: true
        description: >-
          Per table of L0 section 6.2, the kind and relation tables and `$why` and `$src`, the RFC 9162 Merkle tree
          hash over its hash rows in hash order: a leaf is SHA-256(0x00 ‖ CJ(row)), a node SHA-256(0x01 ‖ left ‖
          right), an empty table SHA-256().
      inclusion: {required: true, range: Sha256, description: "`H({\"dataset\", \"roots\"})`, the canonical hash over the dataset hash and the roots."}
      previous:
        required: false
        range: Sha256
        description: >-
          Chained epochs only: SHA-256 of the canonical `statement.json` bytes of this same role's immediately
          preceding main epoch publication. Omitted on a role's initial epoch; always paired with `diff`.
      diff:
        required: false
        range: Sha256
        description: >-
          Chained epochs only: SHA-256 of this role's canonical `diff.json` bytes (`rezono.role-diff/1`) for the
          transition from that previous epoch to this epoch. Omitted on a role's initial epoch; always paired with
          `previous`.

  EpochStatementV3:
    description: >-
      Version 3 of the in-toto Statement v1 over one role's published form (decisions/loop-engine-epoch.md, section 4):
      keeps every field of version 2 (`previous` and `diff` both or neither) and adds `allowed` in its predicate.
    attributes:
      _type: {required: true, equals_string: "https://in-toto.io/Statement/v1"}
      subject:
        range: Subject
        multivalued: true
        inlined_as_list: true
        required: true
        description: >-
          Every object the role's form index names except the statement itself, sorted by name (including `allowed.json`,
          and `diff.json` on chained epochs).
      predicateType: {required: true, equals_string: "https://rezono.org/epoch-statement/v3"}
      predicate: {required: true, range: EpochPredicateV3, inlined: true}

  EpochPredicateV3:
    description: >-
      Version 3 of the epoch predicate (`rezono.epoch-statement/3`): preserves every field of version 2 (including
      optional paired `previous` and `diff` on chained epochs) and requires `allowed`, the SHA-256 of the role's
      canonical `allowed.json` bytes proving `publish_allowed` for this role and epoch.
    attributes:
      format: {required: true, equals_string: rezono.epoch-statement/3}
      pack: {required: true, range: Name}
      role: {required: true, range: Name, description: "A filtered role; the complete role's statement is never made."}
      manifest: {required: true, range: ManifestId}
      epoch: {required: true, range: DecimalText, description: "The manifest's epoch, as text."}
      knowledge_time: {required: true, range: KnowledgeTime, description: "The manifest's knowledge time, as its form carries it."}
      definition: {required: true, range: Sha256, description: "The manifest's `definition_sha256`, the schema pin of the definition."}
      role_manifest:
        required: true
        range: Sha256
        description: >-
          The canonical hash of the manifest as the role's form index carries it (`role_manifest`: id, epoch,
          knowledge time, definition hash and compiled files, and the role); never the stored manifest, which names
          `pack_sha256` and the other roles' files.
      snapshots:
        range: SnapshotPin
        multivalued: true
        inlined_as_list: true
        required: true
        description: The role's own snapshots the form was made from, sorted by relation, as the index's `sources`.
      schema: {required: true, range: SchemaId, description: "The schema id of the role's form (L0 section 2.2)."}
      dataset: {required: true, range: DatasetHash, description: "The role's dataset hash (L0 section 6.2, step 5); unchanged by the statement."}
      annotation: {required: true, range: Sha256, description: "The annotation hash over `$why` and `$src` (L0 section 6.2)."}
      roots:
        required: true
        range: TableRoots
        inlined: true
        description: >-
          Per table of L0 section 6.2, the kind and relation tables and `$why` and `$src`, the RFC 9162 Merkle tree
          hash over its hash rows in hash order: a leaf is SHA-256(0x00 ‖ CJ(row)), a node SHA-256(0x01 ‖ left ‖
          right), an empty table SHA-256().
      inclusion: {required: true, range: Sha256, description: "`H({\"dataset\", \"roots\"})`, the canonical hash over the dataset hash and the roots."}
      previous:
        required: false
        range: Sha256
        description: >-
          Chained epochs only: SHA-256 of the canonical `statement.json` bytes of this same role's immediately
          preceding main epoch publication. Omitted on a role's initial epoch; always paired with `diff`.
      diff:
        required: false
        range: Sha256
        description: >-
          Chained epochs only: SHA-256 of this role's canonical `diff.json` bytes (`rezono.role-diff/1`) for the
          transition from that previous epoch to this epoch. Omitted on a role's initial epoch; always paired with
          `previous`.
      allowed:
        required: true
        range: Sha256
        description: >-
          Always present in version 3: SHA-256 of the role's canonical `allowed.json` bytes (`rezono.epoch-allowed/1`),
          proving `publish_allowed` for this role and epoch.
