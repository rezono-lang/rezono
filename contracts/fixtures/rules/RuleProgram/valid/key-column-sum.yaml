# A sum over a key column the aggregate ranges over: per entry the sum of its line amounts, also when
# two lines have the same amount (the line is in the key, so both rows count).
format: rede.rules/1
pack: example
relations:
- name: entry
  role: base
  key:
  - {name: id, type: string}
- name: line
  role: base
  key:
  - {name: entry, type: string}
  - {name: line, type: string}
  - {name: amount, type: integer}
- name: entry_total
  role: derived
  key:
  - {name: entry, type: string}
  - {name: total, type: integer}
  module: journal
  explain: materialize
rules:
- id: entry_total
  module: journal
  stratum: '1'
  head:
    relation: entry_total
    terms: ['?e', '?t']
  body:
  - relation: entry
    terms: ['?e']
    polarity: positive
    stratum: '0'
  aggregates:
  - relation: line
    terms: ['?e', _, _]
    function: sum
    over: amount
    as: ?t
    stratum: '0'
  witness:
    relation: entry_total__witness
    variables: ['?e', '?t']
  origin: {file: rules/journal.dl, line: '2'}
