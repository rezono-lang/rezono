# A budget in build memory (decision E6): the estimate per pipeline, no view count.
format: rede.pipelines/1
build_memory_mb: "6000"
pipelines:
  - {name: integrity, sql: [engine/tables.sql, engine/integrity.sql], modules: [], views: [], tables: [alpha, beta__alpha], imports: [], exports: [], build_mb: "1800"}
  - {name: rules-1, sql: [engine/rules-1.sql], modules: [a_first], views: [pair, sized], tables: [alpha, beta__alpha], imports: [], exports: [pair], build_mb: "5900"}
  - {name: rules-2, sql: [engine/rules-2.sql], modules: [b_second], views: [paired, lonely], tables: [alpha], imports: [pair], exports: [], build_mb: "4200"}
forward:
  - {relation: pair, producer: rules-1, consumers: [rules-2]}
epoch_table: epoch__in
export_view: export__out
