# A sealed pack above the limit with calculation rules: integrity forwards the accepted and refused rows,
# the parts forward what the calculation reads, and the calculation is the last pipeline.
format: rezono.pipelines/1
max_views: "4"
pipelines:
  - {name: integrity, sql: [engine/tables.sql, engine/integrity.sql, engine/integrity-export.sql], modules: [], views: [], tables: [alpha, alpha__row_sha256, alpha__size], imports: [], exports: [alpha__accepted, alpha__refused]}
  - {name: rules-1, sql: [engine/rules-1.sql], modules: [r], views: [counted, late], tables: [alpha__size], imports: [alpha__accepted, alpha__refused], exports: [counted]}
  - {name: rules-2, sql: [engine/rules-2.sql], modules: [r], views: [small, kept], tables: [], imports: [alpha__accepted, counted], exports: [kept]}
  - {name: calc, sql: [engine/tables.sql, engine/calc-imports.sql, engine/calc.sql], modules: [], views: [], tables: [alpha, calc__as_of], imports: [kept], exports: []}
forward:
  - {relation: alpha__accepted, producer: integrity, consumers: [rules-1, rules-2]}
  - {relation: alpha__refused, producer: integrity, consumers: [rules-1]}
  - {relation: counted, producer: rules-1, consumers: [rules-2]}
  - {relation: kept, producer: rules-2, consumers: [calc]}
epoch_table: epoch__in
export_view: export__out
