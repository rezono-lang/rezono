name: metrics-in
version: 1.0.0
kind: in
runs_on: source
writes: observation
row_source: source
runtime: in_process
consumes: [prometheus_query]
produces: [cpu_utilisation]
freshness: {cadence: live, max_delay_seconds: 60}
mapping_owner: platform-team
losses:
  - {subject: structure, what: "The counts per histogram bucket: only their sum per series arrives.", fate: dropped}
secrets: [metrics_token]
