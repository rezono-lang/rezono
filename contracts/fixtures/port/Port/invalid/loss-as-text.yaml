name: metrics-in
version: 1.0.0
kind: in
runs_on: source
writes: observation
row_source: source
runtime: in_process
consumes: [prometheus_query]
produces: [cpu_utilisation]
freshness: {cadence: live, max_delay_seconds: 60}
mapping_owner: platform-team
losses: [histogram buckets are summed to one value per series]
secrets: [metrics_token]
