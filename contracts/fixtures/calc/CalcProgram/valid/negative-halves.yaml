# Negative integers are allowed; round(ratio(-1, 1, 2)) is round(-1/2) = -1 (half away from zero).
format: rezono.calc/1
pack: fixture
subject: purchase
rules:
  - id: correction@2026-v1
    rule: correction
    version: 2026-v1
    output: correction.cents
    unit: cents
    valid_from: "2026-01-01"
    valid_until: "2027-01-01"
    known_from: "2025-12-01"
    definitions:
      - name: half_cent_refund
        when: {boolean: true}
        value:
          op: round
          args:
            - {op: ratio, args: [{integer: "-1"}, {integer: "1"}, {integer: "2"}]}
