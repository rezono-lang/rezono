# A decision table has one of four hit policies; a policy the text of Rezono does not have is never read as another one.
format: rezono.module/1
module:
  pack: lab
  use: []
  decls:
    - extend: Host
      derived:
        - derived: band
          type: Tier
          table: {table: any, inputs: [{path: [roomy]}], output: band, rows: [{tests: [[{lit: "true"}]], value: {lit: high}}]}
spans: []
