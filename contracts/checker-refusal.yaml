id: https://rezono.org/contracts/checker-refusal
name: rezono_checker_refusal
title: Checker refusals
description: >-
  Register of every refusal code emitted by the checker, with its named arguments and reader
  scope (decisions/checker-refusal-register.md). Sentences in English and Dutch live in
  checker/rezono_checker/messages/en.json and nl.json.
prefixes:
  linkml: https://w3id.org/linkml/
  rezono: https://rezono.org/contracts/
default_prefix: rezono
default_range: string
imports:
  - linkml:types

enums:
  RefusalCode:
    description: Every refusal code emitted by the checker, with allowed argument names and scope.
