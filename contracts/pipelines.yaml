id: https://rezono.org/contracts/pipelines
name: rezono_pipelines
title: Pipeline partition
description: >-
  engine/pipelines.json: how the compiler cuts a pack's engine program into Feldera pipelines. Up to the budget from the deploy profile (a build memory with a cost per kind of view, or
  `max_views` rule views) there is one pipeline, `main`.
  Above it, `integrity` keeps the tables and violation views, and each `rules-<n>` holds whole recursive
  cores, reading only earlier parts. `integrity` also computes a seal's refused and accepted rows and
  exports them to the parts that read them; calculation rules get the last pipeline, `calc`. A part keeps its number across compiles (compile --previous), so
  the numbers may have gaps. A part that
  others read exports those relations in one view with an epoch marker; `forward` says which relation
  goes from which part to which parts. The relay of the engine reads this file. Integers are decimal text.
prefixes:
  linkml: https://w3id.org/linkml/
  rezono: https://rezono.org/contracts/
default_prefix: rezono
default_range: string
imports:
  - linkml:types

types:
  DecimalText:
    typeof: string
    pattern: "^(0|[1-9][0-9]*)$"
  EngineName:
    typeof: string
    pattern: "^[a-z][a-z0-9]*((_|__)[a-z0-9]+)*$"

classes:
  PipelinePlan:
    tree_root: true
    attributes:
      format: {required: true, pattern: "^rezono\\.pipelines/1$"}
      max_views: {range: DecimalText, description: "The view budget the partition used, when it counted views."}
      build_memory_mb: {range: DecimalText, description: "The build memory per pipeline the partition used, when it weighed views by kind."}
      profile: {description: "The deploy profile the budget came from (deploy/profiles/<profile>.yaml), if any."}
      pipelines: {range: Pipeline, multivalued: true, inlined_as_list: true, required: true}
      forward: {range: Forward, multivalued: true, inlined_as_list: true}
      epoch_table: {range: EngineName, required: true, description: "The input table for the epoch marker (epoch__in)."}
      export_view: {range: EngineName, required: true, description: "The tagged export view of a producing part (export__out)."}

  Pipeline:
    attributes:
      name: {required: true, pattern: "^(main|integrity|rules-[1-9][0-9]*|calc)$"}
      sql: {multivalued: true, required: true, description: "The compiled files of its program, in order (engine/…)."}
      modules: {multivalued: true, description: "The rule modules it computes."}
      views: {range: EngineName, multivalued: true, description: "Its derived relations, in evaluation order."}
      tables: {range: EngineName, multivalued: true, description: "The tables it reads, so facts are sent to it: kinds, slots, parameters and, where the checks are, the check metadata `rezono__*` (E11)."}
      imports: {range: EngineName, multivalued: true, description: "Relations it reads from an earlier pipeline: derived relations, or a seal's relations from integrity."}
      exports: {range: EngineName, multivalued: true, description: "Relations later pipelines read from it."}
      build_mb: {range: DecimalText, description: "Its estimated build memory, when the budget is a build memory."}

  Forward:
    attributes:
      relation: {range: EngineName, required: true}
      producer: {required: true}
      consumers: {multivalued: true, required: true}
