id: https://rezono.org/contracts/rules
name: rezono_rules
title: Rule IR
description: >-
  The derivation rules of a pack after parsing and checking: what the compiler hands to the
  translator (rules -> SQL), the checker and the explainer. One document per pack. Relations are
  sorted by name and rules by id. A term is a string: '?name' is a variable, '_' ranges over a group
  (aggregates only), anything else is a constant, typed by its column. A constant never starts with
  '?' and is never exactly '_'. Every integer is decimal text, also strata and line numbers.
  Semantics: stratified Datalog with set semantics (docs/formal.md §3); the checks the compiler makes
  are in docs/archive/m2-pipelines-and-rule-ir.md.
prefixes:
  linkml: https://w3id.org/linkml/
  rezono: https://rezono.org/contracts/
default_prefix: rezono
default_range: string
imports:
  - linkml:types

types:
  DecimalText:
    typeof: string
    pattern: "^(0|[1-9][0-9]*)$"
    description: A natural number as decimal text, so that JavaScript never loses precision.
  Name:
    typeof: string
    pattern: "^[a-z][a-z0-9]*(_[a-z0-9]+)*$"
    description: snake_case; '__' is reserved as the separator in generated names.
  RelationName:
    typeof: string
    pattern: "^[a-z][a-z0-9]*((_|__)[a-z0-9]+)*$"
    description: >-
      The engine name of the relation. A base relation may be an arrow or attribute table of M1
      (`kind__slot`); a derived relation is a Name.
  Variable:
    typeof: string
    pattern: "^\\?[a-z][a-z0-9_]*$"
  Term:
    typeof: string
    pattern: "^(\\?[a-z][a-z0-9_]*|[^?].*|)$"
    description: A variable, '_' (aggregates only) or a constant, which never starts with '?'.

enums:
  World:
    description: Meaning of a missing row.
    permissible_values:
      closed: {description: A missing row is not true.}
      open: {description: A row that is there is true; a missing row is unknown.}
  RelationRole:
    permissible_values:
      base: {description: "An input table: a kind, an arrow or attribute table, a parameter table or an imported relation."}
      calc: {description: "An open input from a calculation selection, read positively with a known value and empty reason. The value column is integer or rational."}
      derived: {description: Defined by rules; a set.}
      functional: {description: "A rezono.rules/2 functional derivation over a mandatory closed finite domain, co-locating (key..., state, reason, value)."}
  ConflictPolicy:
    description: "How a functional derivation handles invalid (conflicting) candidate rows at publication."
    permissible_values:
      publish: {description: "Emit the invalid row carrying all competing candidates as conflict witness."}
      block: {description: "Emit an invalid-check view so any invalid row blocks publication."}
  EmptyState:
    description: "The state emitted by a functional derivation when zero candidates match a domain key."
    permissible_values:
      unknown: {}
      not_applicable: {}
  ColumnType:
    permissible_values:
      string: {}
      integer: {description: BIGINT in the engine; decimal text in JSON.}
      rational: {description: "An exact calculation value or its copy in a derived key. Canonical text: an integer, or a reduced fraction with a positive denominator greater than one."}
      boolean: {description: BOOLEAN in the engine; the canonical text true or false in a term.}
      date: {description: DATE in the engine; canonical ISO calendar day YYYY-MM-DD in JSON.}
  Polarity:
    permissible_values:
      positive: {}
      negative: {description: Negation as failure over a lower stratum.}
  AggregateFunction:
    permissible_values:
      count: {description: The number of rows in the group. An empty group gives 0.}
      sum: {description: Sum of an integer value column. An empty group gives 0.}
      min: {description: An empty group gives no conclusion.}
      max: {description: An empty group gives no conclusion.}
  ComparisonOperator:
    permissible_values:
      eq: {}
      ne: {}
      lt: {}
      le: {}
      gt: {}
      ge: {}
  CompareAs:
    description: >-
      The declared comparison type of a condition (decisions/ordered-rule-scalars.md). Both operands are text
      variables bound by positive literals; the operator applies to the resulting order.
    permissible_values:
      binary_text: {description: "The UTF-8 bytes of the text: the first differing byte decides, a proper prefix sorts first. No locale, no normalization."}
      utc_instant: {description: "YYYY-MM-DDTHH:mm:ss[.digits]Z on a Gregorian day in years 0001 to 9999, seconds 00 to 59. Ordered by the bytes without the Z and without trailing fraction zeros (and the separator of an empty fraction). A malformed value satisfies no operator, ne included."}
  ArithmeticOperator:
    description: >-
      Bounded integer arithmetic. In a recursive rule only as a counter with an explicit bound:
      the rule adds a positive constant to a key column it reads from its own relation, under a constant
      upper bound, and every other rule of the relation starts that column at a constant.
    permissible_values:
      add: {}
      sub: {}
      mul: {}
      div: {description: "Integer division as in Feldera: the quotient truncated toward zero, operands of either sign. The divisor (right) is a non-zero integer constant, so no engine divides by zero."}
      days: {description: "A view's reading of a date, never written in a rule file: the whole number of days from the ISO date `right` (the constant 1970-01-01) to the ISO date `left` (a text variable that a positive literal binds to a date cell), in the proleptic Gregorian calendar."}
  ExplainMode:
    permissible_values:
      materialize: {description: The engine keeps the witness relations of the rules of this relation.}
      on_demand: {description: "The explainer finds witnesses when asked, with the witness query."}

slots:
  rules:
    range: Rule
    multivalued: true
    inlined_as_list: true

classes:
  RuleProgram:
    tree_root: true
    slots: [rules]
    attributes:
      format: {required: true, pattern: "^rezono\\.rules/[12]$"}
      pack: {required: true}
      relations: {range: Relation, multivalued: true, inlined_as_list: true, required: true}
      seals: {range: Seal, multivalued: true, inlined_as_list: true, description: "The sealed kind, so the checker can recompute row hashes and refused and accepted input from the snapshots."}
    rules:
      - description: Every rule in rezono.rules/1 names its witness relation.
        preconditions: {slot_conditions: {format: {equals_string: "rezono.rules/1"}, rules: {value_presence: PRESENT}}}
        postconditions: {slot_conditions: {rules: {range_expression: {slot_conditions: {witness: {required: true}}}}}}

  Seal:
    description: >-
      A sealed kind (docs/compiler.md#design-m3-the-seal), by the tables the checker reads. A
      close applies to an element when the element's period lies before the close's closed_until or the close
      covers it, and refuses it unless that close covers it with its current row hash; each close on its own.
      The row hash is the canonical JSON of {table: sorted values as canonical text} over `tables`,
      leaving out tables without a row; a subkind's table gives the empty list. Refused holds (element,
      close); accepted holds every other element.
    attributes:
      kind: {range: RelationName, required: true, description: The table of the kind's elements.}
      period: {range: RelationName, required: true, description: "The date table (id, v) of the period."}
      row_sha256: {range: RelationName, required: true, description: "The loader's table (id, v) of row hashes."}
      tables: {range: RelationName, multivalued: true, required: true, description: "The attribute and arrow tables of the kind and its subkinds, and the subkinds' own tables (membership): the row."}
      closed_until: {range: RelationName, required: true}
      covers: {range: RelationName, required: true, description: "(close, cover)"}
      element: {range: RelationName, required: true, description: "(cover, element)"}
      sha256: {range: RelationName, required: true, description: "(cover, hash)"}
      refused: {range: RelationName, required: true, description: "A base relation (id, period_close)."}
      accepted: {range: RelationName, required: true, description: "A base relation (id)."}
      parts: {range: SealPart, multivalued: true, inlined_as_list: true, description: "The kinds whose elements are parts of a sealed element (`sealed_with`, docs/compiler.md#parts), an owner before its parts. Their rows belong to the row: per table of a part, the rows of the element's parts as [id, values] lists of canonical text, sorted."}

  SealPart:
    description: >-
      A part of a sealed element (docs/compiler.md#parts): it reaches its element through `arrow`, to the
      sealed kind or to an earlier part (`owner`), and counts only when that owner is accepted.
    attributes:
      kind: {range: RelationName, required: true, description: The table of the part kind's elements.}
      arrow: {range: RelationName, required: true, description: "The arrow table (id, owner id)."}
      owner: {range: RelationName, required: true, description: The sealed kind or an earlier part.}
      tables: {range: RelationName, multivalued: true, required: true, description: "The part's attribute and arrow tables and its subkinds' own tables, in the row of its element."}
      accepted: {range: RelationName, required: true, description: "A base relation (id): the parts of accepted owners."}

  Column:
    attributes:
      name: {range: Name, required: true}
      type: {range: ColumnType, required: true}

  Relation:
    description: >-
      A relation with key columns (terms bind them by position) and, for base relations only, value
      columns: named Values with a state (contracts/value.yaml), at most one row per key, read by
      aggregates through `over`. A derived relation is a set without value columns.
    attributes:
      name: {range: RelationName, identifier: true, required: true}
      role: {range: RelationRole, required: true}
      key: {range: Column, multivalued: true, inlined_as_list: true, required: true}
      values: {range: Column, multivalued: true, inlined_as_list: true}
      module: {range: Name, description: The rule module (rules/<module>.dl) that defines a derived relation.}
      explain: {range: ExplainMode, description: Derived relations only.}
      extend: {range: boolean, description: "Derived relations only. The owning pack permits consuming packs to add rules (S28, // @extend); without rules the relation is empty."}
      invariant: {range: boolean, description: "Derived relations only. True: the relation must be empty at the end of an epoch, or the epoch is not published (`// @invariant` above the .decl)."}
      world: {range: World, description: "What a missing row means. A base relation has the world of its schema (`world: open`); a derived relation is open if a rule reads an open relation positively or aggregates over one. Left out: closed."}
      absence: {range: boolean, description: "Derived relations only. True: the relation says what is not recorded (`// @absence` above the .decl), so it is closed and may negate an open relation."}
      outcome: {range: RelationName, description: "Derived relations only. A named outcome (`// @outcome <kind>`): the kind whose every element has exactly one state; the columns are the element, `state` (known, unknown, not_applicable) and `reason`."}
      closes: {range: RelationName, description: "Derived relations only, and not on an invariant or an outcome. Another derived relation (`// @closes <relation>` above the .decl): a row of this relation states, for its key, that no row of that relation holds there. Its key columns are, by position and type, a prefix of that relation's. The program then holds the invariant `<this>_closes_<relation>` with one rule: a row of this relation and a row of that one at the same key."}
      release: {range: Release, multivalued: true, inlined_as_list: true, description: "Reserved, not supported yet: the compiler, the publisher and the checker refuse it. Derived relations only. A delimited release under O8 (`// @release <role>`): the role may read this relation's rows even where they negate or aggregate over relations it does not read in full (docs/architecture.md, access and privacy)."}
      domain: {range: RelationName, description: "Functional relations only. Mandatory closed finite base or strictly lower-stratum derived relation whose key columns match this relation's key."}
      value: {range: Column, inlined: true, description: "Functional relations only. The single typed value column co-located with state and reason."}
      conflict_policy: {range: ConflictPolicy, description: "Functional relations only. Whether invalid rows publish with full conflict witnesses or block publication."}
      empty_state: {range: EmptyState, description: "Functional relations only. State emitted when zero candidates match a domain key (default unknown)."}
      empty_reason: {range: Name, description: "Functional relations only. Reason code emitted when zero candidates match a domain key."}
    rules:
      - description: A functional relation declares its closed domain, value column and conflict policy.
        preconditions: {slot_conditions: {role: {equals_string: functional}}}
        postconditions: {slot_conditions: {domain: {required: true}, value: {required: true}, conflict_policy: {required: true}}}

  Release:
    description: >-
      Reserved (O8, delimited release; not supported yet). One role that may read the rows of a derived
      relation without reading in full what they negate or aggregate over. The design and the checker's
      obligations are in docs/architecture.md, access and privacy.
    attributes:
      role: {range: Name, required: true}

  Atom:
    attributes:
      relation: {range: RelationName, required: true}
      terms: {range: Term, multivalued: true}

  Literal:
    is_a: Atom
    attributes:
      polarity: {range: Polarity, required: true}
      stratum: {range: DecimalText, required: true, description: The stratum of the relation; the checker re-derives it.}

  Aggregate:
    is_a: Atom
    description: >-
      An aggregate over the rows of a lower stratum that match the fixed terms. A variable term is
      the group key and must be bound by a positive literal of the same rule; '_' ranges over the group.
      `sum`, `min` and `max` read an integer column: a value column, or a key column whose term is '_'
      (in Datalog a variable local to the aggregate, `s = sum a : { line(e, _, a) }`). Every row of the
      group counts once, also when two rows have the same value.
    attributes:
      function: {range: AggregateFunction, required: true}
      over: {range: Name, description: "An integer column of the relation: a value column, or a key column whose term is '_'. Not for count."}
      as: {range: Variable, required: true, description: A fresh variable bound to the result.}
      stratum: {range: DecimalText, required: true}

  Condition:
    attributes:
      op: {range: ComparisonOperator, required: true}
      left: {range: Term, required: true}
      right: {range: Term, required: true}
      compare_as: {range: CompareAs, description: "Absent: the untyped comparison (equality of text, order of integers)."}

  Assignment:
    attributes:
      var: {range: Variable, required: true, description: A fresh variable.}
      op: {range: ArithmeticOperator, required: true}
      left: {range: Term, required: true}
      right: {range: Term, required: true}

  Origin:
    attributes:
      file: {required: true}
      line: {range: DecimalText, required: true}

  Witness:
    description: >-
      The witness relation of a rule, `<rule id>__witness`, with one column per variable of the rule
      in this order. One row is one substitution θ. Premises (also the absent ones of negative
      literals), the aggregate group keys and the conclusion all follow from the rule and θ.
      A rule without variables has the empty substitution: in SQL one row with the single column
      empty_substitution = TRUE, since SQL has no relation without columns.
    attributes:
      relation: {required: true, pattern: "^[a-z][a-z0-9]*(_[a-z0-9]+)*__witness$"}
      variables: {range: Variable, multivalued: true}

  Rule:
    attributes:
      id: {range: Name, identifier: true, required: true}
      module: {range: Name, required: true}
      stratum: {range: DecimalText, required: true}
      head: {range: Atom, required: true, inlined: true}
      body: {range: Literal, multivalued: true, inlined_as_list: true, required: true}
      aggregates: {range: Aggregate, multivalued: true, inlined_as_list: true}
      conditions: {range: Condition, multivalued: true, inlined_as_list: true}
      assignments: {range: Assignment, multivalued: true, inlined_as_list: true}
      witness: {range: Witness, inlined: true}
      origin: {range: Origin, inlined: true, required: true}
