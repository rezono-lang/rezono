id: https://rezono.org/contracts/rezono-module
name: rezono_module
title: Rezono module form
description: >-
  The JSON form of one module written in Rezono: what `rezono/` writes and the compiler reads beside `schema/`
  and `rules/`, so that the compiler needs no second parser. The module is a file of docs/rezono/v0.md §4 and
  §5; the seam is that of docs/rezono/expressions.md §12; the command is
  `node src/write-form.ts <module.rezono> <form.json>` in `rezono/`. The file is canonical JSON (RFC 8785,
  docs/contracts.md#canonical-hash) and nothing after it: the same text gives the same bytes, and every number
  is decimal text. `module` is the tree of the module as the reader reads it, declaration by declaration in
  the order of the text; an expression is the tree of docs/rezono/expressions.md §4a. `spans` gives the place in
  the text of every declaration and every expression. A form exists only for a module without an error: a text
  the reader does not read and a construct that v0 reserves (a time selection on a value, `norm`) get a
  diagnostic at their span and no file, so this shape has no member for them and a form never has a part left
  out. A decision table on a derived value is the tree of docs/rezono/tables.md §2 (`Table`), as the text wrote
  it: what its rows mean, and what is proven of them, is that text's and not this shape's. Schema identity and
  its metadata use `rezono.module/2` (decisions/language-metadata.md), including a place for the schema name at
  the empty pointer. An absent member is
  something the text did not write, never a value that is unknown: a
  value that is unknown, not applicable or invalid is the literal the text wrote (`unknown no_estimate`, `n/a`,
  `invalid r`). There is no `null`: canonical JSON refuses it. A reader refuses a member it does not know.
  Beyond this shape a form is the tree of its own printed text (`moduleFromJson` in
  `rezono/src/module-json.ts`). That test also holds what LinkML does not say here: that `call` is exactly a
  name and one list of arguments, that an optional member is never `null`, and that every node with a place has
  its span.
prefixes:
  linkml: https://w3id.org/linkml/
  rezono: https://rezono.org/contracts/
default_prefix: rezono
default_range: string
imports:
  - linkml:types

types:
  DecimalText:
    typeof: string
    pattern: "^(0|[1-9][0-9]*)$"
    description: A natural number as decimal text, as canonical JSON writes every integer.
  JsonPointer:
    typeof: string
    description: An RFC 6901 JSON pointer into `module`.
    pattern: "^(/([^~/]|~[01])*)*$"
  Name:
    typeof: string
    pattern: "^[a-z][a-z0-9_]*$"
    description: A name of Rezono (v0 §3).
  PackName:
    typeof: string
    pattern: "^[a-z]([a-z0-9_]*|[a-z0-9]*(-[a-z0-9]+)+)$"
    description: A pack name from pack.yaml or a legacy Rezono name.
  Rezono1PackName:
    typeof: string
    pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
    description: A pack name in rezono 1 (decisions/language-rezono-1.md section 5.9), matching contracts/pack.yaml.
  DottedName:
    typeof: string
    pattern: "^[a-z]([a-z0-9_]*|[a-z0-9]*(-[a-z0-9]+)+)(\\.[a-z]([a-z0-9_]*|[a-z0-9]*(-[a-z0-9]+)+))*$"
    description: Pack names joined by dots, as a `use` line writes a pack.
  Word:
    typeof: string
    pattern: "^\\S+$"
    description: Text without white space, as the text wrote it.
  NumberText:
    typeof: string
    pattern: "^[0-9]+(\\.[0-9]+)?(/[0-9]+)?$"
    description: A number as the text wrote it (v0 §3).
  SlotDecimalBound:
    typeof: string
    pattern: "^-?[0-9]+(\\.[0-9]+)?$"
    description: A signed decimal slot bound, preserved as written.
  TypeName:
    typeof: string
    pattern: "^[A-Z][A-Za-z0-9]*$"
    description: The name of a kind, a unit or an enum (v0 §3).
  TypeText:
    typeof: string
    pattern: "^([a-z][a-z0-9_]*[.])?[A-Z][A-Za-z0-9]*(<[A-Za-z0-9<>,]+>)?$"
    description: A type as written, without white space, such as `Money<EUR>`.
  Date:
    typeof: string
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
  RuleRef:
    typeof: string
    pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)?$'
    description: The decoded spelling of a local or imported rule name.
  RuleType:
    typeof: string
    pattern: '^([a-z][a-z0-9_]*\.)?[A-Z][A-Za-z0-9]*(<[A-Za-z0-9<>,]+>)?$'
    description: A column type with an optional pack alias.
  StepKindName:
    typeof: string
    pattern: '^([a-z][a-z0-9_]*\.)?[A-Z][A-Za-z0-9]*$'
    description: A kind name with an optional pack alias.
  TrueFlag:
    typeof: boolean
    description: A native marker, constrained by rezono-module-literals.schema.json to true.
  NoTest:
    typeof: string
    pattern: "^-$"
    description: "The cell `-` of a decision table: no test of its input."

enums:
  World:
    permissible_values:
      open: {}
      closed: {}
  Card:
    description: The cardinality written after a type; without one a slot holds exactly one value.
    permissible_values:
      "?": {description: At most one.}
      "*": {description: Any number.}
      "+": {description: At least one.}
  Axis:
    permissible_values:
      at: {}
      during: {}
      in: {}
  RoundedThing:
    permissible_values:
      date: {}
      money: {}
  CheckVerb:
    description: "`norm` is reserved in v0 and has no form."
    permissible_values:
      check: {}
      require: {}
      warn: {}
  HitPolicy:
    description: What a decision table gives when several rows apply, or none (docs/rezono/tables.md §3).
    permissible_values:
      unique: {description: "The rows do not overlap: at most one applies."}
      first: {description: "The first row that applies, in the order written."}
      priority: {description: The applying row whose output comes first in the order of the output enum.}
      collect: {description: "The set of the outputs of every row that applies."}
  Rezono1HitPolicy:
    description: Decision-table hit policies admitted in rezono 1 (`table priority` is removed; decisions/language-rezono-1.md section 1).
    permissible_values:
      unique: {description: "The rows do not overlap: at most one applies."}
      first: {description: "The first row that applies, in the order written."}
      collect: {description: "The set of the outputs of every row that applies."}
  RangeOp:
    permissible_values:
      "..": {description: Both ends are in.}
      "..<": {description: The upper end is out.}
  ExplainMode:
    permissible_values:
      materialize: {}
      on_demand: {}
      fold: {}
  Totality:
    description: "`partial` is the default and is not written (v0 §5d)."
    permissible_values:
      total: {description: The value is proven known.}

classes:
  SchemaMetadata:
    description: Metadata shared by schemas, kinds, slots, enums and enum members.
    mixin: true
    attributes:
      description: &metadata_description {all_of: [{range: string}]}
      exactMappings: &metadata_mappings {all_of: [{range: string, multivalued: true}], description: "Written IRIs or CURIEs, in written order."}
      closeMappings: *metadata_mappings
      broadMappings: *metadata_mappings
      annotations: &metadata_annotations {all_of: [{range: AnnotationMap, inlined: true}]}

  ModuleForm:
    description: The form of one module.
    attributes:
      format: {required: true, equals_string_in: [rezono.module/1, rezono.module/2, rezono.module/3, rezono.module/4, rezono.module/5]}
      module:
        required: true
        any_of:
          - {range: ModuleWithRules, inlined: true}
          - {range: NativeRuleModule, inlined: true}
          - {range: SafeStepModule, inlined: true}
          - {range: Rezono1Module, inlined: true}
      spans: {required: true, range: Place, multivalued: true, inlined_as_list: true, description: "The place of every node of `module` that has one, in the order of the canonical JSON of `module` (members by name, arrays by index); each node once."}

    rules:
      - preconditions:
          slot_conditions:
            format: {equals_string: rezono.module/1}
        postconditions:
          slot_conditions:
            module:
              all_of:
                - {range: Module, inlined: true}
                - {range: ModuleWithoutMetadata, inlined: true}
            spans:
              all_of:
                - range_expression:
                    slot_conditions:
                      at: {pattern: "^/"}
      - preconditions:
          slot_conditions:
            format: {equals_string: rezono.module/2}
        postconditions:
          slot_conditions:
            module:
              all_of:
                - {range: ModuleWithRules, inlined: true}
      - preconditions:
          slot_conditions:
            format: {equals_string: rezono.module/3}
        postconditions:
          slot_conditions:
            module:
              all_of:
                - {range: NativeRuleModule, inlined: true}
                - {range: ModuleWithoutSafeSteps, inlined: true}
      - preconditions:
          slot_conditions:
            format: {equals_string: rezono.module/4}
        postconditions:
          slot_conditions:
            module:
              any_of:
                - {range: SafeStepModule, inlined: true}
                - {range: ModuleWithSafeSteps, inlined: true}
      - preconditions:
          slot_conditions:
            format: {equals_string: rezono.module/5}
        postconditions:
          slot_conditions:
            module:
              all_of:
                - {range: Rezono1Module, inlined: true}

  Place:
    description: >-
      Where one node of `module` stands in the text. A declaration, a slot, a derived value, a version, a `use`
      line and an assignment stand at their name (a rounding at what it rounds, a version at its number,
      `applies` at its slot), a check statement and an expression at their whole text, a decision table at
      `table <policy>`, a row of it at its whole line, a test and a value of it at their text. The module
      itself stands at the name of its schema in version 2. A clause of an `unless` and the range of a test
      have no place of their own: the two expressions of a clause have, and so have the test and its ends.
      A native rule stands at its head name. Every head argument, column, local, option and expression has a place.
    attributes:
      at: {required: true, range: JsonPointer, description: "The node, as a pointer into `module`."}
      line: {required: true, range: DecimalText, pattern: "^[1-9][0-9]*$", description: The 1-based line of `start`.}
      start: {required: true, range: DecimalText, description: "The 0-based offset of its first character, in code points of the text."}
      end: {required: true, range: DecimalText, description: "The offset after its last character."}

  ModuleWithLegacySlots:
    description: The original slot restrictions for a module.
    abstract: true
    is_a: ModuleWithRules
    slot_usage:
      decls:
        all_of:
          # Other declaration types retain their existing validation.
          - any_of:
              - {range: LegacyKindDecl, inlined: true}
              - none_of:
                  - {range: KindDecl, inlined: true}

  Module:
    description: The original module shape.
    is_a: ModuleWithLegacySlots
    slot_usage:
      decls:
        none_of:
          - {range: KindDeclWithKeys, inlined: true}
          - {range: RulesDecl, inlined: true}
          - {range: ScalarAliasDecl, inlined: true}
          - {range: DatasetDecl, inlined: true}
          - {range: SourceDecl, inlined: true}
          - {range: DecideDecl, inlined: true}

  ModuleHeader:
    abstract: true
    mixins: [SchemaMetadata]
    description: The header shared by the module formats.
    attributes:
      rezono: {range: NumberText, description: "The language version of the `rezono` line (v0 §4b); absent when the text has no such line."}
      pack: {required: true, range: PackName}
      use: {required: true, range: Use, multivalued: true, inlined_as_list: true}
      schema: {all_of: [{range: Name}], description: "The written schema name."}
      iri: {all_of: [{range: string}], description: "The written schema IRI."}
      language: {all_of: [{range: string}], description: "The written language tag."}
      prefixes: {all_of: [{range: PrefixMap, inlined: true}]}
      imports: {all_of: [{range: string, multivalued: true}], description: "The schema imports in written order."}
      defaultRange: {all_of: [{range: TypeText}]}

  ModuleWithRules:
    is_a: ModuleHeader
    description: The module shape with recorded rules blocks.
    attributes:
      decls:
        required: true
        multivalued: true
        inlined_as_list: true
        any_of:
          - &unit_decl {range: UnitDecl}
          - &enum_decl {range: EnumDecl}
          - &reason_decl {range: ReasonDecl}
          - &rounding_decl {range: RoundingDecl}
          - &param_decl {range: ParamDecl}
          - &kind_with_keys {range: KindDeclWithKeys}
          - &kind_decl {range: KindDecl}
          - &extend_decl {range: ExtendDecl}
          - &check_decl {range: CheckDecl}
          - &fact_table {range: FactTable}
          - &fact_row {range: FactRow}
          - range: RulesDecl
          - &scalar_alias {range: ScalarAliasDecl}
          - range: DatasetDecl
          - &source_decl {range: SourceDecl}
          - &decide_decl {range: DecideDecl}

  DatasetDecl:
    description: A named fact dataset with its fact tables, source declarations and decide blocks in source order.
    attributes:
      dataset: {required: true, range: Name}
      decls:
        required: true
        multivalued: true
        inlined_as_list: true
        any_of:
          - *fact_table
          - *source_decl
          - *decide_decl

  SourceDecl:
    description: >-
      The shared fields of the sources of the fact tables that cite it with `@`
      (decisions/language-fact-provenance.md). It stands in the module or the dataset of those tables.
    attributes:
      source: {required: true, range: Name}
      fields:
        required: true
        range: SourceFields
        inlined: true
        description: "The fields of the source contract (contracts/source.yaml, class `Source`) as text, keyed by their names."

  SourceFields:
    description: A map from source field names to their text.
    extra_slots:
      range_expression: {range: string, required: true}

  NativeRuleModule:
    is_a: ModuleHeader
    description: The module shape with native rules.
    attributes:
      decls:
        required: true
        multivalued: true
        inlined_as_list: true
        any_of:
          - *unit_decl
          - *enum_decl
          - *reason_decl
          - *rounding_decl
          - *param_decl
          - *kind_with_keys
          - *kind_decl
          - *extend_decl
          - *check_decl
          - *fact_table
          - *fact_row
          - *scalar_alias
          - range: NativeRuleDecl

  NativeRuleDecl:
    description: An owning typed head or a positional clause of a native rule.
    attributes:
      rule: {required: true, range: RuleRef}
      columns: {all_of: [{range: RuleColumn, multivalued: true, inlined_as_list: true, minimum_cardinality: 1}]}
      args: {all_of: [{range: NativeRuleExpr, multivalued: true, inlined_as_list: true, minimum_cardinality: 1}]}
      locals: {all_of: [{range: RuleColumn, multivalued: true, inlined_as_list: true, minimum_cardinality: 1}]}
      when: {all_of: [{range: NativeRuleExpr, inlined: true}]}
      means: {all_of: [{range: string}], description: "The clause's sentence in the pack's default language."}
      source: {all_of: [{range: string}], description: "The source reference after `@`."}
      options:
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
        maximum_cardinality: 7
        any_of:
          - {range: RuleOption}
          - {range: IntermediateInvariantRuleOption}
    exactly_one_of:
      - slot_conditions: {columns: {required: true}, args: {value_presence: ABSENT}}
      - slot_conditions: {args: {required: true}, when: {required: true}, columns: {value_presence: ABSENT}}
        none_of:
          - slot_conditions: {options: {required: true}}

    # The ordered list may contain each option kind at most once. The two storage modes
    # share one kind, and fold has its own. A list of n options needs n distinct kinds.
    # The cardinality clauses use contains constraints because LinkML's JSON Schema
    # generator does not emit uniqueness for list_elements_unique.
    all_of:
      - any_of:
          - slot_conditions: {when: {required: true}}
          - all_of:
              - slot_conditions: {means: {value_presence: ABSENT}}
              - slot_conditions: {source: {value_presence: ABSENT}}
      - any_of:
          - slot_conditions:
              options: {all_of: [{multivalued: true, maximum_cardinality: 1}]}
          - &at_least_2_from_extend
            any_of:
              - all_of:
                  - &extend_option
                    slot_conditions:
                      options: {required: true, all_of: [{multivalued: true, has_member: {range_expression: {slot_conditions: {extend: {required: true}}}}}]}
                  - &at_least_1_from_invariant
                    any_of:
                      - &invariant_option
                        slot_conditions:
                          options: {required: true, all_of: [{multivalued: true, has_member: {range_expression: {slot_conditions: {invariant: {required: true}}}}}]}
                      - &at_least_1_from_absence
                        any_of:
                          - &absence_option
                            slot_conditions:
                              options: {required: true, all_of: [{multivalued: true, has_member: {range_expression: {slot_conditions: {absence: {required: true}}}}}]}
                          - &at_least_1_from_outcome
                            any_of:
                              - &outcome_option
                                slot_conditions:
                                  options: {required: true, all_of: [{multivalued: true, has_member: {range_expression: {slot_conditions: {outcome: {required: true}}}}}]}
                              - &at_least_1_from_closes
                                any_of:
                                  - &closes_option
                                    slot_conditions:
                                      options: {required: true, all_of: [{multivalued: true, has_member: {range_expression: {slot_conditions: {closes: {required: true}}}}}]}
                                  - &at_least_1_from_storage
                                    any_of:
                                      - &storage_option
                                        slot_conditions:
                                          options: {required: true, all_of: [{multivalued: true, has_member: {range_expression: {slot_conditions: {explain: {required: true, equals_string_in: [on_demand, materialize]}}}}}]}
                                      - &fold_option
                                        slot_conditions:
                                          options: {required: true, all_of: [{multivalued: true, has_member: {range_expression: {slot_conditions: {explain: {required: true, equals_string: fold}}}}}]}
              - &at_least_2_from_invariant
                any_of:
                  - {all_of: [*invariant_option, *at_least_1_from_absence]}
                  - &at_least_2_from_absence
                    any_of:
                      - {all_of: [*absence_option, *at_least_1_from_outcome]}
                      - &at_least_2_from_outcome
                        any_of:
                          - {all_of: [*outcome_option, *at_least_1_from_closes]}
                          - &at_least_2_from_closes
                            any_of:
                              - {all_of: [*closes_option, *at_least_1_from_storage]}
                              - &at_least_2_from_storage {all_of: [*storage_option, *fold_option]}
      - any_of:
          - slot_conditions:
              options: {all_of: [{multivalued: true, maximum_cardinality: 2}]}
          - &at_least_3_from_extend
            any_of:
              - {all_of: [*extend_option, *at_least_2_from_invariant]}
              - &at_least_3_from_invariant
                any_of:
                  - {all_of: [*invariant_option, *at_least_2_from_absence]}
                  - &at_least_3_from_absence
                    any_of:
                      - {all_of: [*absence_option, *at_least_2_from_outcome]}
                      - &at_least_3_from_outcome
                        any_of:
                          - {all_of: [*outcome_option, *at_least_2_from_closes]}
                          - &at_least_3_from_closes {all_of: [*closes_option, *storage_option, *fold_option]}
      - any_of:
          - slot_conditions:
              options: {all_of: [{multivalued: true, maximum_cardinality: 3}]}
          - &at_least_4_from_extend
            any_of:
              - {all_of: [*extend_option, *at_least_3_from_invariant]}
              - &at_least_4_from_invariant
                any_of:
                  - {all_of: [*invariant_option, *at_least_3_from_absence]}
                  - &at_least_4_from_absence
                    any_of:
                      - {all_of: [*absence_option, *at_least_3_from_outcome]}
                      - &at_least_4_from_outcome {all_of: [*outcome_option, *closes_option, *storage_option, *fold_option]}
      - any_of:
          - slot_conditions:
              options: {all_of: [{multivalued: true, maximum_cardinality: 4}]}
          - &at_least_5_from_extend
            any_of:
              - {all_of: [*extend_option, *at_least_4_from_invariant]}
              - &at_least_5_from_invariant
                any_of:
                  - {all_of: [*invariant_option, *at_least_4_from_absence]}
                  - &at_least_5_from_absence {all_of: [*absence_option, *outcome_option, *closes_option, *storage_option, *fold_option]}
      - any_of:
          - slot_conditions:
              options: {all_of: [{multivalued: true, maximum_cardinality: 5}]}
          - &at_least_6_from_extend
            any_of:
              - {all_of: [*extend_option, *at_least_5_from_invariant]}
              - &at_least_6_from_invariant {all_of: [*invariant_option, *absence_option, *outcome_option, *closes_option, *storage_option, *fold_option]}
      - any_of:
          - slot_conditions:
              options: {all_of: [{multivalued: true, maximum_cardinality: 6}]}
          - &at_least_7_from_extend {all_of: [*extend_option, *invariant_option, *absence_option, *outcome_option, *closes_option, *storage_option, *fold_option]}

  RuleColumn:
    description: The declared type of a head column or a clause-local name.
    attributes:
      name: {required: true, range: Name}
      type: {required: true, range: RuleType}

  IntermediateInvariantOption:
    description: An intermediate invariant rule option.
    extra_slots: {allowed: true}
    attributes:
      invariant: {required: true, equals_string: intermediate}

  RuleWithIntermediateInvariant:
    description: A native rule declaration carrying an intermediate invariant option.
    extra_slots: {allowed: true}
    attributes:
      options:
        required: true
        multivalued: true
        inlined_as_list: true
        any_of:
          - {range: RuleOption}
          - {range: IntermediateInvariantRuleOption}
        has_member:
          range_expression: {is_a: IntermediateInvariantOption}

  ModuleWithoutSafeSteps:
    description: The restriction applied to rezono.module/3 forms.
    extra_slots: {allowed: true}
    attributes:
      decls:
        required: true
        multivalued: true
        inlined_as_list: true
        none_of:
          - {range: RuleWithIntermediateInvariant, inlined: true}

  ModuleWithSafeSteps:
    description: The restriction applied to rezono.module/4 forms.
    is_a: NativeRuleModule
    slot_usage:
      decls:
        has_member:
          range_expression: {is_a: RuleWithIntermediateInvariant}

  InvariantWithin:
    description: The coverage relation of an intermediate invariant option.
    attributes:
      relation: {required: true, range: RuleRef}

  IntermediateInvariantRuleOption:
    description: An authored intermediate invariant option on a typed head.
    attributes:
      invariant: {required: true, equals_string: intermediate}
      within: {required: true, range: InvariantWithin, inlined: true}

  RuleOption:
    description: An authored option on a typed head.
    attributes:
      extend: {all_of: [{range: TrueFlag}]}
      invariant: {all_of: [{range: TrueFlag}]}
      absence: {all_of: [{range: TrueFlag}]}
      outcome: {all_of: [{range: RuleType}]}
      closes: {all_of: [{range: RuleRef}]}
      explain: {all_of: [{range: ExplainMode}]}
    exactly_one_of:
      - slot_conditions: {extend: {required: true}}
      - slot_conditions: {invariant: {required: true}}
      - slot_conditions: {absence: {required: true}}
      - slot_conditions: {outcome: {required: true}}
      - slot_conditions: {closes: {required: true}}
      - slot_conditions: {explain: {required: true}}

  SafeStepModule:
    is_a: ModuleHeader
    description: The module shape with safe step declarations (decisions/language-safe-steps.md).
    attributes:
      decls:
        required: true
        multivalued: true
        inlined_as_list: true
        any_of:
          - *unit_decl
          - *enum_decl
          - *reason_decl
          - *rounding_decl
          - *param_decl
          - *kind_with_keys
          - *kind_decl
          - *extend_decl
          - *check_decl
          - *fact_table
          - *fact_row
          - *scalar_alias
          - range: NativeRuleDecl
          - range: RulesDecl
          - range: DatasetDecl
          - range: SourceDecl
          - *decide_decl
          - range: StepDecl
    all_of:
      - slot_conditions:
          decls:
            required: true
            all_of:
              - multivalued: true
                has_member:
                  range_expression:
                    slot_conditions:
                      step: {required: true}

  Rezono1Module:
    is_a: ModuleHeader
    description: The module shape for rezono 1 (`rezono.module/5`; decisions/language-rezono-1.md section 5.8).
    slot_usage:
      rezono:
        required: true
        equals_string: "1"
      pack:
        range: Rezono1PackName
      use:
        range: Rezono1Use
        multivalued: true
        inlined_as_list: true
    attributes:
      decls:
        required: true
        multivalued: true
        inlined_as_list: true
        any_of:
          - *unit_decl
          - *enum_decl
          - *reason_decl
          - *rounding_decl
          - *param_decl
          - range: Rezono1KindDeclWithKeys
          - range: Rezono1KindDecl
          - range: Rezono1ExtendDecl
          - *check_decl
          - *fact_table
          - *fact_row
          - *scalar_alias
          - range: DatasetDecl
          - *source_decl
          - *decide_decl
          - range: StepDecl

  Rezono1Use:
    description: "A `use` line in rezono 1: one hyphenated pack name, without dots."
    attributes:
      use: {required: true, range: Rezono1PackName}
      as: {range: Name}

  Rezono1Table:
    is_a: Table
    description: A decision table in rezono 1 (`table priority` is excluded).
    slot_usage:
      table:
        range: Rezono1HitPolicy

  Rezono1Derived:
    is_a: Derived
    description: A derived value in rezono 1 (excludes `table priority`).
    slot_usage:
      table:
        range: Rezono1Table
        inlined: true

  Rezono1KindDecl:
    is_a: KindDecl
    description: A kind declaration in rezono 1 (excludes `table priority`).
    slot_usage:
      derived:
        range: Rezono1Derived
        multivalued: true
        inlined_as_list: true

  Rezono1KindDeclWithKeys:
    is_a: KindDeclWithKeys
    description: A kind declaration with named keys in rezono 1 (excludes `table priority`).
    slot_usage:
      derived:
        range: Rezono1Derived
        multivalued: true
        inlined_as_list: true

  Rezono1ExtendDecl:
    is_a: ExtendDecl
    description: An extend declaration in rezono 1 (excludes `table priority`).
    slot_usage:
      derived:
        range: Rezono1Derived
        multivalued: true
        inlined_as_list: true

  StepDecl:
    description: A declared step with its match condition, scoped forbids, typed effect and confirmation.
    attributes:
      step: {required: true, range: Name}
      columns: {required: true, range: RuleColumn, multivalued: true, inlined_as_list: true, minimum_cardinality: 1}
      when: {required: true, range: Expr, inlined: true}
      forbid: {range: StepForbid, multivalued: true, inlined_as_list: true, minimum_cardinality: 1}
      effect: {required: true, range: StepEffect, inlined: true}
      confirm: {required: true, range: StepConfirm, inlined: true}

  StepForbid:
    description: A scoped forbid clause under a step declaration.
    attributes:
      pattern: {required: true, range: StepCallWithWildcard, inlined: true}
      within: {required: true, range: StepCall, inlined: true}

  StepCallWithWildcard:
    description: A direct relation call whose arguments may use wildcards.
    attributes:
      call:
        required: true
        array: {minimum_number_dimensions: 1}
        any_of: [{range: string}, {range: NativeRuleExpr}]

  StepCall:
    description: A direct relation call without wildcards.
    attributes:
      call:
        required: true
        array: {minimum_number_dimensions: 1}
        any_of: [{range: string}, {range: Expr}]

  StepEffect:
    description: The effect operation and ordered changes of a step declaration.
    attributes:
      operation: {required: true, range: Name}
      changes:
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
        any_of:
          - {range: StepInsertRowChange}
          - {range: StepRetractRowChange}
          - {range: StepSetSlotChange}
          - {range: StepRetractSlotChange}

  StepInsertRowChange:
    description: An effect change inserting a complete record.
    attributes:
      insert_row: {required: true, range: StepInsertRow, inlined: true}

  StepInsertRow:
    description: The kind, key expression and slot assignments of a step row insertion.
    attributes:
      kind: {required: true, range: StepKindName}
      key: {required: true, range: Expr, inlined: true}
      slots: {required: true, range: StepSlotAssignment, multivalued: true, inlined_as_list: true}

  StepSlotAssignment:
    description: A named slot assignment in a step row insertion.
    attributes:
      name: {required: true, range: Name}
      value: {required: true, range: Expr, inlined: true}

  StepRetractRowChange:
    description: An effect change retracting a record by key.
    attributes:
      retract_row: {required: true, range: StepRetractRow, inlined: true}

  StepRetractRow:
    description: The kind and key expression of a step row retraction.
    attributes:
      kind: {required: true, range: StepKindName}
      key: {required: true, range: Expr, inlined: true}

  StepSetSlotChange:
    description: An effect change setting a slot value on a keyed record.
    attributes:
      set_slot: {required: true, range: StepSetSlot, inlined: true}

  StepSetSlot:
    description: The kind, slot, key expression and value expression of a step slot write.
    attributes:
      kind: {required: true, range: StepKindName}
      slot: {required: true, range: Name}
      key: {required: true, range: Expr, inlined: true}
      value: {required: true, range: Expr, inlined: true}

  StepRetractSlotChange:
    description: An effect change retracting a slot value on a keyed record.
    attributes:
      retract_slot: {required: true, range: StepRetractSlot, inlined: true}

  StepRetractSlot:
    description: The kind, slot and key expression of a step slot retraction.
    attributes:
      kind: {required: true, range: StepKindName}
      slot: {required: true, range: Name}
      key: {required: true, range: Expr, inlined: true}

  StepConfirm:
    description: The confirmation reader call and prerequisite token expression of a step declaration.
    attributes:
      reader: {required: true, range: StepCall, inlined: true}
      token: {required: true, range: Expr, inlined: true}

  RulesDecl:
    description: An embedded relational rules block (decisions/language-rules.md).
    attributes:
      rules: {required: true, range: Name}
      lines:
        required: true
        range: string
        multivalued: true
        pattern: '^(?![\s\S]*[\r\n])'
        description: "The ordered rule lines as written, including empty lines and comments."

  ScalarAliasDecl:
    description: A named scalar alias (decisions/language-slots.md).
    attributes:
      type: {required: true, range: TypeName}
      base: {required: true, range: TypeName}

  Use:
    attributes:
      use: {required: true, range: DottedName}
      as: {range: Name}

  UnitDecl:
    attributes:
      unit: {required: true, range: TypeName}
      is: {required: true, description: "What stands after `=`, as written, without its comments and with one space for each run of white space: `money EUR`, `integer`, `1024 MiB`. A quantity is read as an expression, so what v0 reserves in it (a time selection) is an R015 and has no form."}

  EnumDecl:
    mixins: [SchemaMetadata]
    attributes:
      enum: {required: true, range: TypeName}
      world: {range: World}
      values: {required: true, range: Name, multivalued: true, minimum_cardinality: 1}
      memberMetadata: {all_of: [{range: EnumMemberMetadataMap, inlined: true}]}
      deprecated: {range: Deprecated, inlined: true}

  Deprecated:
    description: A deprecation notice on a declaration (decisions/language-deprecation.md).
    attributes:
      note: {required: true, range: string}
      until: {required: true, range: Date}

  ReasonDecl:
    attributes:
      reason: {required: true, range: Name}
      text: {required: true, pattern: "^\"[^\\n\\r]*\"$", description: "The label as the text literal that was written, with its quotes. A text ends on the line it starts on (v0 §11), so it holds no line feed and no carriage return: the reader refuses one. The pattern names those two, since `.` takes U+2028, U+2029 and a bare carriage return in one dialect of regular expressions and not in another; the reader takes U+2028 and U+2029 inside a text."}

  RoundingDecl:
    attributes:
      rounding: {required: true, range: RoundedThing}
      mode: {required: true, range: Name}

  ParamDecl:
    attributes:
      param: {required: true, range: Name}
      type: {required: true, range: TypeText}
      per: {range: TypeName}
      value: {range: Expr, inlined: true}
      versions: {range: Version, multivalued: true, inlined_as_list: true, minimum_cardinality: 1}

  Version:
    description: One version of a parameter or a derived value (v0 §5a).
    attributes:
      version: {required: true, range: NumberText}
      replaces: {range: NumberText, description: "The number of the version this one replaces, from `version N replaces M`; precedence (a) of v0 §5a, rule 4."}
      valid: {range: Date, multivalued: true, minimum_cardinality: 1, maximum_cardinality: 2, description: "The first day, and the day after the last one; one date for a range without an end."}
      known: {range: Date}
      value: {range: Expr, inlined: true}
      source: {description: "The source reference after `@`."}

  KindDecl:
    mixins: [SchemaMetadata]
    attributes:
      kind: {required: true, range: TypeName}
      world: {range: World}
      applies: {range: Applies, inlined: true}
      sealed: {range: Name, description: "The slot of `sealed at`. It has no place of its own: its kind's stands for it."}
      relationship: {range: boolean, description: "`true` for a relationship kind; absent otherwise (decisions/language-relationship-kinds.md)."}
      deprecated: {range: Deprecated, inlined: true}
      slots:
        required: true
        multivalued: true
        inlined_as_list: true
        any_of:
          - {range: Slot}
          - {range: ConstrainedSlot}
      derived: {required: true, range: Derived, multivalued: true, inlined_as_list: true}

  KindDeclWithKeys:
    description: A kind declaration with named keys, in the extended module format.
    is_a: KindDecl
    attributes:
      keys:
        required: true
        range: CompositeKey
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
        list_elements_unique: true

  CompositeKey:
    description: A named unique key with its slots in the order written (decisions/language-keys.md).
    attributes:
      unique: {identifier: true, required: true, range: Name}
      slots:
        required: true
        range: Name
        multivalued: true
        minimum_cardinality: 1
        list_elements_unique: true

  Applies:
    attributes:
      axis: {required: true, range: Axis}
      slot: {required: true, range: Name}

  SlotShape:
    description: Members shared by unconstrained and constrained slots.
    abstract: true
    attributes:
      slot: {required: true, range: Name}
      type: {required: true, range: TypeText}
      slotUri: {all_of: [{range: string}], description: "The written slot IRI or CURIE."}
      description: *metadata_description
      exactMappings: *metadata_mappings
      closeMappings: *metadata_mappings
      broadMappings: *metadata_mappings
      annotations: *metadata_annotations
      card: {range: Card}
      inverse: {range: Name}
      world: {range: World}

  Slot:
    description: A slot with no written constraints.
    is_a: SlotShape

  ConstrainedSlot:
    description: A slot with at least one written constraint.
    is_a: SlotShape
    attributes:
      constraints:
        description: Slot constraints in the order they were written.
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
        any_of:
          - {range: SlotCardinalityConstraint}
          - {range: SlotMinimumConstraint}
          - {range: SlotMaximumConstraint}
          - {range: SlotPatternConstraint}

  SlotCardinalityConstraint:
    description: The inclusive range for the number of values in a slot.
    attributes:
      cardinality:
        required: true
        range: DecimalText
        multivalued: true
        minimum_cardinality: 2
        maximum_cardinality: 2
        description: The inclusive lower and upper number of values, in that order.

  SlotMinimumConstraint:
    description: An inclusive lower bound for a numeric slot value.
    attributes:
      minimum: {required: true, range: SlotDecimalBound}

  SlotMaximumConstraint:
    description: An inclusive upper bound for a numeric slot value.
    attributes:
      maximum: {required: true, range: SlotDecimalBound}

  SlotPatternConstraint:
    description: A pattern for the text value of a slot.
    attributes:
      pattern: {required: true, range: string}

  LegacyKindDecl:
    description: A version-one kind declaration with only unconstrained slots.
    is_a: KindDecl
    slot_usage:
      slots:
        any_of:
          - {range: Slot}

  ExtendDecl:
    attributes:
      extend: {required: true, range: TypeName}
      derived: {required: true, range: Derived, multivalued: true, inlined_as_list: true}

  PrefixMap:
    description: A map from written prefix names to their IRIs.
    extra_slots:
      range_expression: {range: string, required: true}

  EnumMemberMetadataMap:
    description: A map from written enum member names to their metadata.
    extra_slots:
      range_expression: {range: EnumMemberMetadata, inlined: true, required: true}

  EnumMemberMetadata:
    description: The metadata written under an enum member.
    mixins: [SchemaMetadata]

  AnnotationMap:
    description: A map from annotation names to canonical JSON values, with decimal numbers represented as text.
    extra_slots:
      range_expression:
        required: true
        any_of:
          - {range: string}
          - {range: boolean}
          - {range: AnnotationMap, inlined: true}
          - multivalued: true
            any_of:
              - {range: string}
              - {range: boolean}
              - {range: AnnotationMap, inlined: true}
              # The reader checks canonical values through arbitrarily nested arrays.
              - {multivalued: true, any_of: [{required: true}]}

  ModuleWithoutMetadata:
    description: The metadata restriction applied to the otherwise validated version 1 module.
    extra_slots: {allowed: true}
    attributes:
      decls:
        required: true
        multivalued: true
        inlined_as_list: true
        none_of:
          - {range: ElementWithMetadata}
          - {range: DeclarationWithMetadataSlots}
    none_of:
      - {slot_conditions: {schema: {value_presence: PRESENT}}}
      - {slot_conditions: {iri: {value_presence: PRESENT}}}
      - {slot_conditions: {language: {value_presence: PRESENT}}}
      - {slot_conditions: {prefixes: {value_presence: PRESENT}}}
      - {slot_conditions: {imports: {value_presence: PRESENT}}}
      - {slot_conditions: {defaultRange: {value_presence: PRESENT}}}
      - {is_a: ElementWithMetadata}

  ElementWithMetadata:
    description: Any object with at least one written declaration metadata field.
    extra_slots: {allowed: true}
    any_of:
      - {slot_conditions: {description: {value_presence: PRESENT}}}
      - {slot_conditions: {exactMappings: {value_presence: PRESENT}}}
      - {slot_conditions: {closeMappings: {value_presence: PRESENT}}}
      - {slot_conditions: {broadMappings: {value_presence: PRESENT}}}
      - {slot_conditions: {annotations: {value_presence: PRESENT}}}
      - {slot_conditions: {slotUri: {value_presence: PRESENT}}}
      - {slot_conditions: {memberMetadata: {value_presence: PRESENT}}}
      - {slot_conditions: {deprecated: {value_presence: PRESENT}}}

  DeclarationWithMetadataSlots:
    description: A declaration with at least one slot that has written metadata.
    extra_slots: {allowed: true}
    attributes:
      slots:
        required: true
        range: Slot
        multivalued: true
        inlined_as_list: true
        has_member:
          range_expression: {is_a: ElementWithMetadata}

  Derived:
    description: "A derived value: its `=` with its `unless` clauses and its versions, or a decision table, which stands alone."
    attributes:
      derived: {required: true, range: Name}
      totality: {range: Totality, description: "`total` before `derived`. The reader reads it on a value with a table only; on any other value the text is refused."}
      type: {required: true, range: TypeText}
      card: {range: Card}
      value: {range: Expr, inlined: true}
      unless: {range: Clause, array: {dimensions: [{alias: unless}, {alias: clause}]}, description: "Each `unless`, in the order of the text: its one clause, or the clauses of its block (v0 §5b)."}
      versions: {range: DerivedVersion, multivalued: true, inlined_as_list: true, minimum_cardinality: 1}
      table: {range: Table, inlined: true}
      output: {range: DerivedOutput, inlined: true}
      unit: {range: Word, description: "`unit TEXT`: the unit of the calculated value, as written (decisions/language-calculations.md)."}
      definitions: {range: Definition, multivalued: true, inlined_as_list: true, minimum_cardinality: 1}

  DerivedVersion:
    is_a: Version
    description: "A version of a derived value. Without `= value`, its line opens a block of definitions (decisions/language-calculations.md, Versions with definitions)."
    attributes:
      definitions: {range: Definition, multivalued: true, inlined_as_list: true, minimum_cardinality: 1}

  Table:
    description: >-
      A decision table (docs/rezono/tables.md §2): each row tests the inputs and names one output. It stands at
      `table <policy>` in the text, a row at its whole line, a test and a value at their own text.
    attributes:
      table: {required: true, range: HitPolicy}
      inputs: {required: true, range: Expr, multivalued: true, inlined_as_list: true, minimum_cardinality: 1, description: "The header: one expression for each column, in the scope of the element."}
      output: {required: true, range: Name, description: "The name after `->`: the name of the derived value."}
      rows: {required: true, range: TableRow, multivalued: true, inlined_as_list: true, description: "In the order written. A table without a row is one where no row applies."}

  TableRow:
    attributes:
      tests:
        required: true
        array: {minimum_number_dimensions: 1}
        any_of: [{range: NoTest}, {range: TableTest}]
        description: "One cell for each input, in the order of the header: `-` for no test, or the list of its tests, which are alternatives. A list of cells of which some are lists, which LinkML can only say as an array of any depth."
      value: {required: true, range: TableValue, inlined: true, description: "The output of the row. A state is no output: a row that gives no value is left out."}

  TableTest:
    description: "One test of a cell: a value, which the input must equal, or a range the input must lie in."
    attributes:
      lit: {description: "A value: a literal, an id or a value of an enum as a bare word, as the text wrote it; never a state."}
      between: {range: Between, inlined: true}
    exactly_one_of:
      - slot_conditions: {lit: {required: true}}
      - slot_conditions: {between: {required: true}}

  Between:
    description: "A range of a test. An end that is absent is open: `18..` has no `to`, `..<18` no `from`. It has no place of its own: its test's stands for it."
    attributes:
      from: {range: TableValue, inlined: true}
      op: {required: true, range: RangeOp}
      to: {range: TableValue, inlined: true}
    any_of:
      - slot_conditions: {from: {required: true}}
      - slot_conditions: {to: {required: true}}

  TableValue:
    description: "A value of a decision table: read by the type of its input or of the derived value, which is the check's and not the parse's."
    attributes:
      lit: {required: true, description: "A literal, an id or a value of an enum as a bare word, as the text wrote it; never a state."}

  DerivedOutput:
    description: "The explicit output of a calculation: `output relation.slot`."
    attributes:
      relation: {required: true, range: Name}
      slot: {required: true, range: Name}

  Definition:
    description: "One named definition of a calculation: `definition name when condition then expression`."
    attributes:
      name: {required: true, range: Name}
      when: {required: true, range: Expr, inlined: true}
      value: {required: true, range: Expr, inlined: true}
      overrides: {range: Override, multivalued: true, inlined_as_list: true, minimum_cardinality: 1, description: "Each `overrides name because \"reason\"` at the end of the line, in the order written."}

  Override:
    description: "This definition goes before the named definition of the same version, for the reason given."
    attributes:
      definition: {required: true, range: Name}
      reason: {required: true, description: "The text after `because`, decoded."}

  Clause:
    attributes:
      when: {required: true, range: Expr, inlined: true}
      then: {required: true, range: Expr, inlined: true}
      source: {}

  CheckDecl:
    attributes:
      check: {required: true, range: CheckVerb}
      name: {range: Name}
      cond: {required: true, range: Expr, inlined: true}

  FactTable:
    description: Facts as a table. Every row has one value for each column; the first column is the id.
    attributes:
      fact: {required: true, range: TypeName}
      source: {range: Name, description: "The source declaration the table cites with `@` (decisions/language-fact-provenance.md)."}
      columns: {required: true, range: Word, multivalued: true, description: "The header: a name for each column, or a path as the text wrote it."}
      sourceColumns:
        range: Name
        multivalued: true
        minimum_cardinality: 1
        description: "The source fields of the `@` columns, which follow the slot columns in each row; only with `source`."
      rows:
        required: true
        any_of:
          - {range: Expr}
          - {range: OmittedCell}
        array: {dimensions: [{alias: row}, {alias: cell}]}
        description: "Each row holds the slot cells, then the source cells: a text literal, or the omitted cell for the declaration's value."

  OmittedCell:
    description: "A dash in a source column: the value of the cited source declaration."
    attributes:
      boundary: {required: true, equals_string: omitted}

  FactRow:
    description: Facts of one element, with the contexts they hold in (v0 §5a rule 5).
    attributes:
      fact: {required: true, range: Name}
      id: {required: true}
      valid: {range: Date, multivalued: true, minimum_cardinality: 1, maximum_cardinality: 2}
      during:
        description: The stages the facts hold for, one stage or a range from a stage (decisions/language-dated-facts.md).
        exactly_one_of:
          - range: StageContext
          - range: StageRange
      in: {multivalued: true, minimum_cardinality: 1, description: "The setups the facts hold in, in the order written."}
      known: {range: Date}
      set: {required: true, range: Assignment, multivalued: true, inlined_as_list: true}

  StageContext:
    description: One stage, as a stage context.
    attributes:
      stage: {required: true}

  StageRange:
    description: A range of stages from one stage, closed at an exclusive end stage or open.
    attributes:
      from: {required: true}
      until: {}

  Assignment:
    attributes:
      slot: {required: true, range: Name}
      value: {required: true, range: Expr, inlined: true}
      source: {}

  DecideDecl:
    description: A decision block naming its title, decider, date and the slot values it sets (docs/rezono/v0.md §5).
    attributes:
      decide: {required: true, range: string}
      by: {required: true, range: Word}
      "on": {required: true, range: Date}
      valid: {range: Date, multivalued: true, minimum_cardinality: 1, maximum_cardinality: 2}
      during:
        description: The stages the decided values hold for, one stage or a range from a stage.
        exactly_one_of:
          - range: StageContext
          - range: StageRange
      in: {multivalued: true, minimum_cardinality: 1, description: "The setups the decided values hold in, in the order written."}
      known: {range: Date}
      source: {description: "The source reference after `@`."}
      set: {required: true, range: DecideAssign, multivalued: true, inlined_as_list: true, minimum_cardinality: 1}

  DecideAssign:
    description: One slot assignment `<id>.<slot> = <value>` in a `decide` block.
    attributes:
      path: {required: true, range: Word, multivalued: true, minimum_cardinality: 2}
      value: {required: true, range: Expr, inlined: true}

  Expr:
    description: >-
      One node of an expression: an object with exactly one member, which names its form
      (docs/rezono/expressions.md §4a). A literal is its source text, so a value in a state is `{"lit": "n/a"}`,
      `{"lit": "unknown <reason>"}` or `{"lit": "invalid <reason>"}`, and never an absent member. A time
      selection is reserved and has no form.
    attributes:
      lit: {description: "A literal, a literal token or an id, as the text wrote it."}
      path: {range: Word, multivalued: true, minimum_cardinality: 1, description: "A name or a path of names; its head may be an id (`host-b.owner`). An id that is spelled like a name is a path of one name; which of the two it is, is for name resolution."}
      kind: {range: TypeName, description: A kind as a set.}
      dot: {multivalued: true, any_of: [{range: string}, {range: Expr}], description: "`[base, name]`: a slot read from something that is not a name."}
      agg: {multivalued: true, any_of: [{range: string}, {range: Expr}], description: "`[name, base]` or `[name, base, argument]`."}
      filter: {range: Expr, multivalued: true, inlined_as_list: true, description: "`[set, condition]`."}
      cmp: {multivalued: true, any_of: [{range: string}, {range: Expr}], description: "`[operator, left, right]`."}
      in: {range: Expr, multivalued: true, inlined_as_list: true, description: "`[value, set or range]`."}
      is: {multivalued: true, any_of: [{range: string}, {range: Expr}], description: "`[value, state]`, the state one of `known`, `unknown`, `n/a`, `invalid`."}
      range: {multivalued: true, any_of: [{range: string}, {range: Expr}], description: "`[from, operator, to]`, the operator `..` or `..<`."}
      and: {range: Expr, multivalued: true, inlined_as_list: true, minimum_cardinality: 2}
      or: {range: Expr, multivalued: true, inlined_as_list: true, minimum_cardinality: 2}
      not: {range: Expr, inlined: true}
      imply: {range: Expr, multivalued: true, inlined_as_list: true, description: "`[left, right]`."}
      arith: {multivalued: true, any_of: [{range: string}, {range: Expr}], description: "`[operator, left, right]`."}
      neg: {range: Expr, inlined: true}
      when: {range: Expr, multivalued: true, inlined_as_list: true, description: "`[condition, then, else]`."}
      call: {array: {minimum_number_dimensions: 1}, any_of: [{range: string}, {range: Expr}], description: "`[name, [argument, …]]`: the arguments are a list inside the list, which LinkML can only say as an array of any depth."}
    exactly_one_of: &expr_members
      - slot_conditions: {lit: {required: true}}
      - slot_conditions: {path: {required: true}}
      - slot_conditions: {kind: {required: true}}
      - slot_conditions: {dot: {required: true}}
      - slot_conditions: {agg: {required: true}}
      - slot_conditions: {filter: {required: true}}
      - slot_conditions: {cmp: {required: true}}
      - slot_conditions: {in: {required: true}}
      - slot_conditions: {is: {required: true}}
      - slot_conditions: {range: {required: true}}
      - slot_conditions: {and: {required: true}}
      - slot_conditions: {or: {required: true}}
      - slot_conditions: {not: {required: true}}
      - slot_conditions: {imply: {required: true}}
      - slot_conditions: {arith: {required: true}}
      - slot_conditions: {neg: {required: true}}
      - slot_conditions: {when: {required: true}}
      - slot_conditions: {call: {required: true}}

  NativeRuleExpr:
    description: An expression in a native rule, including wildcards in patterns.
    attributes:
      lit: {all_of: [{range: string}]}
      path: {all_of: [{range: Word, multivalued: true, minimum_cardinality: 1}]}
      wildcard: {all_of: [{range: TrueFlag}]}
      dot: {multivalued: true, any_of: [{range: string}, {range: NativeRuleExpr}]}
      agg: {multivalued: true, any_of: [{range: string}, {range: NativeRuleExpr}]}
      filter: {range: NativeRuleExpr, multivalued: true, inlined_as_list: true}
      cmp: {multivalued: true, any_of: [{range: string}, {range: NativeRuleExpr}]}
      in: {range: NativeRuleExpr, multivalued: true, inlined_as_list: true}
      is: {multivalued: true, any_of: [{range: string}, {range: NativeRuleExpr}]}
      range: {multivalued: true, any_of: [{range: string}, {range: NativeRuleExpr}]}
      and: {range: NativeRuleExpr, multivalued: true, inlined_as_list: true, minimum_cardinality: 2}
      or: {range: NativeRuleExpr, multivalued: true, inlined_as_list: true, minimum_cardinality: 2}
      not: {range: NativeRuleExpr, inlined: true}
      imply: {range: NativeRuleExpr, multivalued: true, inlined_as_list: true}
      arith: {multivalued: true, any_of: [{range: string}, {range: NativeRuleExpr}]}
      neg: {range: NativeRuleExpr, inlined: true}
      when: {range: NativeRuleExpr, multivalued: true, inlined_as_list: true}
      call: {array: {minimum_number_dimensions: 1}, any_of: [{range: string}, {range: NativeRuleExpr}]}
      kind: {all_of: [{range: RuleType}]}
    exactly_one_of:
      - exactly_one_of: *expr_members
        slot_conditions: {wildcard: {value_presence: ABSENT}}
      - slot_conditions: {wildcard: {required: true}}
        none_of: *expr_members
