id: https://rezono.example/linkml-fixture/base
name: linkml_fixture_base
description: The kinds the other module builds on.
in_language: en
prefixes:
  linkml: https://w3id.org/linkml/
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  schema: http://schema.org/
imports:
  - linkml:types
default_range: string
annotations:
  layer: facts

types:
  Code:
    typeof: string
    pattern: "^[A-Z]{2}[0-9]+$"
    description: A text with a fixed shape.
  Minor:
    typeof: integer
    minimum_value: 0
    annotations:
      currency: EUR
  SmallMinor:
    typeof: Minor
    maximum_value: 1000000

enums:
  Level:
    permissible_values:
      low: {description: The first value.}
      high: {}
      middle: {}

classes:
  Thing:
    abstract: true
    annotations:
      world: open
    attributes:
      id: {identifier: true, range: integer}
      title: {required: true, slot_uri: rdfs:label}
      code: {range: Code, pattern: "^[A-Z]{2}[0-9]{2,}$"}
      level: {range: Level, required: true}
      price: {range: SmallMinor}

  Part:
    is_a: Thing
    attributes:
      begins: {range: date, slot_uri: schema:validFrom}
      ends: {range: date, slot_uri: schema:validThrough}
    rules:
      - description: A part that ends began.
        preconditions:
          slot_conditions:
            ends: {value_presence: PRESENT}
        postconditions:
          slot_conditions:
            begins: {value_presence: PRESENT}
      - preconditions:
          slot_conditions:
            level: {equals_string: high}
        postconditions:
          slot_conditions:
            price: {minimum_value: 100}
        elseconditions:
          slot_conditions:
            price: {maximum_value: 99}
