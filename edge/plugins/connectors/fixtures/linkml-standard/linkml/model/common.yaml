id: https://example.org/registry/common
name: common
prefixes:
  linkml: https://w3id.org/linkml/
  rdfs: http://www.w3.org/2000/01/rdf-schema#
imports:
  - linkml:types
default_range: string
subsets:
  basic:
    description: The slots every record has.
slots:
  id:
    identifier: true
    in_subset: [basic]
  label:
    slot_uri: rdfs:label
    in_subset: [basic]
  size:
    range: integer
    minimum_value: 0
