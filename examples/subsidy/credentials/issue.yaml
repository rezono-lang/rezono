# The credentials of this pack's fixture, as the test issuer made them once (edge/plugins/credential-in/issue.py).
# Entirely synthetic: the issuers are invented and say so in their names (*.invented.example, a reserved domain)
# and titles; a person is only a `p-` identifier of eight opaque characters; no value resembles a real register
# number. The private keys were never written, so this fixture is verified, not made again: a new run gives new
# keys and new bytes.
#
# An identifier is local to the node that gave it (Y4.12): p-4k7q2m9x of the Energy Advisor Register and
# p-4k7q2m9x of the Training Institute are two identifiers that look alike, not one person.
#
# Three credentials, one per way a claim can stand:
# - the Energy Advisor Register states a qualification of its p-4k7q2m9x; the holder discloses it and not the
#   registration region; the register's status list says valid. Attested; the region is unknown, not disclosed.
# - the Training Institute states a qualification of its own p-4k7q2m9x, but the trust list lets it state a
#   completed course only. Not attested: its issuer had no authority for that attribute.
# - the Energy Advisor Register states a qualification of its p-8d3n6r1w, which its status list says is revoked.
#   Not attested.
#
# Two identity statements (W4 step 2, K20), each saying that an identifier of the municipality and one of the
# Energy Advisor Register name one person:
# - the Person Register, which the trust list lets name identifiers of both nodes (two entries, one per node,
#   Y4.15), says the municipality's p-7w3j5n2e is the register's p-4k7q2m9x; the municipality looked its status up
#   on 2026-11-10, inside both entries' windows, and it says valid. So the municipality relies on that qualification for its
#   own p-7w3j5n2e, and on nothing the Training Institute says of its p-4k7q2m9x.
# - the Training Institute, which may not state that, says the municipality's p-3f9b6t1y is the register's
#   p-8d3n6r1w. It joins nothing.
trust_list: trust-list.json
issuers:
  - {id: "https://advisor-register.invented.example", key: issuers/advisor-register.jwk.json}
  - {id: "https://training-institute.invented.example", key: issuers/training-institute.jwk.json}
  - {id: "https://person-register.invented.example", key: issuers/person-register.jwk.json}
status_lists:
  - {issuer: "https://advisor-register.invented.example", uri: "https://advisor-register.invented.example/status/1",
     path: status/advisor-register-1.jwt, iat: "2026-11-10T08:00:00Z", statuses: [valid, revoked], looked_up_on: "2026-11-10"}
  - {issuer: "https://training-institute.invented.example", uri: "https://training-institute.invented.example/status/1",
     path: status/training-institute-1.jwt, iat: "2026-11-10T08:00:00Z", statuses: [valid, valid], looked_up_on: "2026-11-10"}
  - {issuer: "https://person-register.invented.example", uri: "https://person-register.invented.example/status/1",
     path: status/person-register-1.jwt, iat: "2026-11-10T08:00:00Z", statuses: [valid], looked_up_on: "2026-11-10"}
credentials:
  - issuer: "https://advisor-register.invented.example"
    subject: p-4k7q2m9x
    iat: "2026-03-02T09:00:00Z"
    vct: "https://advisor-register.invented.example/vct/qualification"
    claims: {qualification: energy_advisor, registration_region: north}
    status: {idx: 0, uri: "https://advisor-register.invented.example/status/1"}
    path: presentations/advisor-register-p-4k7q2m9x.sd-jwt
    title: Qualification of p-4k7q2m9x from the invented Energy Advisor Register (synthetic)
    requested: [qualification, registration_region]
    disclose: [qualification]
  - issuer: "https://training-institute.invented.example"
    subject: p-4k7q2m9x
    iat: "2026-04-14T09:00:00Z"
    vct: "https://training-institute.invented.example/vct/qualification"
    claims: {qualification: energy_advisor}
    status: {idx: 0, uri: "https://training-institute.invented.example/status/1"}
    path: presentations/training-institute-p-4k7q2m9x.sd-jwt
    title: Qualification of p-4k7q2m9x from the invented Training Institute (synthetic)
    requested: [qualification]
    disclose: [qualification]
  - issuer: "https://advisor-register.invented.example"
    subject: p-8d3n6r1w
    iat: "2026-05-11T09:00:00Z"
    vct: "https://advisor-register.invented.example/vct/qualification"
    claims: {qualification: energy_advisor}
    status: {idx: 1, uri: "https://advisor-register.invented.example/status/1"}
    path: presentations/advisor-register-p-8d3n6r1w.sd-jwt
    title: Qualification of p-8d3n6r1w from the invented Energy Advisor Register (synthetic)
    requested: [qualification]
    disclose: [qualification]
identity_statements:
  - issuer: "https://person-register.invented.example"
    iat: "2026-06-01T09:00:00Z"
    vct: "https://person-register.invented.example/vct/same-subject"
    same_subject:
      - {node: "https://municipality.invented.example", id: p-7w3j5n2e}
      - {node: "https://advisor-register.invented.example", id: p-4k7q2m9x}
    status: {idx: 0, uri: "https://person-register.invented.example/status/1"}
    path: statements/person-register-p-7w3j5n2e.sd-jwt
    title: The invented Person Register (synthetic) states that p-7w3j5n2e of the municipality is p-4k7q2m9x of the Energy Advisor Register
  - issuer: "https://training-institute.invented.example"
    iat: "2026-06-02T09:00:00Z"
    vct: "https://training-institute.invented.example/vct/same-subject"
    same_subject:
      - {node: "https://municipality.invented.example", id: p-3f9b6t1y}
      - {node: "https://advisor-register.invented.example", id: p-8d3n6r1w}
    status: {idx: 1, uri: "https://training-institute.invented.example/status/1"}
    path: statements/training-institute-p-3f9b6t1y.sd-jwt
    title: The invented Training Institute (synthetic) states that p-3f9b6t1y of the municipality is p-8d3n6r1w of the Energy Advisor Register
