id: https://rezono.example/subsidy/credentials
name: subsidy_credentials
description: >-
  What another organisation states, as the municipality receives it (W4, K19 and K20; docs/ring2/trust.md): a
  trust list that says which issuer may state which attribute, the credentials holders present, statements that
  two identifiers of two nodes name one person, and lookups of the issuers' status lists. Entirely synthetic:
  the issuers and nodes are invented and say so in their names and titles, and a person is only a `p-`
  identifier, local to the node that gave it (Y4.12). The credential in port (edge/plugins/credential-in)
  verifies every signature, disclosure and pin, and writes these as observations with their sources
  (facts/credentials.yaml). That the municipality relies on a claim, and that two identifiers name one person,
  are conclusions of rules/credentials.dl, never a field here.
in_language: en
prefixes:
  linkml: https://w3id.org/linkml/
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  schema: http://schema.org/
imports:
  - linkml:types
default_range: string
annotations:
  layer: observation

types:
  Issuer:
    typeof: string
    pattern: "^https://[a-z0-9-]+\\.invented\\.example$"
    description: An issuer, by its identifier. A synthetic issuer lives under the reserved domain invented.example.
  Code:
    typeof: string
    pattern: "^[a-z][a-z0-9_]*$"
    description: The name of an attribute, or a value that is a code.
  Person:
    typeof: string
    pattern: "^p-[a-z0-9]{8}$"
    description: >-
      A person, only by an opaque identifier (Y0.6); never a name or a register number. The identifier is local to
      the node that gave it (Y4.12): the same characters at two nodes are two identifiers.
  Node:
    typeof: string
    pattern: "^https://[a-z0-9-]+\\.invented\\.example$"
    description: >-
      A node: one organisation's namespace, in which it gives its own identifiers. A synthetic node lives under the
      reserved domain invented.example; the municipality's own is https://municipality.invented.example.

enums:
  StatusValue:
    description: What an issuer's status list says of a credential (the status types of the IETF Token Status List).
    permissible_values: {valid: {}, revoked: {}, suspended: {}}

classes:
  TrustEntry:
    description: >-
      One entry of a trust list: this issuer may state this attribute, from a day until (exclusive) another.
      Origin: the trust list as its keeper published it, pinned by its hash (a vendor fact, Q8); the in port
      refuses a list whose bytes differ from the pin. A rule cannot derive it: who may state what is the keeper's
      choice. Needed by question 6: on whose authority does the municipality rely on a claim? A changed authority
      is a new entry with its own days, never an edit, so a conclusion keeps the ground it had. Rules cannot read
      a date yet, so each date has its day number beside it.
    attributes:
      id: {identifier: true}
      title: {required: true, slot_uri: rdfs:label}
      issuer: {range: Issuer, required: true}
      attribute: {range: Code, required: true}
      node:
        range: Node
        description: >-
          For `same_subject` only: the node whose identifiers the entry lets its issuer name (Y4.15). An entry
          without a node covers none; a statement is authorised only when an entry covers each node it names.
      valid_from: {range: date, required: true, slot_uri: schema:validFrom}
      valid_from_day: {range: integer, required: true}
      valid_until: {range: date, required: true, slot_uri: schema:validThrough, description: Exclusive.}
      valid_until_day: {range: integer, required: true}

  Credential:
    description: >-
      A credential as its holder presented it: who issued it, about whom, on which day. Origin: an observation,
      the presentation as received; the in port verified the issuer's signature and refuses one changed byte.
      A rule cannot derive what another party stated. Needed by question 6. Its subject is a person only by a
      `p-` identifier; no personal attribute is stored here.
    attributes:
      id: {identifier: true}
      title: {required: true, slot_uri: rdfs:label}
      issuer: {range: Issuer, required: true}
      subject: {range: Person, required: true, description: "The person the credential is about, by the issuer's own identifier (local to the issuer's node)."}
      issued_on: {range: date, required: true}
      issued_on_day: {range: integer, required: true}

  CredentialClaim:
    description: >-
      One attribute the municipality asked of a presented credential, with its value when the holder disclosed it.
      Origin: an observation, the presentation as received: a disclosed value is one whose digest the issuer
      signed. Closed world over the presentation: a claim without a value was not disclosed, and what it would
      say is unknown (reason not_disclosed), never empty and never false. Needed by question 6.
    attributes:
      id: {identifier: true}
      credential: {range: Credential, required: true}
      attribute: {range: Code, required: true}
      value: {range: Code, description: The disclosed value; absent when the holder did not disclose it.}

  IdentityStatement:
    description: >-
      A signed statement that two identifiers, each at a node of its own, name one person (W4 step 2, K20; Y4.2).
      Origin: an observation, the statement as received; the in port verified its issuer's signature and refuses
      one changed byte. A rule cannot derive it: that two identifiers name one person is what a register states,
      and equal or equal-looking identifiers never say it. Whether the statement's issuer is the authority for
      that identity is a rule (rules/credentials.dl), from the trust list, never a field here. Needed by question
      7. The two identifiers are in no order; a rule reads the statement both ways round.
    attributes:
      id: {identifier: true}
      title: {required: true, slot_uri: rdfs:label}
      issuer: {range: Issuer, required: true}
      issued_on: {range: date, required: true}
      issued_on_day: {range: integer, required: true}
      first_node: {range: Node, required: true}
      first_identifier: {range: Person, required: true, description: The person's identifier at the first node.}
      second_node: {range: Node, required: true}
      second_identifier: {range: Person, required: true, description: The person's identifier at the second node.}

  StatusLookup:
    description: >-
      What the issuer's status list said of a credential or an identity statement on the day it was looked up.
      Origin: an observation, the status list as the issuer signed it, looked up by the in port. A rule cannot
      derive whether an issuer revoked what it issued. Closed world: the lookups are all there are, so a
      credential or a statement without a lookup that found it valid is not in good standing. A lookup is of
      exactly one of the two (the invariant status_lookup_not_of_one). Needed by questions 6 and 7.
    attributes:
      id: {identifier: true}
      credential: {range: Credential, description: The credential looked up; absent when the lookup is of a statement.}
      statement: {range: IdentityStatement, description: The identity statement looked up; absent when the lookup is of a credential.}
      status: {range: StatusValue, required: true}
      looked_up_on: {range: date, required: true}
      looked_up_on_day: {range: integer, required: true}
