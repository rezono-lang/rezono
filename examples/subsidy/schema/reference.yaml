id: https://rede.example/subsidy/reference
name: subsidy_reference
description: >-
  The payment ledger of the finance department, as a reference source (decision R13): what another
  system recorded, kept apart from the scheme. No award reads it. A calculation rule compares it with
  the awards the rules derive, and the difference is drift, shown to readers with its proof.
in_language: en
prefixes:
  linkml: https://w3id.org/linkml/
imports:
  - linkml:types
  - subsidy-scheme:subsidy
default_range: string
annotations:
  layer: observation

classes:
  LedgerPayment:
    description: >-
      A payment as the ledger records it. Origin: an observation, the ledger export of the finance
      department. Sealed on its booking date: once a month is closed, a late or changed row is
      refused by name and does not count.
    annotations:
      seal: booked_on
    attributes:
      id: {identifier: true}
      application: {range: Application, required: true}
      booked_on: {range: date, required: true}
      amount: {range: Cents, required: true, minimum_value: 0}

  PeriodClose:
    description: >-
      The close of the ledger up to a date. Origin: a decision of the finance department. It names
      every payment it closes with the hash of its row, as `rede_compiler close` writes it.
    attributes:
      id: {identifier: true}
      closed_until: {range: date, required: true, description: Every payment booked before this date is closed.}
      covers: {range: ClosedPayment, multivalued: true, inlined_as_list: true}

  ClosedPayment:
    description: A closed payment, with the hash of its row when it was closed.
    attributes:
      element: {range: LedgerPayment, required: true}
      sha256: {required: true}
