  - {"id": "L0003", "application": "A001", "item": "scaffolding", "amount": 40000}
  - {"id": "L0004", "application": "A002", "item": "wall-insulation", "amount": 415000}
  - {"id": "L0005", "application": "A003", "item": "insulating-glazing", "amount": 327550}
  - {"id": "L0006", "application": "A004", "item": "heat-pump", "amount": 1380000}
  - {"id": "L0007", "application": "A004", "item": "floor-insulation", "amount": 295000}
