# Seven applications written by hand, one for each thing the rules can say. Synthetic: no real household.
# The population of facts/population.yaml continues the numbering. One record per line, as JSON.
#   A001  income above the threshold: the partial rate, plus the advice allowance (the worked example)
#   A002  income exactly on the threshold: still the full rate
#   A003  no income statement yet: the award is unknown, not zero
#   A004  the full rate would give more than the maximum: the award is the maximum
#   A005  income above the limit: no cost share, and so no allowance either
#   A006  no quote yet: the costs are unknown, not zero
#   A007  a second application of household H004, with a cost share that needs rounding
household:
  - {"id": "H001", "persons": 3}
  - {"id": "H002", "persons": 2}
  - {"id": "H003", "persons": 1}
  - {"id": "H004", "persons": 4}
  - {"id": "H005", "persons": 2}
  - {"id": "H006", "persons": 5}
application:
  - {"id": "A001", "household": "H001", "claimed_costs": 1100000}
  - {"id": "A002", "household": "H002", "claimed_costs": 415000}
  - {"id": "A003", "household": "H003", "claimed_costs": 327550}
  - {"id": "A004", "household": "H004", "claimed_costs": 1675000}
  - {"id": "A005", "household": "H005", "claimed_costs": 590000}
  - {"id": "A006", "household": "H006", "claimed_costs": 800000}
  - {"id": "A007", "household": "H004", "claimed_costs": 319999}
cost_line:
