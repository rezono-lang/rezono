id: https://rezono.org/examples/platform-core/capacity-exploration
name: platform_capacity_exploration
description: Written candidate capacity series for threshold exploration.
in_language: en
imports:
  - linkml:types
default_range: string
annotations:
  layer: facts

classes:
  CapacityExploration:
    description: Named capacity exploration over a pool, a target request, and candidate core counts.
    attributes:
      id: {identifier: true}
      pool: {required: true}
      request: {required: true}
      values: {range: integer, multivalued: true, required: true, minimum_value: 0}
