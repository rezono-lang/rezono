id: https://rezono.org/examples/platform-core/request-input
name: platform_request_input
description: Typed input rows for the tenant request preview.
in_language: en
imports:
  - linkml:types
default_range: string
annotations:
  layer: facts

classes:
  TenantServiceRequest:
    attributes:
      id: {identifier: true}
      tenant: {required: true}
      service: {required: true}
      profile: {required: true}
      submitted_at:
        required: true
        annotations: {input_format: utc_instant}
      submitted_at_key: {range: integer, minimum_value: 0, description: Legacy input ignored by delivery numbering.}
      service_key: {range: integer, minimum_value: 0, description: Legacy input ignored by delivery numbering.}
      global_submitted_at_key: {range: integer, minimum_value: 0}
      tenant_key: {range: integer, minimum_value: 0}
      global_service_key: {range: integer, minimum_value: 0}
  TenantRequestItem:
    attributes:
      id: {identifier: true}
      tenant: {required: true}
      service: {required: true}
      item: {required: true}
      size: {required: true}
  TenantRequestConnection:
    attributes:
      id: {identifier: true}
      tenant: {required: true}
      service: {required: true}
      target_zone: {required: true}
      target: {required: true}
      peer:
      port: {range: integer, required: true, minimum_value: 1, maximum_value: 65535}
  TenantCatalogOffer:
    attributes:
      id: {identifier: true}
      item: {required: true}
      size: {required: true}
      monthly_cents: {range: integer, required: true, minimum_value: 0}
      cores: {range: integer, minimum_value: 0}
      memory_gib: {range: integer, minimum_value: 0}
      storage_gib: {range: integer, minimum_value: 0}
