id: https://rezono.org/examples/platform-kubernetes-support
name: platform_kubernetes_support
imports: [linkml:types, core]
default_range: string
annotations:
  layer: facts

classes:
  SeriesSupportEvidence:
    description: Upstream support information for a published product series.
    attributes:
      id: {identifier: true}
      product:
        range: Product
        description: Product identifier used in the publisher's release evidence.
        required: true
      series: {required: true}
      latest_patch: {required: true}
      support_end:
        description: Published UTC calendar date in YYYY-MM-DD form for the rule projection.
        required: true
        pattern: '^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
      source_url: {required: true, pattern: '^https://[^ ]+$'}
      source_sha256: {required: true, pattern: '^[0-9a-f]{64}$'}
  SeriesSupportSource:
    description: The separately pinned publisher statement for support of one product series.
    attributes:
      id: {identifier: true}
      product: {range: Product, required: true}
      series: {required: true}
      latest_patch: {required: true}
      support_end: {required: true, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'}
      source_url: {required: true, pattern: '^https://[^ ]+$'}
      source_sha256: {required: true, pattern: '^[0-9a-f]{64}$'}
