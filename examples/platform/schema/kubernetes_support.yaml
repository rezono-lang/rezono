id: https://rezono.org/examples/platform-kubernetes-support
name: platform_kubernetes_support
imports: [linkml:types, core]
default_range: string
annotations:
  layer: facts

types:
  SupportEndDate:
    description: Calendar date in YYYY-MM-DD form for a series support end date.
    typeof: string
    pattern: '^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'

classes:
  SeriesSupportReference:
    description: The support end recorded for a product series in the platform register, used to compare with the maker's support statement.
    attributes:
      id: {identifier: true}
      product: {range: Product, required: true}
      series: {required: true}
      support_end: {range: SupportEndDate, required: true}
  SeriesSupportSource:
    description: The maker's pinned statement for support of one product series.
    attributes:
      id: {identifier: true}
      product: {range: Product, required: true}
      series: {required: true}
      latest_patch: {required: true}
      support_end: {range: SupportEndDate, required: true}
      source_url: {required: true, pattern: '^https://[^ ]+$'}
      source_sha256: {required: true, pattern: '^[0-9a-f]{64}$'}
