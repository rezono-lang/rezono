id: https://rezono.org/examples/platform-postgres-transport
name: platform_postgres_transport
imports: [linkml:types, core]
default_range: string
annotations:
  layer: facts

classes:
  VendorDefaultTransport:
    description: The default listening transport documented by a vendor for a product series.
    attributes:
      id: {identifier: true}
      product: {range: Product, required: true}
      series: {required: true}
      protocol: {required: true}
      port: {range: integer, minimum_value: 1, maximum_value: 65535, required: true}
      source_url: {required: true, pattern: '^https://[^ ]+$'}
      source_sha256: {required: true, pattern: '^[0-9a-f]{64}$'}

  VendorDefaultTransportSource:
    description: The default listening transport recorded in independently pinned vendor evidence.
    attributes:
      id: {identifier: true}
      product: {range: Product, required: true}
      series: {required: true}
      protocol: {required: true}
      port: {range: integer, minimum_value: 1, maximum_value: 65535, required: true}
      source_url: {required: true, pattern: '^https://[^ ]+$'}
      source_sha256: {required: true, pattern: '^[0-9a-f]{64}$'}
