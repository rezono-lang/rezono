id: https://rezono.example/std-identity/identity
name: std_identity
description: >-
  Same-as and the classes it makes. A source states that two referents are one thing (same_as); the
  reflexive, symmetric and transitive closure of those statements divides the referents into classes. A
  source also names the referent that stands for its class (represented_by). Two members of one class that
  state different values for one slot are a conflict. The axioms and the derived relations are in
  rules/identity.dl. The mapping annotations compare with OWL; no rule reads them.
in_language: en
prefixes:
  linkml: https://w3id.org/linkml/
  owl: http://www.w3.org/2002/07/owl#
  skos: http://www.w3.org/2004/02/skos/core#
imports:
  - linkml:types
default_range: string
annotations:
  layer: facts

classes:
  Referent:
    abstract: true
    description: >-
      Anything a domain records and may record more than once: one thing under two ids, in two sources or
      two modules. A view supplies its elements.
    attributes:
      id:
        identifier: true
      same_as:
        range: Referent
        multivalued: true
        description: >-
          Another referent that a source states to be the same thing. Each row is a claim with a source of its
          own (S25), so every merge has one. The direction carries no meaning: the rules read it both ways.
          A pair without a row is not stated to be one, which never makes it two.
        close_mappings: ["owl:sameAs"]
        broad_mappings: ["skos:exactMatch"]
      represented_by:
        range: Referent
        multivalued: true
        description: >-
          The member that a source names to stand for the class of this referent: a choice with an origin of
          its own. One statement at any member names it for the whole class; two different names in one class
          are a violation.
