id: https://rezono.example/std-review/review
name: std_review
in_language: en
imports:
  - linkml:types
default_range: string
annotations:
  layer: facts
enums:
  Verdict:
    permissible_values:
      accepted: {}
      rejected: {}
  Phase:
    permissible_values:
      lab: {}
      strict: {}
  Policy:
    permissible_values:
      require: {}
      mark: {}
      none: {}
  EvidenceOutcome:
    permissible_values:
      passed: {}
      failed: {}
  ReadingScope:
    permissible_values:
      correctness: {}
      quality: {}
  FindingConcern:
    permissible_values:
      correctness: {}
      quality: {}
classes:
  Change:
    attributes:
      id: {identifier: true}
      author: {required: true}
      content_sha256: {required: true}
      support_sha256: {required: true}
  ChangeMember:
    attributes:
      id: {identifier: true}
      change: {range: Change, required: true}
      kind: {required: true}
      element: {required: true}
  ChangeSupport:
    attributes:
      id: {identifier: true}
      change: {range: Change, required: true}
      kind: {required: true}
      element: {required: true}
  Review:
    attributes:
      id: {identifier: true}
      change: {range: Change, required: true}
      reviewer: {required: true}
      role: {required: true}
      verdict: {range: Verdict, required: true}
      reason: {}
      day: {range: integer, required: true}
      content_sha256: {required: true}
      support_sha256: {required: true}
  ReviewDismissal:
    attributes:
      id: {identifier: true}
      review: {range: Review, required: true}
  RoleGrant:
    attributes:
      id: {identifier: true}
      subject: {required: true}
      role: {required: true}
      from_day: {range: integer, required: true}
      until_day: {range: integer}
      change: {range: Change}
  ReviewPhase:
    attributes:
      id: {identifier: true}
      phase: {range: Phase, required: true}
      owner: {required: true}
  ReviewPolicy:
    attributes:
      id: {identifier: true}
      kind: {required: true}
      policy: {range: Policy, required: true}
  EvidenceRequirement:
    attributes:
      id: {identifier: true}
      change: {range: Change, required: true}
      evidence_kind: {required: true}
      commit_sha: {required: true}
  EvidenceAttestation:
    attributes:
      id: {identifier: true}
      change: {range: Change, required: true}
      evidence_kind: {required: true}
      commit_sha: {required: true}
      outcome: {range: EvidenceOutcome, required: true}
      source: {required: true}
  Reading:
    attributes:
      id: {identifier: true}
      change: {range: Change, required: true}
      commit_sha: {required: true, pattern: "^[a-f0-9]{40}$"}
      scope: {range: ReadingScope, required: true}
      reader: {required: true}
      source: {required: true}
  ReadingFinding:
    attributes:
      id: {identifier: true}
      reading: {range: Reading, required: true}
      concern: {range: FindingConcern, required: true}
      source: {required: true}
  ReadingDismissal:
    attributes:
      id: {identifier: true}
      reading: {range: Reading, required: true}
      source: {required: true}
  FindingResolution:
    attributes:
      id: {identifier: true}
      finding: {range: ReadingFinding, required: true}
      commit_sha: {required: true, pattern: "^[a-f0-9]{40}$"}
      source: {required: true}
