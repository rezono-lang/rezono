# The explanation questions of std-part, built only from the generic building blocks of std-explain
# (docs/gui.md, "Questions as data"). They narrow the generic grounds and reach to part and whole: a domain
# that imports std-explain keeps those too. The label and sentence are in messages/<lang>.mf2.
format: rezono.questions/1
questions:
  # What is this part of? The chain of part_of steps behind a within conclusion, and for an outermost
  # conclusion also what the outermost whole is itself a part of: nothing.
  - term: part_grounds
    start: present
    applies_to: {derivation: conclusion, relations: [within, outermost]}
    steps:
      - trace: {direction: back, depth: all, keep: {relations: [within, outermost, has_whole], kinds: [constituent]}}
    answer: route
    limit: 200
  # What does this consist of? The parts within this whole, ring by ring.
  - term: part_reach
    start: present
    applies_to: {kinds: [constituent]}
    steps:
      - trace: {direction: forward, depth: 3, keep: {relations: [within]}}
    answer: rings
    limit: 200
