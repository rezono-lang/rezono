id: https://rezono.example/std-budget/budget
name: std_budget
description: >-
  Monotonically shrinking numeric budgets across base and head revisions. A BudgetEntry declares the
  listed ceiling for a (budget, cell, revision) and a BudgetReading records its observed count.
in_language: en
imports:
  - linkml:types
default_range: string
annotations:
  layer: facts

enums:
  Revision:
    description: Which revision of the comparison a ceiling or reading belongs to.
    permissible_values:
      base: {description: baseline revision}
      head: {description: candidate revision}

classes:
  BudgetEntry:
    description: A listed ceiling for one cell of a named budget at a revision.
    attributes:
      id: {identifier: true}
      budget: {required: true}
      cell: {required: true}
      ceiling: {range: integer, required: true, minimum_value: 0}
      revision: {range: Revision, required: true}
  BudgetReading:
    description: An observed whole-integer count for one cell of a named budget at a revision.
    attributes:
      id: {identifier: true}
      budget: {required: true}
      cell: {required: true}
      observed: {range: integer, required: true, minimum_value: 0}
      revision: {range: Revision, required: true}
