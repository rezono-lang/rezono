id: https://rezono.org/std-loop/delivery-status
name: std_loop_delivery_status
description: A recorded reading supporting the status of one delivery step.
imports: [linkml:types]
default_range: string
annotations:
  layer: facts

classes:
  LoopStatusObservation:
    attributes:
      id: {identifier: true}
      tenant: {required: true}
      delivery: {required: true}
      step: {required: true}
      run: {required: true}
      relation: {required: true}
      reason: {required: true}
      at: {required: false, description: "Original event time when known; omitted when unknown."}
      event_time: {range: integer, required: false, description: "Order of the original event instant when known; omitted when unknown."}
