id: https://rezono.org/std-loop/delivery-status
name: std_loop_delivery_status
description: A recorded reading supporting the status of one delivery step.
imports: [linkml:types]
default_range: string
annotations:
  layer: facts

classes:
  LoopStatusObservation:
    attributes:
      id: {identifier: true}
      tenant: {required: true}
      delivery: {required: true}
      step: {required: true}
      run: {required: true}
      relation: {required: true}
      reason: {required: true}
      at: {required: true, description: "Original event time, or empty for a legacy reading without time."}
      event_time: {range: integer, required: true, description: "Order of the original event instant, or -1 when it is unknown."}
