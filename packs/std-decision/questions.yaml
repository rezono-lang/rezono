# The explanation questions of std-decision, built only from the generic building blocks of std-explain
# (docs/gui.md, "Questions as data"). They narrow the generic grounds and reach to decisions: a domain that
# imports std-explain keeps those too. The label and sentence are in messages/<lang>.mf2. A filter names
# relations only, base tables included, because that is what the gate serves today.
format: rezono.questions/1
questions:
  # Who decided this, and when? From a conclusion back to each decision in force it rests on, and on to that
  # decision itself. Who and when are fields of its record, and its sources (S25) end the walk.
  - term: decided
    start: present
    applies_to: {derivation: conclusion}
    steps:
      - trace: {direction: back, depth: all, keep: {relations: [in_force_on, decision]}}
    answer: route
    limit: 200
  # What did this decision replace? The decisions it supersedes, directly and through others (replaces), and
  # those it has replaced on a reference date (replaced), ring by ring.
  - term: replaced
    start: present
    applies_to: {kinds: [decision]}
    steps:
      - trace: {direction: forward, depth: 3, keep: {relations: [replaced, replaces]}}
    answer: rings
    limit: 200
