[project]
name = "rezono-publication"
version = "0.1.0"
description = "Read and write canonical Rezono publications."
requires-python = ">=3.11"
dependencies = ["rezono-canon", "pyarrow", "rdflib"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rezono_publication"]

[tool.pytest.ini_options]
testpaths = ["tests"]
