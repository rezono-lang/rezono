name: Catlab migration oracle

on:
  push:
    branches:
      - main
    paths:
      - 'admission/**'
      - 'compiler/**'
      - 'canon/**'
      - 'contracts/**'
      - 'requirements/**'
      - 'scripts/check-pinned.py'
      - '.github/workflows/python-environment/**'
      - '.github/workflows/catlab-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main supersedes the comparison of an older one; a manual
# run is never cancelled.
concurrency:
  group: catlab-oracle-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JULIA_VERSION: '1.11.9'
      JULIA_ARCHIVE_SHA256: b36363356d7a05eaf8b7b9e7a91c710f6bd3d2940be4d4e6d14b9a9f2927de35
      JULIA_LOAD_PATH: '@:@stdlib'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/workflows/python-environment
        with:
          editable: -e admission -e canon -e compiler -e contracts/python
      - name: Install the Julia version recorded in the Catlab manifest
        run: |
          set -euo pipefail
          download=(curl --fail --silent --show-error --location --retry 3 --proto '=https')
          release=https://julialang-s3.julialang.org/bin
          archive="julia-$JULIA_VERSION-linux-x86_64.tar.gz"
          cd "$RUNNER_TEMP"
          "${download[@]}" "$release/linux/x64/${JULIA_VERSION%.*}/$archive" -o "$archive"
          printf '%s  %s\n' "$JULIA_ARCHIVE_SHA256" "$archive" | sha256sum --strict --check
          mkdir julia
          tar --extract --gzip --file "$archive" --directory julia --strip-components=1
          echo "$RUNNER_TEMP/julia/bin" >> "$GITHUB_PATH"
          echo "JULIA_DEPOT_PATH=$RUNNER_TEMP/julia-depot" >> "$GITHUB_ENV"
      - name: Instantiate the committed Catlab project
        run: |
          set -euo pipefail
          julia --version
          julia --startup-file=no --project=compiler/tests/catlab -e 'using Pkg; Pkg.instantiate()'
          git diff --exit-code -- compiler/tests/catlab/Project.toml compiler/tests/catlab/Manifest.toml
      - name: Compare forward and reverse migration row multisets
        run: |
          set -euo pipefail
          python compiler/tests/catlab/compare.py
          echo "The Catlab migration multiset comparison passed." >> "$GITHUB_STEP_SUMMARY"
