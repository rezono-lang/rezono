name: Review test evidence
run-name: policy ${{ github.event_name }} ${{ github.event.pull_request.number || 0 }} ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }} ${{ contains(github.event.pull_request.labels.*.name, 'planner') }}
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
    types: [checks_requested]
permissions:
  actions: read
  contents: read
  pull-requests: read
jobs:
  review:
    name: Inspect test evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # GitHub does not cancel the runs of a merge group that the queue replaced.
      # Such a job stops here, before it spends a runner on a commit that can no
      # longer land: the group's ref is gone or points elsewhere. A failed lookup
      # lets the job run. Stopping fails the job, which is safe: the group no
      # longer exists, and a misread can never turn an untested group green.
      - name: Stop when the merge group was replaced
        if: github.event_name == 'merge_group'
        shell: bash
        env:
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [[ -z "$HEAD_REF" || -z "$HEAD_SHA" ]]; then
            echo "::warning::The event names no merge-group ref or commit; running the job"
            exit 0
          fi
          [[ "$HEAD_REF" == refs/* ]] || HEAD_REF="refs/heads/$HEAD_REF"
          # No checkout yet, so the repository is named by its address.
          if ! found=$(GIT_TERMINAL_PROMPT=0 timeout 60 git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$HEAD_REF"); then
            echo "::warning::Could not read $HEAD_REF from the remote; running the job"
            exit 0
          fi
          current=$(awk -v ref="$HEAD_REF" '$2 == ref { print $1 }' <<< "$found")
          echo "Merge group $HEAD_REF: tested commit $HEAD_SHA, remote has ${current:-no such ref}"
          if [[ "$current" != "$HEAD_SHA" ]]; then
            echo "::error title=group replaced::The merge queue replaced this group ($HEAD_REF is ${current:-gone}, not $HEAD_SHA); stopping without running the job"
            exit 1
          fi
      # The policy always comes from the base. In the merge queue that is the commit the
      # queued change lands on, so a change reviewed against an older base is reviewed
      # again by the current policy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          fetch-depth: ${{ github.event_name == 'merge_group' && 1 || 0 }}
          persist-credentials: false
      - name: Verify policy examples
        shell: bash
        run: |
          set -euo pipefail
          python -I scripts/test_red_guard.py
      - name: Review the current head and planner label
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/pull/$PR/head"
          [[ "$(git rev-parse FETCH_HEAD)" == "$HEAD" ]]
          base=$(git merge-base "$BASE" "$HEAD")
          # Labels are read live, not from the event, so the review sees the labels the pull
          # request carries now. The guard needs the label p1-read-<full head commit id> for a
          # change to the checker or read access; a `labeled` event reruns it.
          current_state() {
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" \
              --jq '{sha: .head.sha, labels: [.labels[].name]} | tojson'
          }
          report="$RUNNER_TEMP/test-evidence.txt"
          for attempt in 1 2 3; do
            state=$(current_state)
            sha=$(jq -r '.sha' <<< "$state")
            planner=$(jq 'any(.labels[]; . == "planner")' <<< "$state")
            labels=$(jq -c '.labels' <<< "$state")
            [[ "$sha" == "$HEAD" ]]
            echo "Labels on #$PR at $sha: $labels"
            result=0
            label=()
            case "$planner" in
              true)
                label=(--planner)
                echo "Planner label: protected paths may change; red marks are still reviewed."
                ;;
              false) ;;
              *) exit 1 ;;
            esac
            python -I scripts/red_guard.py "${label[@]}" --labels "$labels" "$base" "$HEAD" > "$report" || result=$?
            cat "$report"
            latest=$(current_state)
            if [[ "$state" == "$latest" ]]; then
              {
                echo "### Test evidence (planner label: $planner)"
                echo
                if [[ -s "$report" ]]; then
                  echo '```text'
                  cat "$report"
                  echo '```'
                else
                  echo "No protected evidence was removed or changed."
                fi
              } >> "$GITHUB_STEP_SUMMARY"
              exit "$result"
            fi
            echo "PR state changed during review; checking again."
          done
          echo "ERROR PR state kept changing during review."
          exit 1
      - name: Review the queued change against its merge base
        if: github.event_name == 'merge_group'
        shell: bash
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Merge group $HEAD_REF: base $BASE, head $HEAD"
          if [[ ! "$HEAD_REF" =~ ^refs/heads/gh-readonly-queue/[^[:space:]]+/pr-([0-9]+)-[0-9a-f]{40}$ ]]; then
            echo "ERROR cannot read the pull request number from $HEAD_REF."
            exit 1
          fi
          pr=${BASH_REMATCH[1]}
          for attempt in 1 2 3; do
            if git fetch --no-tags --depth=1 origin "$HEAD_REF"; then
              break
            fi
            [[ "$attempt" -lt 3 ]] || exit 1
            sleep 5
          done
          [[ "$(git rev-parse FETCH_HEAD)" == "$HEAD" ]]
          planner=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr"             --jq 'any(.labels[]; .name == "planner")')
          label=()
          case "$planner" in
            true)
              label=(--planner)
              echo "Planner label on #$pr: protected paths may change; red marks are still reviewed."
              ;;
            false) ;;
            *) exit 1 ;;
          esac
          report="$RUNNER_TEMP/test-evidence.txt"
          result=0
          # No --labels here: the queue reads no labels, and the pull request check that
          # required the read label had to pass before the change could enter the queue.
          python -I scripts/red_guard.py "${label[@]}" "$BASE" "$HEAD" > "$report" || result=$?
          cat "$report"
          {
            echo "### Test evidence in the merge queue (#$pr, planner label: $planner)"
            echo
            if [[ -s "$report" ]]; then
              echo '```text'
              cat "$report"
              echo '```'
            else
              echo "No protected evidence was removed or changed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Require live Feldera evidence for backend changes
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=$(git merge-base "$BASE" "$HEAD")
          python -I scripts/feldera_admission.py review "$base" "$HEAD" "$HEAD_REF" "$HEAD_REPO"
