name: Flatcar KubeVirt trial
on:
  workflow_dispatch:
  push:
    branches: [fix/run-tests-test_flatcar.py]
    paths:
      - '.github/workflows/flatcar-kubevirt.yml'
      - 'run/probes/**'
permissions:
  contents: read
jobs:
  host:
    if: github.repository == 'rezono-lang/rezono' && github.actor == 'vdo89'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify joined worker and accelerated guest on the same VM
        shell: bash
        run: |
          set -euo pipefail
          bash run/probes/worker-join/trial.sh
