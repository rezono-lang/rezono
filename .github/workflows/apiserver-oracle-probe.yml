name: Apiserver oracle dependency probe

on:
  push:
    branches: ["task/k8s-admission/test_offline_apiserver.py--test_offline_apiserver_accepts_only_the_published_cases"]

permissions:
  contents: read

jobs:
  upstream:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Lock and build the pinned policy evaluator
        shell: bash
        working-directory: k8s-admission/oracles/apiserver
        run: |
          set -euo pipefail
          go version
          go mod tidy
          module="$(go list -m -f '{{.Dir}}' k8s.io/apiserver)"
          policy="$module/pkg/admission/plugin/policy"
          grep -A 14 '^func NewMatcher' "$policy/matching/matching.go"
          grep -A 58 '^func .* ValidateInitialization' "$policy/generic/plugin.go"
          gofmt -w *.go
          for file in go.mod go.sum main.go release.go; do
            printf 'oracle-locked-file-%s:' "$file"
            base64 -w0 "$file"
            printf '\n'
          done
          go build -mod=readonly -o "$RUNNER_TEMP/rezono-apiserver-oracle" .
      - uses: ./.github/workflows/python-environment
        with:
          editable: -e admission -e canon -e checker -e compiler -e contracts/python -e edge/publisher -e loop -e publication
      - name: Check the actual published cases and absent parameters
        shell: bash
        env:
          GOFLAGS: -mod=readonly
        run: |
          set -euo pipefail
          python scripts/fast_check.py k8s-admission/test_offline_apiserver.py--test_offline_apiserver_accepts_only_the_published_cases
          python - <<'PY'
          import json
          from pathlib import Path
          import os
          import subprocess
          import sys
          from tempfile import TemporaryDirectory

          import yaml

          root = Path("k8s-admission")
          sys.path.insert(0, str(root))
          from admission_release import render_release
          from checked_release_fixture import MANIFEST_KEY, publish_evidence

          def load(name):
              return yaml.safe_load((root / "fixtures/server" / name).read_text())

          with TemporaryDirectory() as temp:
              dir = Path(temp)
              publication = load("publication.yaml")
              items = render_release(
                  ["admission-blue", "admission-green"], [publication],
                  store=publish_evidence(dir / "store"), manifest_key=MANIFEST_KEY,
              )
              items.append({"apiVersion": "v1", "kind": "Namespace", "metadata": {"name": "unmanaged"}})
              release = dir / "release.json"
              release.write_text(json.dumps({"apiVersion": "v1", "kind": "List", "items": items}))
              for ns, expected in [("admission-blue", True), ("admission-green", False), ("unmanaged", True)]:
                  pod = load("pod.yaml")
                  pod["metadata"]["namespace"] = ns
                  request = {
                      "uid": "offline-proof", "operation": "CREATE",
                      "kind": {"group": "", "version": "v1", "kind": "Pod"},
                      "resource": {"group": "", "version": "v1", "resource": "pods"},
                      "object": pod, "namespace": ns, "name": pod["metadata"]["name"], "dryRun": True,
                  }
                  review = {"apiVersion": "admission.k8s.io/v1", "kind": "AdmissionReview", "request": request}
                  run = subprocess.run(
                      [os.environ["RUNNER_TEMP"] + "/rezono-apiserver-oracle", "--release", str(release)],
                      input=json.dumps(review), text=True, capture_output=True, check=True,
                  )
                  response = json.loads(run.stdout)["response"]
                  assert response["uid"] == request["uid"]
                  assert response["allowed"] is expected, response
                  print(ns, response["allowed"], response.get("status", {}).get("message", ""))
                  if ns == "admission-green":
                      assert "param" in response["status"]["message"].lower(), response
          PY
