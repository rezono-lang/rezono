name: Resume Feldera evidence review
on:
  workflow_run:
    workflows: [Live Feldera oracle, Review test evidence]
    types: [completed]
permissions: {}
jobs:
  # Reruns a blocked policy job once its evidence passed, or dispatches the live oracle on a
  # same-repository branch whose head has no queued, running or passed run.
  resume:
    permissions:
      contents: read
      pull-requests: read
      actions: write
    if: >-
      (github.event.workflow_run.event == 'workflow_dispatch' &&
       github.event.workflow_run.path == '.github/workflows/feldera-oracle.yml' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event.workflow_run.event == 'pull_request_target' &&
       github.event.workflow_run.path == '.github/workflows/red-policy.yml' &&
       github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: feldera-review-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck a blocked source revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/feldera_admission.py resume
