name: Release rehearsal
on:
  workflow_call:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: requirements/.python-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.14.0'
          package-manager-cache: false
      - name: Check the installed distributions and report archive sizes
        run: bash scripts/release-check.sh "$RUNNER_TEMP/distributions"
      - name: Generate release notes
        run: python scripts/release-notes.py >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'workflow_dispatch'
        with:
          name: checked-distributions
          path: ${{ runner.temp }}/distributions/
          if-no-files-found: error
          retention-days: 2
