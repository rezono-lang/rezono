name: Release rehearsal
on:
  workflow_call:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  packages:
    # A newer push to main supersedes the rehearsal of an older one. A release
    # calls this workflow under its own event and is never cancelled here.
    concurrency:
      group: release-rehearsal-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: requirements/.python-version
      - uses: ./.github/actions/release-rehearsal
