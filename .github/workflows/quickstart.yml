name: README example
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quickstart:
    name: quickstart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: requirements/.python-version
      - name: Run the README example
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/quickstart.sh"
          import pathlib, re
          blocks = re.findall(r"^\x60{3}bash\n(.+?)^\x60{3}$", pathlib.Path("README.md").read_text(), re.M | re.S)
          if len(blocks) != 1:
              raise SystemExit("Expected one Bash quickstart in README.md")
          print(blocks[0])
          PY
          bash -euo pipefail "$RUNNER_TEMP/quickstart.sh"
