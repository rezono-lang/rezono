name: Provider run

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: provider-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify_ref:
    name: Verify main branch ref
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require exact refs/heads/main
        shell: bash
        run: test "$GITHUB_REF" = refs/heads/main

  provider_run:
    name: Run bounded provider workflow
    needs: verify_ref
    runs-on: ubuntu-24.04
    environment: provider-run
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Require live provider wiring before execution
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Live provider port command is not yet wired; see decisions/provider-workflow-dispatch.md"
          exit 1
      - name: Run step-level failure cleanup
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          echo "Step-level failure cleanup awaiting live provider wiring."

  cleanup:
    name: Clean up failed provider run
    needs: [verify_ref, provider_run]
    if: failure() && needs.verify_ref.result == 'success'
    runs-on: ubuntu-24.04
    environment: provider-run
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Report cleanup boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "Cleanup job reached only after verify_ref succeeded; awaiting live provider inventory wiring."
