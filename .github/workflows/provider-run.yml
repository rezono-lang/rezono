name: Provider run

on:
  workflow_dispatch:
    inputs:
      spec:
        description: Path to the pinned run specification JSON
        required: false
        type: string
      fixture_dir:
        description: Directory containing the pinned plan, price facts, and request
        required: false
        type: string

permissions: {}

concurrency:
  group: provider-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify_ref:
    name: Verify main branch ref
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require exact refs/heads/main
        shell: bash
        run: test "$GITHUB_REF" = refs/heads/main

  provider_run:
    name: Run bounded provider workflow
    needs: verify_ref
    runs-on: ubuntu-24.04
    environment: provider-run
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out pinned main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: ./.github/workflows/python-environment
        with:
          editable: -e canon -e compiler -e contracts/python -e loop
      - name: Run live provider command
        shell: bash
        env:
          REZONO_RUN_SPEC: ${{ inputs.spec }}
          REZONO_FIXTURE_DIR: ${{ inputs.fixture_dir }}
          REZONO_CLAIM_REMOTE: ${{ vars.REZONO_CLAIM_REMOTE }}
          REZONO_PROVIDER_PORTS: ${{ vars.REZONO_PROVIDER_PORTS }}
          REZONO_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python -m run.provider_run \
            --spec="$REZONO_RUN_SPEC" \
            --fixture-dir="$REZONO_FIXTURE_DIR" \
            --claim-remote="$REZONO_CLAIM_REMOTE" \
            --ports="$REZONO_PROVIDER_PORTS" \
            --run-id="$REZONO_RUN_ID"
      - name: Run step-level failure cleanup
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          echo "Provider run failed; verify claim remote and independent cleanup inventory."

  cleanup:
    name: Clean up failed provider run
    needs: [verify_ref, provider_run]
    if: failure() && needs.verify_ref.result == 'success'
    runs-on: ubuntu-24.04
    environment: provider-run
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out pinned main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Report cleanup boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "Cleanup job reached only after verify_ref succeeded; verify independent provider inventory."
