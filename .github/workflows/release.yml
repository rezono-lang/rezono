name: Publish Rezono
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: registry-release
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release-rehearsal.yml
  publish:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: checked-distributions
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.14.0'
          package-manager-cache: false
      - name: Select checked wheel for PyPI
        run: mkdir python-dist && mv dist/*.whl python-dist/
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
        with:
          packages-dir: python-dist/
          skip-existing: true
      - name: Publish the checked npm archive
        run: npm publish --ignore-scripts --access public dist/*.tgz
