name: Publish Rezono
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: registry-release
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release-rehearsal.yml
  publish:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      # Only for .node-version: the job publishes the checked distributions, not this checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: .node-version
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: checked-distributions
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Select checked wheel for PyPI
        run: mkdir python-dist && mv dist/*.whl python-dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: python-dist/
          skip-existing: true
      - name: Publish the checked npm archive
        run: npm publish --ignore-scripts --access public dist/*.tgz
