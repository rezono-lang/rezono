name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  # The merge queue tests the exact commit that later lands on main, and its
  # merge-group run selects every component, as a push run does. When that run
  # passed, the push run only refreshes the caches that pull requests restore
  # from main (discover and the node installs). A push without such evidence,
  # or a failed lookup, gets the full check.
  queue_evidence:
    name: Merge-queue evidence
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tested: ${{ steps.find.outputs.tested }}
    steps:
      - id: find
        name: Find a passing merge-group check for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tested=false
          for attempt in 1 2 3; do
            if runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=merge_group&head_sha=$SHA&per_page=20" \
                --jq '.workflow_runs[].id'); then
              for run in $runs; do
                if passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?filter=latest&per_page=100" \
                    --jq '[.jobs[] | select(.name == "check" and .conclusion == "success")] | length') &&
                   [[ "$passed" -gt 0 ]]; then
                  tested=true
                  echo "Merge-group run $run passed the check job for $SHA."
                  break
                fi
              done
              break
            fi
            echo "Listing merge-group runs failed (attempt $attempt); retrying." >&2
            sleep $((attempt * 10))
          done
          if [[ "$tested" == true ]]; then
            summary="The merge queue already passed $SHA; this push run only refreshes the shared caches."
          else
            summary="No passing merge-group check found for $SHA; this push run runs the full check."
          fi
          echo "$summary" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

  light_checks:
    name: Light checks
    needs: queue_evidence
    if: >-
      !cancelled() && (
        github.event_name == 'pull_request' ||
        github.event_name == 'merge_group' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
         needs.queue_evidence.outputs.tested != 'true'))
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - id: full_checkout
        name: Check out the candidate with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: release-source
      - name: Check tracked files and the exception budget
        working-directory: release-source
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: python3 -I scripts/leak_check.py --base "$BASE"
      - name: Test the leak check on a throwaway repository
        working-directory: release-source
        run: python3 -I scripts/test_leak_check.py -v
      - name: Check references to missing docs pages against their budget
        working-directory: release-source
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: python3 -I scripts/docs_links.py --base "$BASE"
      - name: Test the docs reference check on a throwaway repository
        working-directory: release-source
        run: python3 -I scripts/test_docs_links.py -v
      - name: Check Dependabot manifest coverage
        working-directory: release-source
        shell: bash
        run: |
          set -euo pipefail
          yq -o=json .github/dependabot.yml | python3 -I scripts/test_dependabot.py
      - name: Check that NOTICE licenses every tracked file
        working-directory: release-source
        run: python3 -I scripts/test_notice.py
      - name: Warn about new literals outside packs
        id: pack_warnings
        if: ${{ !cancelled() && steps.full_checkout.outcome == 'success' }}
        continue-on-error: true
        working-directory: release-source
        shell: bash
        env:
          POLICY: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          git show "$POLICY:scripts/pack_warnings.py" | python -I - "$BASE" "$HEAD"
      - name: Check the single commit used as the squash subject
        id: single_subject
        if: ${{ !cancelled() && steps.full_checkout.outcome == 'success' && github.event_name == 'pull_request' && github.event.pull_request.commits == 1 }}
        continue-on-error: true
        working-directory: release-source
        shell: bash
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python scripts/release-notes.py --subject "$(git log -1 --format=%s "$HEAD")"
      - name: Test the candidate pack warning rules
        id: pack_warning_tests
        if: ${{ !cancelled() && steps.full_checkout.outcome == 'success' }}
        continue-on-error: true
        working-directory: release-source
        run: python -I scripts/test_pack_warnings.py
      - name: Report advisory release checks
        if: ${{ !cancelled() }}
        shell: bash
        env:
          PACK_WARNINGS: ${{ steps.pack_warnings.outcome }}
          SINGLE_SUBJECT: ${{ steps.single_subject.outcome }}
          PACK_WARNING_TESTS: ${{ steps.pack_warning_tests.outcome }}
        run: |
          set -euo pipefail
          {
            printf '| Advisory release check | Outcome |\n'
            printf '| --- | --- |\n'
            printf '| Pack warnings | %s |\n' "$PACK_WARNINGS"
            printf '| Single-commit subject | %s |\n' "$SINGLE_SUBJECT"
            printf '| Pack warning tests | %s |\n' "$PACK_WARNING_TESTS"
          } >> "$GITHUB_STEP_SUMMARY"
      - id: python
        if: ${{ !cancelled() && steps.full_checkout.outcome == 'success' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: release-source/requirements/.python-version
      # The README makes editable installs. Give it its own checkout so the release build starts clean.
      - id: readme_checkout
        name: Check out the candidate for the README
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: readme-source
      - name: Run the README example
        if: ${{ !cancelled() && steps.readme_checkout.outcome == 'success' }}
        working-directory: readme-source
        shell: bash
        run: bash scripts/check-quickstart.sh
      - name: Run the release rehearsal
        if: ${{ !cancelled() && steps.python.outcome == 'success' && github.event_name != 'push' }}
        uses: ./release-source/.github/actions/release-rehearsal
        with:
          source-directory: release-source

  # A draft pull request gets only the light checks; marking it ready for review
  # starts a run with the full check.
  discover:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      python: ${{ steps.matrix.outputs.python }}
      has_python: ${{ steps.matrix.outputs.has_python }}
      node: ${{ steps.matrix.outputs.node }}
      has_node: ${{ steps.matrix.outputs.has_node }}
      pytest: ${{ steps.matrix.outputs.pytest }}
      has_pytest: ${{ steps.matrix.outputs.has_pytest }}
      python_editable: ${{ steps.matrix.outputs.python_editable }}
      cluster_mode: ${{ steps.cluster.outputs.mode }}
      cluster_tasks: ${{ steps.cluster.outputs.tasks }}
      role_publication: ${{ steps.role_publication.outputs.required }}
      red_before: ${{ steps.red_before.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Run policy regression examples
        shell: bash
        run: |
          set -euo pipefail
          python -I scripts/test_red_guard.py
          python -I scripts/test_red_list.py
          python -I scripts/test_feldera_admission.py
          python -I scripts/test_cluster_worker_tasks.py
          python -I scripts/test_role_publication_ci.py
          python -I scripts/test_standstill.py
      # Only reads test sources; a test without a milestone mark counts under "none".
      - name: Report red tests per milestone
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Red tests per milestone'
            echo
            python -I scripts/red_list.py --milestones
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # What must run and what counts as run come from the base, as the pack
      # warnings do: a candidate cannot weaken its own count through
      # scripts/components.py. The base scripts sit in a hidden directory of the
      # checkout, so they read the candidate's tree. The candidate's own copy
      # runs its regressions below and executes the shards; a change to the
      # matrix or inventory format must stay readable by the base until it lands.
      - name: Take the build rules from the base
        shell: bash
        env:
          POLICY: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p .build-base
          git archive "$POLICY" scripts | tar -x -C .build-base --strip-components=1
          echo "Build rules from $POLICY, scripts/components.py blob $(git rev-parse "$POLICY:scripts/components.py")"
      - id: matrix
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python3 .build-base/components.py ci-matrix
      - name: Select the role-publication proof
        id: role_publication
        env:
          BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
        run: python3 scripts/role_publication_ci.py select --base "$BASE" >> "$GITHUB_OUTPUT"
      # The rules come from the base, as for the pack warnings. The merge queue and
      # pushes skip the job; a pull request whose base lacks the rules runs it, and
      # the job reports that and passes.
      - name: Decide whether added tests must fail on the base source
        id: red_before
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo "Only a pull request runs its added tests on the base source."
            echo "required=false" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "$BASE:scripts/red_before.py" 2>/dev/null; then
            echo "scripts/red_before.py is not on the base $BASE."
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            policy="$RUNNER_TEMP/red-before"
            mkdir -p "$policy"
            for name in red_before.py red_guard.py; do
              git show "$BASE:scripts/$name" > "$policy/$name"
            done
            python3 -I "$policy/red_before.py" discover "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"
          fi
      # The selection's own regressions run whatever it selects: a pull request
      # that changes only scripts or workflows may select no component job.
      - uses: ./.github/workflows/python-environment
        with:
          editable: ${{ steps.matrix.outputs.python_editable }}
          oracle: ${{ contains(fromJSON(steps.matrix.outputs.python).*.folder, 'compiler') || contains(fromJSON(steps.matrix.outputs.python).*.folder, 'examples') }}
          save-cache: 'true'
      - name: Test candidate selection and exact-once evidence
        run: python -I .github/workflows/tests/test_components.py
      # These examples run pytest, so they wait for the locked environment.
      - name: Test the candidate rules for added tests on the base source
        run: python -I scripts/test_red_before.py
      - name: Collect each selected Python component once
        if: steps.matrix.outputs.has_pytest == 'true'
        env:
          PYTHON_MATRIX: ${{ steps.matrix.outputs.pytest }}
          PYTHONHASHSEED: '0'
          REZONO_HYPOTHESIS_PROFILE: ci
        run: |
          set -euo pipefail
          # The candidate's environment action must not narrow the inventory.
          unset PYTEST_ADDOPTS PYTEST_PLUGINS
          python .build-base/components.py inventory "$RUNNER_TEMP/inventory"
          while IFS= read -r -d '' report; do
            python scripts/red_list.py --skips "$report" | tee -a "$GITHUB_STEP_SUMMARY"
          done < <(find "$RUNNER_TEMP/inventory" -name collection.xml -print0)
      - name: Save the independent pytest inventory
        if: always() && steps.matrix.outputs.has_pytest == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pytest-inventory
          path: ${{ runner.temp }}/inventory
          if-no-files-found: error
          overwrite: true
          retention-days: 2
      # Reads pack sources and test files only. The coverage page keeps no copy of this output.
      - name: Report language coverage
        if: steps.matrix.outputs.has_pytest == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -I compiler/tests/rezono/language_usage.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Route the disposable cluster from the candidate
        id: cluster
        env:
          WORKER_BRANCH: ${{ github.head_ref }}
          TASK_BASE: ${{ github.event.merge_group.base_sha || (startsWith(github.head_ref, 'task/') && github.event.pull_request.base.sha) || '' }}
          CANDIDATE_BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          PULL_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python scripts/cluster_worker_tasks.py "$RUNNER_TEMP/inventory" --worker "$WORKER_BRANCH" \
            --base "$TASK_BASE" --diff-base "$CANDIDATE_BASE" --pull-head "$PULL_HEAD" >> "$GITHUB_OUTPUT"

  cluster_worker:
    needs: [discover, queue_evidence]
    if: >-
      !cancelled() && needs.discover.result == 'success' &&
      needs.queue_evidence.outputs.tested != 'true' &&
      (needs.discover.outputs.cluster_mode == 'tasks' || needs.discover.outputs.cluster_mode == 'suite')
    uses: ./.github/workflows/disposable-cluster.yml
    with:
      tasks: ${{ needs.discover.outputs.cluster_tasks }}
      base: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}

  role_publication:
    name: Published role tools
    needs: [discover, queue_evidence]
    if: >-
      !cancelled() && needs.discover.result == 'success' &&
      needs.queue_evidence.outputs.tested != 'true' &&
      needs.discover.outputs.role_publication == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/workflows/python-environment
        with:
          editable: ${{ needs.discover.outputs.python_editable }}
          oracle: 'true'
      - name: Install the locked MCP dependencies
        run: npm ci --ignore-scripts --prefix tools/mcp
      - name: Verify role-scoped current, retained and sweep publications
        run: python scripts/role_publication_ci.py run

  # A pull request that changes source and adds tests without a red mark must
  # show that at least one added test fails on the base source. The job lays the
  # pull request's protected paths over the base and runs only those tests, with
  # the rules from the base.
  red_before:
    name: Added tests on the base source
    needs: [discover]
    if: >-
      !cancelled() && needs.discover.result == 'success' &&
      needs.discover.outputs.red_before == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the base source with the pull request's protected paths
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE:scripts/red_before.py" 2>/dev/null; then
            echo "scripts/red_before.py is not on the base $BASE yet, so nothing runs there." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          policy="$RUNNER_TEMP/red-before"
          mkdir -p "$policy"
          for name in red_before.py red_guard.py; do
            git show "$BASE:scripts/$name" > "$policy/$name"
          done
          python3 -I "$policy/red_before.py" prepare "$BASE" "$HEAD" "$policy/selection.txt"
          editable=""
          for package in $(python3 scripts/components.py python-packages); do
            editable+=" -e $package"
          done
          oracle=false
          if grep -qE '^(compiler|examples)/' "$policy/selection.txt"; then
            oracle=true
          fi
          {
            echo "run=true"
            echo "editable=${editable# }"
            echo "oracle=$oracle"
          } >> "$GITHUB_OUTPUT"
      - uses: ./.github/workflows/python-environment
        if: steps.prepare.outputs.run == 'true'
        with:
          editable: ${{ steps.prepare.outputs.editable }}
          oracle: ${{ steps.prepare.outputs.oracle }}
      - name: Run the added tests on the base source
        if: steps.prepare.outputs.run == 'true'
        shell: bash
        env:
          REZONO_HYPOTHESIS_PROFILE: ci
          PYTHONHASHSEED: '0'
        run: |
          set -euo pipefail
          python -I "$RUNNER_TEMP/red-before/red_before.py" run "$RUNNER_TEMP/red-before/selection.txt"
      # An evidence completion lifts one red mark beside only the evidence data its test reads.
      # The step above showed the test red without that data; this one lays it over the base
      # and requires the test to pass. Any other pull request passes this step unchanged.
      - name: Run a completed test with the new evidence
        if: steps.prepare.outputs.run == 'true'
        shell: bash
        env:
          REZONO_HYPOTHESIS_PROFILE: ci
          PYTHONHASHSEED: '0'
        run: |
          set -euo pipefail
          policy="$RUNNER_TEMP/red-before"
          if ! grep -q '^def green(' "$policy/red_before.py"; then
            echo "The base red_before.py has no evidence completion yet, so nothing more runs."
            exit 0
          fi
          python -I "$policy/red_before.py" green "$BASE" "$HEAD" "$policy/selection.txt"

  python:
    needs: [discover, queue_evidence]
    if: >-
      !cancelled() && needs.discover.result == 'success' &&
      needs.queue_evidence.outputs.tested != 'true' &&
      needs.discover.outputs.has_python == 'true'
    name: python (${{ matrix.component.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.discover.outputs.python) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/workflows/python-environment
        with:
          editable: ${{ needs.discover.outputs.python_editable }}
          oracle: ${{ matrix.component.folder == 'compiler' || matrix.component.folder == 'examples' }}
      - name: Prepare the Ubuntu worker seed tools
        if: matrix.component.folder == 'run'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v bsdtar >/dev/null; then
            # A mirror can answer 503 for minutes; retry update and install as a whole.
            attempts=5
            for attempt in $(seq 1 "$attempts"); do
              echo "apt attempt $attempt/$attempts: libarchive-tools"
              if sudo apt-get -o Acquire::Retries=3 update -qq &&
                 sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libarchive-tools; then
                break
              fi
              if (( attempt == attempts )); then
                echo "::error::apt could not install libarchive-tools after $attempts attempts"
                exit 1
              fi
              pause=$(( attempt * 15 < 60 ? attempt * 15 : 60 ))
              echo "apt attempt $attempt failed; retrying in ${pause}s"
              sleep "$pause"
            done
          fi
          bsdtar --version
          renderer="$RUNNER_TEMP/rezono-worker-render"
          bash run/probes/worker-join/prepare-renderer.sh "$renderer"
          test -x "$renderer"
          printf 'REZONO_WORKER_RENDERER=%s\n' "$renderer" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pytest-inventory
          path: ${{ runner.temp }}/inventory
      - name: Check ${{ matrix.component.folder }}
        shell: bash
        env:
          REZONO_HYPOTHESIS_PROFILE: ci
          PYTHONHASHSEED: '0'
          COMPONENT: ${{ matrix.component.folder }}
          KIND: ${{ matrix.component.kind }}
          SHARD: ${{ matrix.component.shard }}
          TOTAL: ${{ matrix.component.total }}
        run: |
          set -euo pipefail
          folder="$COMPONENT"
          if [[ "$KIND" == contracts ]]; then
            python scripts/components.py check-contracts
            folder="$COMPONENT/python"
          fi
          /usr/bin/time -f 'Runner wall=%e s user=%U s system=%S s CPU=%P peak RSS=%M KiB' \
            python scripts/components.py run-shard "$folder" "$SHARD" "$TOTAL" \
              "$RUNNER_TEMP/inventory" "$RUNNER_TEMP/reports" "$RUNNER_TEMP/receipts"
      - name: Save execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pytest-execution-${{ strategy.job-index }}
          path: ${{ runner.temp }}/receipts
          if-no-files-found: error
          overwrite: true
          retention-days: 2
      - name: Report actual skips
        if: always() && hashFiles('scripts/red_list.py') != ''
        run: |
          set -euo pipefail
          shopt -s nullglob
          for report in "$RUNNER_TEMP"/reports/*.xml; do
            python scripts/red_list.py --skips "$report" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Measure the worker check
        if: startsWith(github.head_ref, 'task/') && matrix.component.shard == 0 && needs.discover.outputs.cluster_mode != 'tasks'
        env:
          BRANCH: ${{ github.head_ref }}
          COMPONENT: ${{ matrix.component.folder }}
        run: |
          set -euo pipefail
          task=${BRANCH#task/}
          if [[ "$task" == "$COMPONENT/"* ]]; then
            git fetch --no-tags origin main:refs/remotes/origin/main
            start=$SECONDS
            python scripts/fast_check.py "$task" | tee "$RUNNER_TEMP/fast.txt"
            echo "Fast check took $((SECONDS-start)) seconds and printed $(wc -l < "$RUNNER_TEMP/fast.txt") lines" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # On a push that the merge queue already passed, the node jobs only install,
  # which refreshes the npm caches that pull requests restore from main.
  node:
    needs: [discover, queue_evidence]
    if: >-
      !cancelled() && needs.discover.result == 'success' &&
      needs.discover.outputs.has_node == 'true'
    name: node (${{ matrix.component.folder }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.discover.outputs.node) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ${{ matrix.component.folder }}/package-lock.json
      - name: Install from lockfile
        working-directory: ${{ matrix.component.folder }}
        run: npm ci
      - name: Test ${{ matrix.component.folder }}
        if: needs.queue_evidence.outputs.tested != 'true'
        working-directory: ${{ matrix.component.folder }}
        run: npm test
      # The component's pytest files run here, beside its installed packages,
      # and count in the exact-once inventory that the check job verifies.
      - uses: ./.github/workflows/python-environment
        if: matrix.component.pytest && needs.queue_evidence.outputs.tested != 'true'
        with:
          editable: ${{ needs.discover.outputs.python_editable }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: matrix.component.pytest && needs.queue_evidence.outputs.tested != 'true'
        with:
          name: pytest-inventory
          path: ${{ runner.temp }}/inventory
      - name: Check the pytest files of ${{ matrix.component.folder }}
        if: matrix.component.pytest && needs.queue_evidence.outputs.tested != 'true'
        shell: bash
        env:
          REZONO_HYPOTHESIS_PROFILE: ci
          PYTHONHASHSEED: '0'
          COMPONENT: ${{ matrix.component.folder }}
        run: |
          set -euo pipefail
          python scripts/components.py run-shard "$COMPONENT" 0 1             "$RUNNER_TEMP/inventory" "$RUNNER_TEMP/reports" "$RUNNER_TEMP/receipts"
      - name: Save execution evidence
        if: always() && matrix.component.pytest && needs.queue_evidence.outputs.tested != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pytest-execution-node-${{ strategy.job-index }}
          path: ${{ runner.temp }}/receipts
          if-no-files-found: error
          overwrite: true
          retention-days: 2
      - name: Report actual skips
        if: always() && matrix.component.pytest && needs.queue_evidence.outputs.tested != 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for report in "$RUNNER_TEMP"/reports/*.xml; do
            python scripts/red_list.py --skips "$report" | tee -a "$GITHUB_STEP_SUMMARY"
          done

  check:
    name: check
    if: always()
    needs: [queue_evidence, discover, python, node, light_checks, cluster_worker, role_publication, red_before]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The count comes from the base's scripts, as the inventory does.
      - name: Check out the base build rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: needs.discover.outputs.has_pytest == 'true' && needs.queue_evidence.outputs.tested != 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: always() && needs.discover.outputs.has_pytest == 'true' && needs.queue_evidence.outputs.tested != 'true'
        with:
          name: pytest-inventory
          path: ${{ runner.temp }}/inventory
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: always() && needs.discover.outputs.has_pytest == 'true' && needs.queue_evidence.outputs.tested != 'true'
        with:
          pattern: pytest-execution-*
          path: ${{ runner.temp }}/receipts
          merge-multiple: true
      - name: Verify every inventoried test started and finished exactly once
        if: always() && needs.discover.outputs.has_pytest == 'true' && needs.queue_evidence.outputs.tested != 'true'
        env:
          PYTHON_MATRIX: ${{ needs.discover.outputs.pytest }}
        run: python3 scripts/components.py verify-execution "$RUNNER_TEMP/inventory" "$RUNNER_TEMP/receipts"
      - name: Record runner wait separately from execution
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '| Job | Runner wait (s) | Execution (s) |'
            echo '| --- | ---: | ---: |'
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
              --jq '.jobs[] | select(.runner_id > 0 and .started_at) | (.started_at | fromdateiso8601) as $start | "| \(.name) | \($start - (.created_at | fromdateiso8601)) | \(if .completed_at then (.completed_at | fromdateiso8601) - $start else "running" end) |"'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify component jobs
        if: always()
        shell: bash
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          NODE_RESULT: ${{ needs.node.result }}
          LIGHT_RESULT: ${{ needs.light_checks.result }}
          CLUSTER_RESULT: ${{ needs.cluster_worker.result }}
          CLUSTER_MODE: ${{ needs.discover.outputs.cluster_mode }}
          ROLE_PUBLICATION_REQUIRED: ${{ needs.discover.outputs.role_publication }}
          ROLE_PUBLICATION_RESULT: ${{ needs.role_publication.result }}
          RED_BEFORE_REQUIRED: ${{ needs.discover.outputs.red_before }}
          RED_BEFORE_RESULT: ${{ needs.red_before.result }}
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          QUEUE_TESTED: ${{ github.event_name == 'push' && needs.queue_evidence.outputs.tested == 'true' }}
        run: |
          set -euo pipefail
          echo "discover=$DISCOVER_RESULT python=$PYTHON_RESULT node=$NODE_RESULT light=$LIGHT_RESULT cluster=$CLUSTER_RESULT role_publication=$ROLE_PUBLICATION_RESULT red_before=$RED_BEFORE_RESULT draft=$DRAFT queue_tested=$QUEUE_TESTED"
          if [[ "$DRAFT" == true ]]; then
            # A draft gets only the light checks; ready_for_review starts the full check.
            [ "$LIGHT_RESULT" = success ]
            for result in "$DISCOVER_RESULT" "$PYTHON_RESULT" "$NODE_RESULT" "$CLUSTER_RESULT" "$ROLE_PUBLICATION_RESULT" "$RED_BEFORE_RESULT"; do
              [ "$result" = skipped ]
            done
            exit 0
          fi
          if [[ "$QUEUE_TESTED" == true ]]; then
            # The merge queue passed this commit; only the cache refresh ran.
            [ "$DISCOVER_RESULT" = success ]
            case "$NODE_RESULT" in success|skipped) ;; *) exit 1 ;; esac
            for result in "$LIGHT_RESULT" "$PYTHON_RESULT" "$CLUSTER_RESULT" "$ROLE_PUBLICATION_RESULT" "$RED_BEFORE_RESULT"; do
              [ "$result" = skipped ]
            done
            exit 0
          fi
          [ "$DISCOVER_RESULT" = "success" ]
          case "$PYTHON_RESULT" in success|skipped) ;; *) exit 1 ;; esac
          case "$NODE_RESULT" in success|skipped) ;; *) exit 1 ;; esac
          case "$GITHUB_EVENT_NAME" in
            pull_request|merge_group|push) [ "$LIGHT_RESULT" = success ] ;;
            workflow_dispatch) [ "$LIGHT_RESULT" = skipped ] ;;
            *) exit 1 ;;
          esac
          case "$CLUSTER_MODE" in
            none) [ "$CLUSTER_RESULT" = skipped ] ;;
            suite|tasks) [ "$CLUSTER_RESULT" = success ] ;;
            *) exit 1 ;;
          esac
          case "$ROLE_PUBLICATION_REQUIRED" in
            true) [ "$ROLE_PUBLICATION_RESULT" = success ] ;;
            false) [ "$ROLE_PUBLICATION_RESULT" = skipped ] ;;
            *) exit 1 ;;
          esac
          case "$RED_BEFORE_REQUIRED" in
            true) [ "$RED_BEFORE_RESULT" = success ] ;;
            false) [ "$RED_BEFORE_RESULT" = skipped ] ;;
            *) exit 1 ;;
          esac
