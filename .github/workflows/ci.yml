name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  light_checks:
    name: Light checks
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - id: full_checkout
        name: Check out the candidate with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: release-source
      - name: Check tracked files and the exception budget
        working-directory: release-source
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: python3 -I scripts/leak_check.py --base "$BASE"
      - name: Check Dependabot manifest coverage
        working-directory: release-source
        shell: bash
        run: |
          set -euo pipefail
          yq -o=json .github/dependabot.yml | python3 -I scripts/test_dependabot.py
      - name: Warn about new literals outside packs
        id: pack_warnings
        if: ${{ !cancelled() && steps.full_checkout.outcome == 'success' }}
        continue-on-error: true
        working-directory: release-source
        shell: bash
        env:
          POLICY: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          git show "$POLICY:scripts/pack_warnings.py" | python -I - "$BASE" "$HEAD"
      - name: Check the single commit used as the squash subject
        id: single_subject
        if: ${{ !cancelled() && steps.full_checkout.outcome == 'success' && github.event_name == 'pull_request' && github.event.pull_request.commits == 1 }}
        continue-on-error: true
        working-directory: release-source
        shell: bash
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python scripts/release-notes.py --subject "$(git log -1 --format=%s "$HEAD")"
      - name: Test the candidate pack warning rules
        id: pack_warning_tests
        if: ${{ !cancelled() && steps.full_checkout.outcome == 'success' }}
        continue-on-error: true
        working-directory: release-source
        run: python -I scripts/test_pack_warnings.py
      - name: Report advisory release checks
        if: ${{ !cancelled() }}
        shell: bash
        env:
          PACK_WARNINGS: ${{ steps.pack_warnings.outcome }}
          SINGLE_SUBJECT: ${{ steps.single_subject.outcome }}
          PACK_WARNING_TESTS: ${{ steps.pack_warning_tests.outcome }}
        run: |
          set -euo pipefail
          {
            printf '| Advisory release check | Outcome |\n'
            printf '| --- | --- |\n'
            printf '| Pack warnings | %s |\n' "$PACK_WARNINGS"
            printf '| Single-commit subject | %s |\n' "$SINGLE_SUBJECT"
            printf '| Pack warning tests | %s |\n' "$PACK_WARNING_TESTS"
          } >> "$GITHUB_STEP_SUMMARY"
      - id: python
        if: ${{ !cancelled() && steps.full_checkout.outcome == 'success' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: release-source/requirements/.python-version
      # The README makes editable installs. Give it its own checkout so the release build starts clean.
      - id: readme_checkout
        name: Check out the candidate for the README
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: readme-source
      - name: Run the README example
        if: ${{ !cancelled() && steps.readme_checkout.outcome == 'success' }}
        working-directory: readme-source
        shell: bash
        run: bash scripts/check-quickstart.sh
      - name: Run the release rehearsal
        if: ${{ !cancelled() && steps.python.outcome == 'success' && github.event_name != 'push' }}
        uses: ./release-source/.github/actions/release-rehearsal
        with:
          source-directory: release-source

  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      python: ${{ steps.matrix.outputs.python }}
      has_python: ${{ steps.matrix.outputs.has_python }}
      node: ${{ steps.matrix.outputs.node }}
      has_node: ${{ steps.matrix.outputs.has_node }}
      python_editable: ${{ steps.matrix.outputs.python_editable }}
      cluster_mode: ${{ steps.cluster.outputs.mode }}
      cluster_tasks: ${{ steps.cluster.outputs.tasks }}
      role_publication: ${{ steps.role_publication.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Run policy regression examples
        shell: bash
        run: |
          set -euo pipefail
          python -I scripts/test_red_guard.py
          python -I scripts/test_feldera_admission.py
          python -I scripts/test_cluster_worker_tasks.py
          python -I scripts/test_role_publication_ci.py
      - id: matrix
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python3 scripts/components.py ci-matrix
      - name: Select the role-publication proof
        id: role_publication
        env:
          BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
        run: python3 scripts/role_publication_ci.py select --base "$BASE" >> "$GITHUB_OUTPUT"
      - uses: ./.github/workflows/python-environment
        if: steps.matrix.outputs.has_python == 'true'
        with:
          editable: ${{ steps.matrix.outputs.python_editable }}
          oracle: ${{ contains(fromJSON(steps.matrix.outputs.python).*.folder, 'compiler') || contains(fromJSON(steps.matrix.outputs.python).*.folder, 'examples') }}
          save-cache: 'true'
      - name: Test candidate selection and exact-once evidence
        if: steps.matrix.outputs.has_python == 'true'
        run: python -I .github/workflows/tests/test_components.py
      - name: Collect each selected Python component once
        if: steps.matrix.outputs.has_python == 'true'
        env:
          PYTHON_MATRIX: ${{ steps.matrix.outputs.python }}
          PYTHONHASHSEED: '0'
          REZONO_HYPOTHESIS_PROFILE: ci
        run: |
          set -euo pipefail
          python scripts/components.py inventory "$RUNNER_TEMP/inventory"
          while IFS= read -r -d '' report; do
            python scripts/red_list.py --skips "$report" | tee -a "$GITHUB_STEP_SUMMARY"
          done < <(find "$RUNNER_TEMP/inventory" -name collection.xml -print0)
      - name: Save the independent pytest inventory
        if: always() && steps.matrix.outputs.has_python == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pytest-inventory
          path: ${{ runner.temp }}/inventory
          if-no-files-found: error
          overwrite: true
          retention-days: 2
      - name: Route the disposable cluster from the candidate
        id: cluster
        env:
          WORKER_BRANCH: ${{ github.head_ref }}
          TASK_BASE: ${{ github.event.merge_group.base_sha || (startsWith(github.head_ref, 'task/') && github.event.pull_request.base.sha) || '' }}
          CANDIDATE_BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          PULL_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python scripts/cluster_worker_tasks.py "$RUNNER_TEMP/inventory" --worker "$WORKER_BRANCH" \
            --base "$TASK_BASE" --diff-base "$CANDIDATE_BASE" --pull-head "$PULL_HEAD" >> "$GITHUB_OUTPUT"

  cluster_worker:
    needs: discover
    if: needs.discover.outputs.cluster_mode == 'tasks' || needs.discover.outputs.cluster_mode == 'suite'
    uses: ./.github/workflows/disposable-cluster.yml
    with:
      tasks: ${{ needs.discover.outputs.cluster_tasks }}
      base: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}

  role_publication:
    name: Published role tools
    needs: discover
    if: needs.discover.outputs.role_publication == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/workflows/python-environment
        with:
          editable: ${{ needs.discover.outputs.python_editable }}
          oracle: 'true'
      - name: Install the locked MCP dependencies
        run: npm ci --ignore-scripts --prefix tools/mcp
      - name: Verify role-scoped current, retained and sweep publications
        run: python scripts/role_publication_ci.py run

  python:
    needs: discover
    if: needs.discover.outputs.has_python == 'true'
    name: python (${{ matrix.component.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.discover.outputs.python) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/workflows/python-environment
        with:
          editable: ${{ needs.discover.outputs.python_editable }}
          oracle: ${{ matrix.component.folder == 'compiler' || matrix.component.folder == 'examples' }}
      - name: Prepare the Ubuntu worker seed tools
        if: matrix.component.folder == 'run'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v bsdtar >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libarchive-tools
          fi
          bsdtar --version
          renderer="$RUNNER_TEMP/rezono-worker-render"
          bash run/probes/worker-join/prepare-renderer.sh "$renderer"
          test -x "$renderer"
          printf 'REZONO_WORKER_RENDERER=%s\n' "$renderer" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pytest-inventory
          path: ${{ runner.temp }}/inventory
      - name: Check ${{ matrix.component.folder }}
        shell: bash
        env:
          REZONO_HYPOTHESIS_PROFILE: ci
          PYTHONHASHSEED: '0'
          COMPONENT: ${{ matrix.component.folder }}
          KIND: ${{ matrix.component.kind }}
          SHARD: ${{ matrix.component.shard }}
          TOTAL: ${{ matrix.component.total }}
        run: |
          set -euo pipefail
          folder="$COMPONENT"
          if [[ "$KIND" == contracts ]]; then
            python scripts/components.py check-contracts
            folder="$COMPONENT/python"
          fi
          /usr/bin/time -f 'Runner wall=%e s user=%U s system=%S s CPU=%P peak RSS=%M KiB' \
            python scripts/components.py run-shard "$folder" "$SHARD" "$TOTAL" \
              "$RUNNER_TEMP/inventory" "$RUNNER_TEMP/reports" "$RUNNER_TEMP/receipts"
      - name: Save execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pytest-execution-${{ strategy.job-index }}
          path: ${{ runner.temp }}/receipts
          if-no-files-found: error
          overwrite: true
          retention-days: 2
      - name: Report actual skips
        if: always() && hashFiles('scripts/red_list.py') != ''
        run: |
          set -euo pipefail
          shopt -s nullglob
          for report in "$RUNNER_TEMP"/reports/*.xml; do
            python scripts/red_list.py --skips "$report" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Measure the worker check
        if: startsWith(github.head_ref, 'task/') && matrix.component.shard == 0 && needs.discover.outputs.cluster_mode != 'tasks'
        env:
          BRANCH: ${{ github.head_ref }}
          COMPONENT: ${{ matrix.component.folder }}
        run: |
          set -euo pipefail
          task=${BRANCH#task/}
          if [[ "$task" == "$COMPONENT/"* ]]; then
            git fetch --no-tags origin main:refs/remotes/origin/main
            start=$SECONDS
            python scripts/fast_check.py "$task" | tee "$RUNNER_TEMP/fast.txt"
            echo "Fast check took $((SECONDS-start)) seconds and printed $(wc -l < "$RUNNER_TEMP/fast.txt") lines" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  node:
    needs: discover
    if: needs.discover.outputs.has_node == 'true'
    name: node (${{ matrix.component.folder }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.discover.outputs.node) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ${{ matrix.component.folder }}/package-lock.json
      - name: Install from lockfile
        working-directory: ${{ matrix.component.folder }}
        run: npm ci
      - name: Test ${{ matrix.component.folder }}
        working-directory: ${{ matrix.component.folder }}
        run: npm test

  check:
    name: check
    if: always()
    needs: [discover, python, node, light_checks, cluster_worker, role_publication]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: needs.discover.outputs.has_python == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: always() && needs.discover.outputs.has_python == 'true'
        with:
          name: pytest-inventory
          path: ${{ runner.temp }}/inventory
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: always() && needs.discover.outputs.has_python == 'true'
        with:
          pattern: pytest-execution-*
          path: ${{ runner.temp }}/receipts
          merge-multiple: true
      - name: Verify every inventoried test started and finished exactly once
        if: always() && needs.discover.outputs.has_python == 'true'
        env:
          PYTHON_MATRIX: ${{ needs.discover.outputs.python }}
        run: python3 scripts/components.py verify-execution "$RUNNER_TEMP/inventory" "$RUNNER_TEMP/receipts"
      - name: Record runner wait separately from execution
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '| Job | Runner wait (s) | Execution (s) |'
            echo '| --- | ---: | ---: |'
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
              --jq '.jobs[] | select(.runner_id > 0 and .started_at) | (.started_at | fromdateiso8601) as $start | "| \(.name) | \($start - (.created_at | fromdateiso8601)) | \(if .completed_at then (.completed_at | fromdateiso8601) - $start else "running" end) |"'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify component jobs
        if: always()
        shell: bash
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          NODE_RESULT: ${{ needs.node.result }}
          LIGHT_RESULT: ${{ needs.light_checks.result }}
          CLUSTER_RESULT: ${{ needs.cluster_worker.result }}
          CLUSTER_MODE: ${{ needs.discover.outputs.cluster_mode }}
          ROLE_PUBLICATION_REQUIRED: ${{ needs.discover.outputs.role_publication }}
          ROLE_PUBLICATION_RESULT: ${{ needs.role_publication.result }}
        run: |
          set -euo pipefail
          echo "discover=$DISCOVER_RESULT python=$PYTHON_RESULT node=$NODE_RESULT light=$LIGHT_RESULT cluster=$CLUSTER_RESULT role_publication=$ROLE_PUBLICATION_RESULT"
          [ "$DISCOVER_RESULT" = "success" ]
          case "$PYTHON_RESULT" in success|skipped) ;; *) exit 1 ;; esac
          case "$NODE_RESULT" in success|skipped) ;; *) exit 1 ;; esac
          case "$GITHUB_EVENT_NAME" in
            pull_request|merge_group|push) [ "$LIGHT_RESULT" = success ] ;;
            workflow_dispatch) [ "$LIGHT_RESULT" = skipped ] ;;
            *) exit 1 ;;
          esac
          case "$CLUSTER_MODE" in
            none) [ "$CLUSTER_RESULT" = skipped ] ;;
            suite|tasks) [ "$CLUSTER_RESULT" = success ] ;;
            *) exit 1 ;;
          esac
          case "$ROLE_PUBLICATION_REQUIRED" in
            true) [ "$ROLE_PUBLICATION_RESULT" = success ] ;;
            false) [ "$ROLE_PUBLICATION_RESULT" = skipped ] ;;
            *) exit 1 ;;
          esac
