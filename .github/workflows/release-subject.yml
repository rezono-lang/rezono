name: Release subject
on:
  push:
    branches: [main]
    paths: [scripts/pack_warnings.py, scripts/test_pack_warnings.py, .github/workflows/release-subject.yml]
  pull_request:
    types: [opened, reopened, synchronize, edited]
permissions:
  contents: read
jobs:
  subjects:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Warn about new literals outside packs
        shell: bash
        env:
          POLICY: ${{ github.event.pull_request.base.sha || github.sha }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git show "$POLICY:scripts/pack_warnings.py" | python -I - "$BASE" "$HEAD"
      - name: Check the pull request title
        if: github.event_name == 'pull_request'
        env:
          SUBJECT: ${{ github.event.pull_request.title }}
        run: python scripts/release-notes.py --subject "$SUBJECT"
      - name: Check the single commit used as the squash subject
        if: github.event_name == 'pull_request' && github.event.pull_request.commits == 1
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python scripts/release-notes.py --subject "$(git log -1 --format=%s "$HEAD")"
      - name: Test the candidate pack warning rules
        run: python -I scripts/test_pack_warnings.py
