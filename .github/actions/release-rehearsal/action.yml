name: Rehearse the release
description: Build and verify the release distributions and write the release notes.
inputs:
  source-directory:
    description: Path to the full checkout from the workspace.
    default: '.'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version-file: ${{ inputs.source-directory }}/.node-version
        package-manager-cache: false
    - name: Check the installed distributions and report archive sizes
      working-directory: ${{ inputs.source-directory }}
      shell: bash
      run: bash scripts/release-check.sh "$RUNNER_TEMP/distributions"
    - name: Generate release notes
      working-directory: ${{ inputs.source-directory }}
      shell: bash
      run: python scripts/release-notes.py >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: github.event_name == 'workflow_dispatch'
      with:
        name: checked-distributions
        path: ${{ runner.temp }}/distributions/
        if-no-files-found: error
        retention-days: 2
