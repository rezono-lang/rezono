id: expression-ask-partial-call
source: decisions/language-expression-semantics.md#2-linking-partial-predicates
status: settled
# A question calls a derived predicate that can be undecided for a key. `zero(x)` stands for
# `x in Stage and x.rank = 0`, and the rank of `a` is an archived unknown. Expectations follow
# decisions/language-expression-semantics.md §2 rule 3 and the `ask` classification after its list:
# a keyed outcome gives the actual undecided row; success rows alone support positive matches only.
input:
  rows:
    - {$kind: Stage, $id: a, rank: {$unknown: not_measured}}
    - {$kind: Stage, $id: b, rank: "0"}
    - {$kind: Stage, $id: c, rank: "2"}
  role_schema:
    rezono: "1.0"
    pack: order-check
    base: https://example.org/order-check/
    kinds:
      Stage:
        world: closed
        id: {type: Text}
        slots:
          rank: {type: Integer, card: "1", states: [known, unknown]}
  predicates:
    # `states` is the linked set of truth states a ground call can take. `outcome` says whether the
    # publication carries a checked outcome keyed by the complete invocation.
    zero: {binders: [{name: x, ref: Stage}], world: closed, states: [known, unknown], outcome: false}
    zero_decided: {binders: [{name: x, ref: Stage}], world: closed, states: [known, unknown], outcome: true}
    staged: {binders: [{name: x, ref: Stage}], world: closed, states: [known], outcome: false}
  successes:
    zero: [[b]]
    zero_decided: [[b]]
    staged: [[a], [b], [c]]
  outcomes:
    zero_decided:
      - {key: [a], state: unknown, reason: not_measured, cause: {relation: stage__rank, key: [a]}}
      - {key: [b], state: known, value: true}
      - {key: [c], state: known, value: false}
  cases:
    - id: success-only-negation
      question: "ask x: Stage where not zero(x)"
      error: {code: R047, text: "not zero(x)"}
    - id: success-only-count
      question: "ask x: Stage where true show (Stage where zero(it)).count()"
      error: {code: R047, text: "zero(it)"}
    - id: success-only-positive
      question: "ask x: Stage where zero(x)"
    - id: keyed-negation
      question: "ask x: Stage where not zero_decided(x)"
    - id: keyed-positive
      question: "ask x: Stage where zero_decided(x)"
    - id: total-negation
      question: "ask x: Stage where not staged(x)"
expect:
  value:
    success-only-positive:
      rows: [b]
      undecided: []
      counts: {rows: 1, undecided: 0, not_applicable: 0}
    keyed-negation:
      rows: [c]
      undecided:
        - {id: a, state: unknown, reason: not_measured, cause_relation: stage__rank, cause_key: '["a"]'}
      counts: {rows: 1, undecided: 1, not_applicable: 0}
    keyed-positive:
      rows: [b]
      undecided:
        - {id: a, state: unknown, reason: not_measured, cause_relation: stage__rank, cause_key: '["a"]'}
      counts: {rows: 1, undecided: 1, not_applicable: 0}
    total-negation:
      rows: []
      undecided: []
      counts: {rows: 0, undecided: 0, not_applicable: 0}
  state: known
  reason: null
  witness: null
