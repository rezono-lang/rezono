# The platform's Gateway (Gateway API), implemented by Envoy Gateway: TLS ends here, with a certificate of the
# run's own authority (Secret `rede-tls`, made by kind.sh per run), and the profile's HTTPRoute attaches to it
# from the namespace `rede`. Envoy Gateway runs its proxies in its own namespace, `envoy-gateway-system`, which is
# the namespace the overlay's NetworkPolicy `front` lets in.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  namespace: gateway
spec:
  gatewayClassName: envoy
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: rede.example.test
      tls:
        mode: Terminate
        certificateRefs:
          - name: rede-tls
      allowedRoutes:
        namespaces:
          from: All
