# The way in: one hostname on the platform's Gateway (Gateway API), to the OIDC front. The overlay names the
# Gateway and the hostname. TLS ends at the Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rezono
spec:
  parentRefs:
    - name: gateway
      namespace: gateway
  hostnames:
    - rezono.example.org
  rules:
    - backendRefs:
        - name: front
          port: 4180
