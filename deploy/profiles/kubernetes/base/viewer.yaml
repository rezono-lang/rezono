# The viewer as a Node container (adapter-node; REZONO_PROFILE=kubernetes picks it, viewer/vite.config.ts). It reads
# through the gate (REZONO_GATE_URL, inside the cluster), forwarding the reader's bearer token; the gate decides the
# role. ORIGIN, the public address, comes from the overlay's ConfigMap `viewer`. REZONO_DRAFT_KEY seals a draft the
# server showed and is the same in every replica, so it is a secret (rezono-viewer).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: viewer
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: viewer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: viewer
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: viewer
          image: rezono-viewer
          envFrom:
            - configMapRef:
                name: viewer
          env:
            - name: PORT
              value: "3000"
            - name: REZONO_GATE_URL
              value: http://gate:8080
            - name: REZONO_DRAFT_KEY
              valueFrom:
                secretKeyRef: { name: rezono-viewer, key: draft-key }
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            tcpSocket: { port: http }
          livenessProbe:
            tcpSocket: { port: http }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: viewer
spec:
  selector:
    app.kubernetes.io/name: viewer
  ports:
    - { name: http, port: 3000, targetPort: http }
