# The access gate as a Node service (edge/gate/src/node.ts, port 8080). REZONO_AUTH=oidc: it verifies the bearer
# token itself against the issuer's keys and takes the role from a claim (the overlay's ConfigMap `gate`). It
# reads the store with keys that may only read (rezono-gate) and writes nothing of its own. Proposals and live
# `suppose` are components an overlay adds (components/propose, components/live).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gate
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gate
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gate
          image: rezono-gate
          envFrom:
            - configMapRef:
                name: gate
          env:
            - name: PORT
              value: "8080"
            - name: REZONO_AUTH
              value: oidc
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: rezono-gate, key: store-key-id }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: rezono-gate, key: store-secret }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            tcpSocket: { port: http }
          livenessProbe:
            tcpSocket: { port: http }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: gate
spec:
  selector:
    app.kubernetes.io/name: gate
  ports:
    - { name: http, port: 8080, targetPort: http }
