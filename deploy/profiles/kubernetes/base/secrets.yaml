# Secrets come from the platform's secret store through External Secrets (decision X8: names, never values). Each
# ExternalSecret makes one Kubernetes Secret with exactly the keys a container names. The policy
# (policy/secrets.rego) refuses a Secret object in the render, and a reference to a Secret or a key that no
# ExternalSecret of the render makes. The store (the ClusterSecretStore `rezono`) and the values are the owner's.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rezono-front
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: rezono }
  target: { name: rezono-front, creationPolicy: Owner }
  data:
    - { secretKey: client-id, remoteRef: { key: rezono/front, property: client-id } }
    - { secretKey: client-secret, remoteRef: { key: rezono/front, property: client-secret } }
    - { secretKey: cookie-secret, remoteRef: { key: rezono/front, property: cookie-secret } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rezono-viewer
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: rezono }
  target: { name: rezono-viewer, creationPolicy: Owner }
  data:
    - { secretKey: draft-key, remoteRef: { key: rezono/viewer, property: draft-key } }
---
# The gate's store keys may only read the bucket.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rezono-gate
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: rezono }
  target: { name: rezono-gate, creationPolicy: Owner }
  data:
    - { secretKey: store-key-id, remoteRef: { key: rezono/gate, property: store-key-id } }
    - { secretKey: store-secret, remoteRef: { key: rezono/gate, property: store-secret } }
