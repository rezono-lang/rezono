# The engine's secrets: store keys that may only read, the token the gate and the engine share, and the deploy key
# that may only read this repository with the Git host's public keys (deploy/engine/README.md#setting-it-up).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rezono-engine
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: rezono }
  target: { name: rezono-engine, creationPolicy: Owner }
  data:
    - { secretKey: live-token, remoteRef: { key: rezono/engine, property: live-token } }
    - { secretKey: store-key-id, remoteRef: { key: rezono/engine, property: store-key-id } }
    - { secretKey: store-secret, remoteRef: { key: rezono/engine, property: store-secret } }
    - { secretKey: git-key, remoteRef: { key: rezono/engine, property: git-key } }
    - { secretKey: known-hosts, remoteRef: { key: rezono/engine, property: known-hosts } }
