# The dispatch token: it may only start workflows and read pull requests, never push.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rezono-propose
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: rezono }
  target: { name: rezono-propose, creationPolicy: Owner }
  data:
    - { secretKey: dispatch-token, remoteRef: { key: rezono/propose, property: dispatch-token } }
