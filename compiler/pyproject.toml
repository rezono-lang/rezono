[project]
name = "rede-compiler"
version = "0.1.0"
description = "Rede compiler: pack -> engine SQL, sentences and schema bundle"
requires-python = ">=3.11"
dependencies = ["linkml-runtime>=1.9", "pyyaml>=6", "rede-admission", "rede-canon"]  # install: scripts/install-python.sh (docs/ci.md §8)

[project.optional-dependencies]
# The batch backend (decision E1): `rede_compiler explain` and publishing without Feldera.
batch = ["duckdb>=1.1"]
test = ["pytest>=8", "hypothesis>=6.100", "duckdb>=1.1"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# The contracts the compiler reads are package data copied in from contracts/ at build time (setup.py).
[tool.setuptools]
packages = ["rede_compiler", "rede_compiler.operate"]

[tool.pytest.ini_options]
testpaths = ["tests", "../examples"]
