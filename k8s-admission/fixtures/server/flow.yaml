apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: admission-flow-probe, namespace: admission-blue}
spec:
  policyTypes: [Ingress]
  podSelector:
    matchLabels: {rezono.org/service: web}
  ingress:
    - from:
        - podSelector:
            matchLabels: {rezono.org/service: reader}
      ports:
        - {protocol: TCP, port: 443}
