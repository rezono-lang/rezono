id: X04
class: context
status: settled
schema:
  from: fixture.schema.json
  merge:
    kinds:
      Team:
        iri: https://rede.example/people/Team
form: collection
input:
  $rows:
  - $kind: Host
    $id: host-a
    memory_need: 400 GiB
    owner:
      $ref: team-platform
    tags:
    - gpu
  - $kind: Team
    $id: team-platform
expect:
  accept: true
  iris:
  - kind: Host
    id: host-a
    iri: https://rede.example/fixture/Host/host-a
  - kind: Team
    id: team-platform
    iri: https://rede.example/people/Team/team-platform
note: A kind's `iri` carries its namespace, and an element's IRI is built from it (§3.4). `Host` keeps the default `<base>Host`; `Team` lives in another namespace, and the `owner` of `host-a` points there.
sources:
- RV-X21 (arbiter, 11-11-2026)
- docs/ring2/iris.md §4
