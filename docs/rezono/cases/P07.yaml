id: P07
status: open
mode: publish
source: 'check owner_or_small: host.owner is known or host.memory_need <= 450 GiB'
data: appendix-b
given:
- + host-c.memory_need = invalid versions_overlap
expect:
  publication:
    outcome: publishes
    violations: []
    undecided:
    - binder: host-d
      state: unknown
      reason: no_spec
    blocking: []
alternatives:
- by: 'D01 recommendation: an invalid value of class computes blocks on its own'
  expect:
    publication:
      outcome: blocked
      violations: []
      undecided:
      - binder: host-d
        state: unknown
        reason: no_spec
      blocking:
      - host-c
note: host-c's condition is `true or invalid`, which Appendix A makes true, so this check alone does not see the
  contradiction.
sources:
- rezono/README.md, What a check statement decides
