id: T03
status: settled
mode: evaluate
declare: |
  enum Duty = platform | other

  extend Host
    derived duty: Duty
      table first
        | owner         | -> duty  |
        | team-platform | platform |
        | -             | other    |
source: ask Host where duty = other
data: appendix-b
expect:
  answer:
    rows:
    - host-b
    - host-d
    undecided:
    - binder: host-a
      state: unknown
      reason: not_assigned
    not_applicable: 0
note: 'first: a test on an n/a owner does not apply and `-` takes any value in any state; an undecided row before the first
  applying row, with another output, makes the value undecided.'
sources:
- docs/rezono/tables.md §3, §4 (RV-C24)
- v0 §5c
