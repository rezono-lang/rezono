# Conformance cases for value semantics (S1), a draft for coordinator 12. Not normative: see
# docs/semantics/values.md, "Status". A case changes nothing until coordinator 12 adopts it in
# docs/decisions.md.
#
# Each case has:
#   id         a stable slug; values.md refers to it
#   topic      the section of values.md it tests
#   input      what is evaluated: a slot, a row set, an expression or a document
#   status     settled  decided: by a decision, an owner decision, or language and publication specifications that agree;
#                       where main does not do it yet, `current` says what it does instead,
#                       and a settled case without `agree` is not built yet;
#              open     they disagree (values.md §8.2), so the case is a proposal;
#              gap      proposed here, adopted nowhere yet
#   expect     settled cases only: the agreed result (state and reason, a truth value, a hash form
#              or a refusal); every state comes with its reason, "" where none is given
#   proposed   open and gap cases only: the result this draft proposes; not yet a decision
#   current    what main at `commit` gives instead, per place (code, contract, fixture or a doc on
#              main), as {at, gives}; always on open and gap cases, and on settled cases not built
#              yet. The places are those of `commit`; B06 verifies them again on its own base.
#   conflicts  open and gap cases: specs not yet in code that say something else
#   agree      places on main that already give the expected or proposed result
#   sources    where the expected or proposed result comes from
#
# Unless a case says otherwise, the schema comes from rezono/test/fixture.schema.json
# and the data its Appendix B: host-a owner unknown not_assigned, memory_need 400 GiB; host-b owner
# n/a, 200 GiB; host-c owner team-platform, 512 GiB; host-d owner n/a, memory_need unknown no_spec.
# Truth values: T true, F false, N n/a, U unknown, I invalid.

version: 1
spec: docs/semantics/values.md
commit: f67c5559

states:
  # name, code (precedence), Rezono spelling, row JSON form, hash state name
  - {name: known, code: 0, rezono: "", row: "<value>", hash: "<payload>"}
  - {name: not_applicable, code: 1, rezono: "n/a", row: '{"$na": r}', hash: '{"$state": "not_applicable", "$reason": r}'}
  - {name: unknown, code: 2, rezono: "unknown", row: '{"$unknown": r}', hash: '{"$state": "unknown", "$reason": r}'}
  - {name: invalid, code: 3, rezono: "invalid", row: '{"$invalid": r}', hash: '{"$state": "invalid", "$reason": r}'}

core_reasons:
  # code: states it may label (JSON-LS L0 §2.3; Rezono v0 §5)
  no_version_applies: [unknown]
  versions_overlap: [invalid]
  exception_conflict: [invalid]
  no_row_applies: [unknown]
  ambiguous_date: [invalid]
  empty: [not_applicable]
  added_later: [known, not_applicable, unknown, invalid]
  not_read_in_full: [unknown]   # values.md §4: a single value missing from a relation the role reads in part
  overflow: [invalid]           # gap: proposed in values.md §2.3, adopted nowhere yet

tables:
  # P10.2a Appendix A, as proposed (main differs: cases tt-and-false-invalid, tt-or-true-invalid).
  # Row a, column b, in the order of `order`. `and` and `or` are commutative; `imply` is not.
  order: [T, F, N, U, I]
  and:
    T: [T, F, N, U, I]
    F: [F, F, F, F, F]
    N: [N, F, N, U, I]
    U: [U, F, U, U, I]
    I: [I, F, I, I, I]
  or:
    T: [T, T, T, T, T]
    F: [T, F, N, U, I]
    N: [T, N, N, U, I]
    U: [T, U, U, U, I]
    I: [T, I, I, I, I]
  imply:
    T: [T, F, N, U, I]
    F: [T, T, T, T, T]
    N: [T, N, N, U, I]
    U: [T, U, U, U, I]
    I: [T, I, I, I, I]
  not: [F, T, N, U, I]
  # x is known / n/a / unknown / invalid, for x known, n/a, unknown, invalid
  is:
    known: [T, F, F, F]
    n/a: [F, T, F, F]
    unknown: [F, F, T, F]
    invalid: [F, F, F, T]
  # strict operators: all known, compute; else the highest state, N < U < I
  strict_order: [N, U, I]

