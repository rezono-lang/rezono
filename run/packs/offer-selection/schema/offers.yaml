id: https://rezono.org/examples/run/offer-selection
name: offer_selection
in_language: en
imports:
  - linkml:types
default_range: string
annotations:
  layer: facts

classes:
  Offer:
    attributes:
      id: {identifier: true}
      price_micros: {range: integer, minimum_value: 0}
      setup_price_micros: {range: integer, minimum_value: 0}
      period_price_minor:
        range: integer
        minimum_value: 0
        annotations:
          explore: {value: {min: 499, max: 501, step: 1}}
      setup_price_minor: {range: integer, minimum_value: 0}
      guarantee_mode: {range: GuaranteeMode}
      provider: {}
      tie_rank: {range: integer, required: true}
      stock: {range: integer, minimum_value: 0, required: true}
      free_disks: {range: integer, minimum_value: 0, required: true}
      virtualization: {required: true}
      boot: {required: true}
      currency: {required: true}
  Demand:
    attributes:
      id: {identifier: true}
      quantity: {range: integer, minimum_value: 1, required: true}
      billed_periods: {range: integer, minimum_value: 1}
      amount_unit: {range: AmountUnit}
      boot: {required: true}
      currency: {required: true}
  Guarantee:
    description: A provider record covering a particular offer for a particular order.
    attributes:
      id: {identifier: true}
      demand: {range: Demand, required: true}
      offer: {range: Offer, required: true}
      provider: {required: true}
      currency: {required: true}
      scope: {required: true}
      mode: {required: true}
      total_micros: {range: integer, minimum_value: 0}
      total_minor: {range: integer, minimum_value: 0}
      period_price_minor: {range: integer, minimum_value: 0}
      setup_price_minor: {range: integer, minimum_value: 0}
      quantity: {range: integer, minimum_value: 1}
      billed_periods: {range: integer, minimum_value: 1}

enums:
  AmountUnit:
    permissible_values:
      micros:
      minor:
  GuaranteeMode:
    permissible_values:
      estimate:
      binding_quote:
      reject_above:
