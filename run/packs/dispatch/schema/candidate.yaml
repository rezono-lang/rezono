id: https://rezono.org/examples/run/dispatch
name: dispatch
in_language: en
imports:
  - linkml:types
default_range: string
annotations:
  layer: facts

types:
  PlanDigest:
    typeof: string
    pattern: '^[0-9a-f]{64}$'
  CurrencyCode:
    typeof: string
    pattern: '^[A-Z]{3}$'

enums:
  ApprovalDecision:
    permissible_values:
      approve:
      decline:

classes:
  Candidate:
    description: A proposed dispatch attempt.
    attributes:
      id: {identifier: true}
  Plan:
    attributes:
      id: {identifier: true}
      candidate: {range: Candidate, required: true}
      plan_hash: {range: PlanDigest}
      currency: {range: CurrencyCode}
  Quote:
    attributes:
      id: {identifier: true}
      candidate: {range: Candidate, required: true}
      plan_hash: {range: PlanDigest}
      currency: {range: CurrencyCode}
      cost_micros: {range: integer, minimum_value: 0}
  Approval:
    attributes:
      id: {identifier: true}
      candidate: {range: Candidate, required: true}
      plan_hash: {range: PlanDigest}
      currency: {range: CurrencyCode}
      decision: {range: ApprovalDecision}
      cap_micros: {range: integer, minimum_value: 0}
      expires_us: {range: integer}
  Observation:
    attributes:
      id: {identifier: true}
      candidate: {range: Candidate, required: true}
      event_us: {range: integer}
