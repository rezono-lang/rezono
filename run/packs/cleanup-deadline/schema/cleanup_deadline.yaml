id: https://rezono.org/run/cleanup-deadline
name: cleanup_deadline
description: Recorded cleanup deadline and observation watermark for an effect attempt.
in_language: en
imports: [linkml:types, "std-loop:effect"]
default_range: string
annotations:
  layer: facts

classes:
  Attempt:
    attributes:
      id: {identifier: true}
      state: {range: LoopEffectState, required: true}
      deadline_us: {range: integer, required: true}
      watermark_us: {range: integer}
