id: https://rezono.org/run/provider-terms
name: provider_terms
description: Provider order terms, usage-billed detail types, and quote guarantee rules.
in_language: en
imports: [linkml:types]
default_range: string
annotations:
  layer: facts

classes:
  UsageDetailType:
    description: A provider order detail type billed by usage, which gives no quote guarantee.
    attributes:
      id: {identifier: true}
  QuotePolicy:
    description: The quote mode assigned by the provider terms to a valid non-usage order.
    attributes:
      id: {identifier: true}
      mode: {required: true}
  OrderStatus:
    description: A provider order status string and the run outcome it maps to.
    attributes:
      id: {identifier: true}
      outcome: {required: true}
  Order:
    description: A provider order with its expiry and approved day end in UTC microseconds, or its status.
    attributes:
      id: {identifier: true}
      expiration_us: {range: integer}
      day_end_us: {range: integer}
      status: {range: string}
  OrderDetail:
    description: One detail line of a provider order and its provider detail type.
    attributes:
      id: {identifier: true}
      order: {range: Order, required: true}
      detail_type: {required: true}
  RenewFieldBlock:
    description: A provider renew boolean field and the value at which it blocks a run.
    attributes:
      id: {identifier: true}
      blocked_when: {range: boolean, required: true}
      code: {required: true}
  Service:
    description: A provider service record with deadline, expiration, and engagement bounds in UTC microseconds.
    attributes:
      id: {identifier: true}
      deadline_us: {range: integer, required: true}
      expiration_us: {range: integer}
      engaged_known: {range: boolean}
      engaged_up_to_us: {range: integer}
  ServiceRenewFlag:
    description: One boolean field observed in a service's renew object.
    attributes:
      id: {identifier: true}
      service: {range: Service, required: true}
      field: {required: true}
      value: {range: boolean, required: true}
