id: https://rezono.org/build/tasks
name: build_tasks
description: Observed tasks, queue readings and the decisions governing build placement.
imports: [linkml:types, selection, "std-loop:loop_inputs", "std-decision:decision"]
default_range: string
annotations:
  layer: facts

enums:
  BuildQueuePullState:
    permissible_values:
      open:
      closed:
  BuildQueueDraft:
    permissible_values:
      draft:
      ready:

classes:
  BuildTask:
    description: A task observed by the scanner and linked to its reconciliation step.
    attributes:
      id: {identifier: true}
      run: {range: BuildRun, required: true}
      step: {range: LoopStep, required: true}
      track: {required: true}
      source: {required: true}
  BuildPolicyDate:
    description: A reference day asserted for an observation cut and checked against its recorded UTC timestamp.
    attributes:
      id: {identifier: true}
      run: {range: BuildRun, required: true}
      reference: {range: ReferenceDate, required: true}
      observed_at: {range: integer, required: true}
  BuildTrackRank:
    description: The priority an effective decision assigns to a track.
    attributes:
      id: {identifier: true}
      decision: {range: Decision, required: true}
      track: {required: true}
      rank: {range: integer, minimum_value: 0, required: true}
  BuildQueueLimit:
    description: The planner threshold established by a build policy decision.
    attributes:
      id: {identifier: true}
      decision: {range: Decision, required: true}
      limit: {range: integer, minimum_value: 0, required: true}
  BuildQueueReading:
    description: A count from the queue reader at this observation cut, with the receipt of its complete listing.
    attributes:
      id: {identifier: true}
      run: {range: BuildRun, required: true}
      observed_at: {range: integer, required: true}
      count: {range: integer, minimum_value: 0, required: true}
      source: {required: true}
      receipt: {range: LoopSweepReceipt}
  BuildQueueListing:
    description: >-
      A complete pull request listing against a base branch at this observation cut, with the receipt that attests
      it.
    attributes:
      id: {identifier: true}
      run: {range: BuildRun, required: true}
      observed_at: {range: integer, required: true}
      base: {required: true}
      source: {required: true}
      receipt: {range: LoopSweepReceipt}
  BuildQueuePull:
    description: One pull request in a queue listing, with its state, draft flag and base branch.
    attributes:
      id: {identifier: true}
      listing: {range: BuildQueueListing, required: true}
      number: {range: integer, minimum_value: 0, required: true}
      state: {range: BuildQueuePullState, required: true}
      draft: {range: BuildQueueDraft, required: true}
      base: {required: true}
