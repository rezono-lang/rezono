# What the checker reports for each proof in contracts/fixtures/proof/Proof/valid, with the rules in rules.yaml.
# A fixture can be valid for the schema and still be rejected here.
negation: []
aggregation-known: []
aggregation-unknown: []
screened: []
cycle: [cycle]
