[project]
name = "rezono-checker"
version = "0.1.0"
description = "Checks Rezono proofs against a manifest, independent of the engine."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "rezono-canon"]  # install: scripts/install-python.sh (docs/ci.md §8)

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6.100"]
contracts = ["linkml>=1.9"]

[project.scripts]
rezono-checker = "rezono_checker.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rezono_checker"]

[tool.setuptools.package-data]
rezono_checker = ["messages/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
